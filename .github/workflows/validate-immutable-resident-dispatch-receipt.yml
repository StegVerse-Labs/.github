name: Validate immutable resident dispatch receipt retention
on:
  pull_request:
    paths:
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'tests/test_immutable_resident_dispatch_receipt.py'
      - '.github/workflows/validate-immutable-resident-dispatch-receipt.yml'
  push:
    paths:
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'tests/test_immutable_resident_dispatch_receipt.py'
      - '.github/workflows/validate-immutable-resident-dispatch-receipt.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run immutable dispatch receipt regression
        run: python -m unittest discover -s tests -p 'test_immutable_resident_dispatch_receipt.py' -v
