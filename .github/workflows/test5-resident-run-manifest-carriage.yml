name: Test 5 Resident Run-Manifest Carriage
on:
  push:
    branches: ["task/test5-resident-run-manifest-consumer"]
  pull_request:
    paths:
      - "scripts/consume_sdk_test5_stegbrowser_llm_profile_request.py"
      - "scripts/dispatch_resident_execution_requests.py"
      - "scripts/refresh_sovereign_worker_runtime_source.py"
      - "control/resident-execution-request.d/sdk-test5-stegbrowser-llm-profile-001.json"
      - "tests/test_sdk_test5_stegbrowser_resident.py"
      - ".github/workflows/test5-resident-run-manifest-carriage.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile scripts/consume_sdk_test5_stegbrowser_llm_profile_request.py scripts/dispatch_resident_execution_requests.py
      - run: python -m pip install -q pytest
      - run: pytest -q tests/test_sdk_test5_stegbrowser_resident.py
