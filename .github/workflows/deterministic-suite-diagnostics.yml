# Validation-only diagnostic carrier for the complete deterministic repository suite.
# This workflow has no runtime, scheduler, activation, repository-mutation, credential,
# claim, fence, routing, transition, or completion authority. It transports validation
# evidence only so a failing exact-source suite can be remediated without UI-log scraping.
name: Deterministic Repository Suite - Diagnostic Evidence Only

on:
  pull_request:
    paths:
      - 'handoffs/**'
      - 'heartbeat_runtime/**'
      - 'workers/**'
      - 'tests/**'
      - 'control/**'
      - 'cost-basis/worker-runtime/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/deterministic-suite-diagnostics.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deterministic-suite-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-suite-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous exact-source checkout without GitHub token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/stegverse-ci-bin ci-evidence/repair-candidates
          ln -sf "$(command -v python3)" /tmp/stegverse-ci-bin/python
          echo /tmp/stegverse-ci-bin >> "$GITHUB_PATH"
          git rev-parse HEAD > ci-evidence/tested-commit.txt

      - name: Prove diagnostic environment has no GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_PAT:-}"
          echo NO_GITHUB_CREDENTIAL_TOKEN_PRESENT

      - name: Run complete deterministic repository suite with durable diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m unittest discover -v tests 2>&1 | tee ci-evidence/deterministic-suite.log
          suite_status=${PIPESTATUS[0]}
          export SUITE_STATUS="$suite_status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_dir = Path('ci-evidence')
          log_path = evidence_dir / 'deterministic-suite.log'
          tested_commit = (evidence_dir / 'tested-commit.txt').read_text(encoding='utf-8').strip()
          log_text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''

          markers = []
          for line in log_text.splitlines():
              stripped = line.strip()
              if (
                  stripped.startswith('FAIL:')
                  or stripped.startswith('ERROR:')
                  or 'AssertionError' in stripped
                  or stripped.startswith('FAILED (')
              ):
                  markers.append(stripped)

          payload = {
              'schema': 'stegverse.validation-diagnostic-evidence/v1',
              'suite': 'python -m unittest discover -v tests',
              'status': 'PASS' if os.environ['SUITE_STATUS'] == '0' else 'FAIL',
              'exit_code': int(os.environ['SUITE_STATUS']),
              'tested_commit': tested_commit,
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'event_name': os.environ.get('GITHUB_EVENT_NAME'),
                  'ref': os.environ.get('GITHUB_REF'),
                  'sha': os.environ.get('GITHUB_SHA'),
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'job': os.environ.get('GITHUB_JOB'),
              },
              'diagnostic_markers': markers,
              'log_file': 'deterministic-suite.log',
              'authority_effect': 'NONE_VALIDATION_EVIDENCE_ONLY',
              'runtime_truth_inference': False,
              'execution_admission_inference': False,
          }
          (evidence_dir / 'deterministic-suite.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, sort_keys=True))
          PY
          exit "$suite_status"

      - name: Emit exact canonical reconciliation gaps and repair candidates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          out = root / 'ci-evidence/repair-candidates'
          out.mkdir(parents=True, exist_ok=True)

          def load(path):
              return json.loads((root / path).read_text(encoding='utf-8'))

          registry_paths = [
              root / 'control/worker-registry.json',
              root / 'control/organization-task-registry.json',
              *sorted((root / 'control/worker-registry.d').glob('*.json')),
          ]
          task_locations = {}
          worker_tasks = {}
          org_tasks = {}
          vectorized_registry = {}
          for path in registry_paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              rel = path.as_posix()
              is_org = rel == 'control/organization-task-registry.json'
              for task in data.get('tasks', []):
                  task_id = task.get('task_id')
                  if not isinstance(task_id, str) or not task_id:
                      continue
                  task_locations.setdefault(task_id, []).append(rel)
                  if is_org:
                      org_tasks[task_id] = task
                  else:
                      worker_tasks[task_id] = task
                  if isinstance(task.get('source_state_vector_ref'), str) and task.get('source_state_vector_ref'):
                      vectorized_registry.setdefault(task_id, []).append((rel, task))

          index = load('control/task-vector-index.json')
          repaired_index = json.loads(json.dumps(index))
          repaired_bindings = []
          base_orphans = []
          for row in repaired_index.get('tasks', []):
              task_id = row.get('task_id')
              candidates = vectorized_registry.get(task_id, [])
              if not candidates:
                  base_orphans.append(task_id)
                  continue
              exact = [pair for pair in candidates if pair[1].get('source_state_vector_ref') == row.get('source_state_vector_ref')]
              selected = exact if exact else candidates
              if len(selected) == 1:
                  correct_ref = selected[0][0]
                  if row.get('registry_ref') != correct_ref:
                      repaired_bindings.append({
                          'task_id': task_id,
                          'from': row.get('registry_ref'),
                          'to': correct_ref,
                      })
                      row['registry_ref'] = correct_ref

          effective = {row['task_id']: row for row in repaired_index.get('tasks', [])}
          for path in sorted((root / 'control/task-vector-index.d').glob('*.json')):
              row = json.loads(path.read_text(encoding='utf-8'))
              if row.get('schema') == 'stegverse.cosv-task-vector-index-entry/v1':
                  effective.setdefault(row['task_id'], row)

          worker_ids = set(worker_tasks)
          worker_indexed = sorted(task_id for task_id in effective if task_id in worker_ids)
          missing_worker = sorted(worker_ids - set(worker_indexed))
          completed_historical = sorted(
              task_id for task_id in missing_worker
              if str(worker_tasks[task_id].get('state') or '').upper() == 'COMPLETED'
          )
          superseded_historical = sorted(
              task_id for task_id in missing_worker
              if str(worker_tasks[task_id].get('state') or '').upper() == 'SUPERSEDED'
          )
          active_missing = sorted(set(missing_worker) - set(completed_historical) - set(superseded_historical))

          org_ids = set(org_tasks)
          org_indexed = sorted(task_id for task_id in effective if task_id in org_ids)
          org_active_missing = sorted(org_ids - set(org_indexed))

          coverage = load('control/cosv-global-registry-coverage.json')
          repaired_coverage = json.loads(json.dumps(coverage))
          repaired_coverage['worker_registry_summary'] = {
              'unique_task_ids_global_plus_fragments': len(worker_ids),
              'canonically_indexed_task_ids': len(worker_indexed),
              'completed_only_historical_unvectorized_task_ids': len(completed_historical),
              'active_unvectorized_unique_task_ids': len(active_missing),
              'superseded_historical_unvectorized_task_ids': len(superseded_historical),
          }
          repaired_coverage['organization_registry_summary'] = {
              'active_task_ids': len(org_ids),
              'canonically_vectorized_task_ids': len(org_indexed),
              'active_unvectorized_task_ids': len(org_active_missing),
          }
          repaired_coverage['total_active_unvectorized_unique_task_ids'] = len(active_missing) + len(org_active_missing)
          repaired_coverage['active_worker_task_ids_missing_canonical_cosv'] = active_missing
          repaired_coverage['active_organization_task_ids_missing_canonical_cosv'] = org_active_missing
          if isinstance(repaired_coverage.get('worker_denominator_closure'), dict):
              repaired_coverage['worker_denominator_closure'].update({
                  'active_worker_tasks_vectorized': len(worker_indexed),
                  'active_worker_tasks_unvectorized': len(active_missing),
                  'completed_historical_unvectorized': len(completed_historical),
                  'superseded_historical_unvectorized': len(superseded_historical),
                  'total_unique_worker_task_ids': len(worker_ids),
              })

          registry = load('data/canonical-task-registry.json')
          canonical_vectorized = {
              task.get('task_id') for task in registry.get('tasks', [])
              if isinstance(task.get('task_id'), str)
              and isinstance(task.get('source_state_vector_ref'), str)
              and task.get('source_state_vector_ref')
          }
          missing_index_for_registry = sorted(canonical_vectorized - set(effective))

          payload = {
              'schema': 'stegverse.validation-reconciliation-diagnostic/v2',
              'worker_unique_count': len(worker_ids),
              'worker_indexed_count': len(worker_indexed),
              'worker_unindexed_ids': missing_worker,
              'completed_historical_unindexed_ids': completed_historical,
              'superseded_historical_unindexed_ids': superseded_historical,
              'active_worker_unindexed_ids': active_missing,
              'organization_unindexed_ids': org_active_missing,
              'base_index_ids_without_vectorized_registry_source': base_orphans,
              'repaired_index_registry_bindings': repaired_bindings,
              'registry_vectorized_missing_index': missing_index_for_registry,
              'coverage_worker_summary_before': coverage.get('worker_registry_summary'),
              'coverage_worker_summary_candidate': repaired_coverage.get('worker_registry_summary'),
              'authority_effect': 'NONE_VALIDATION_EVIDENCE_ONLY',
          }
          Path('ci-evidence/reconciliation.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'task-vector-index.json').write_text(json.dumps(repaired_index, indent=2) + '\n', encoding='utf-8')
          (out / 'cosv-global-registry-coverage.json').write_text(json.dumps(repaired_coverage, indent=2) + '\n', encoding='utf-8')
          print('RECONCILIATION_DIAGNOSTIC=' + json.dumps(payload, sort_keys=True))
          PY

      - name: Upload deterministic suite diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-suite-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Prove diagnostic workflow remains non-authorizing
        if: always()
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_PAT:-}"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/deterministic-suite-diagnostics.yml').read_text(encoding='utf-8')
          assert 'permissions: {}' in text
          assert 'repository-mutation' in text
          assert 'authority_effect' in text
          assert 'NONE_VALIDATION_EVIDENCE_ONLY' in text
          print('DETERMINISTIC_DIAGNOSTIC_NON_AUTHORIZING_PASS')
          PY
