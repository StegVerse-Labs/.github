name: Test suite ratchet

# Every pull request, with no path filter. Every other workflow in this
# repository names an explicit file list, so a test no workflow mentions is
# never run by CI - 562 of 662 test files at the time this was added. That is
# how a cross-repository seam break shipped with both repositories green.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing at workflow scope. Each job declares the only scope
# it uses (contents: read, for actions/checkout); artifact upload uses the
# runner's ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  ratchet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # the drift bisection walks main's first-parent history back to the commit that wrote the baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.2.0

      - name: Explicitly run physical emission provenance fixtures PE-01..PE-08
        run: python -m unittest -v tests/patents/test_physical_emission_2626.py

      - name: Verify physical-emission canonical golden vectors GV-A1 through GV-C3
        run: python -m unittest -v tests/patents/test_physical_emission_golden_vectors_2626.py

      # Run directly so a spec-guard failure is never absorbed into the baseline.
      - name: RT-INVARIANT-EVALUATION-001 spec guard, the B-P6 probe set as data
        run: python -m unittest -v tests/test_invariant_evaluation_probes.py

      # Baseline integrity runs the BASE's checker, never the PR's: a pull_request job checks out the PR merge
      # ref, so a PR that edits scripts/check_test_suite_ratchet.py would otherwise grade itself. The exact base
      # is checked out as a read-only worktree (the canonical-task-registration-transition.yml pattern) and its
      # checker reads the PR's data/test-suite-baseline.json as data only. Bootstrap: while the base's checker
      # has no --base-sha (only before this gate first lands on main) the head's checker runs and says so.
      - name: Reject PR expansion of known failures or exclusions against exact base (base checker)
        if: github.event_name == 'pull_request'
        env:
          RATCHET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add -q --detach "$RUNNER_TEMP/ratchet-base" "$RATCHET_BASE_SHA"
          checker="$RUNNER_TEMP/ratchet-base/scripts/check_test_suite_ratchet.py"
          if ! grep -q -- '--base-sha' "$checker"; then
            echo "TEST_SUITE_RATCHET: BOOTSTRAP base $RATCHET_BASE_SHA has no baseline integrity checker; head checker used"
            checker="$GITHUB_WORKSPACE/scripts/check_test_suite_ratchet.py"
          fi
          status=0
          (cd "$RUNNER_TEMP/ratchet-base" && python "$checker" --base-sha "$RATCHET_BASE_SHA" \
            --baseline "$GITHUB_WORKSPACE/data/test-suite-baseline.json") || status=$?
          git worktree remove --force "$RUNNER_TEMP/ratchet-base"
          exit $status

      # Read-only inputs, fetched before the suite runs: this repository's own organization ledger ref
      # (one anonymous fetch of a public ref; no credential, no polling) - it is the drift receipt's
      # epoch source (its hb_reference.epoch; no clock is read) and the clone
      # tests/test_sv_change_base_state_readback_component.py's known-answer test needs
      # (RTC014_LIVE_LABS_REPO, ledger head a5bb54d8 is on it), which was skipped while this checkout
      # did not hold the ref - and StegVerse-org/.github's main-change receipt writer at its pin.
      # When either is unreadable the receipt says so in six fields and the known-answer test fails; it
      # never guesses.
      - name: Organization ledger ref and the pinned main-change receipt writer, read-only
        run: |
          git -c 'http.https://github.com/.extraheader=' fetch --no-tags --quiet origin \
            '+refs/stegverse/organization-ledger:refs/stegverse/organization-ledger' || echo "organization ledger ref not fetched"
          if git -c 'http.https://github.com/.extraheader=' fetch --no-tags --quiet --depth=1 \
              https://github.com/StegVerse-org/.github 7638b006ef9da2d65240576c706482b9ecc4153f; then
            git show FETCH_HEAD:resident-runtime/main_change_receipt.py > /tmp/main_change_receipt.py
          else
            echo "main-change receipt writer not fetched"
          fi

      # One suite run feeds the comparison. 0 is all passed and 1 is some failed; any other status
      # (interrupted, internal error, usage error, nothing collected) is not a suite result. The junit
      # record and -rfEsxX name every skipped, xfailed, xpassed and uncollected test, so the next step
      # can fail closed on each (REQUIRED_VERIFICATION_SKIPPED); a skip is never a pass.
      # The suite is split into callable test sets (.stegverse/test-sets.json, generated from
      # .stegverse/test-set-spec.json by scripts/test_set_selection.py). A pull request runs the core set
      # and every set a diff path reaches; a diff path no set declares, an unreadable diff, a change to
      # what shapes selection, or a stale manifest selects EVERY set. A push to main selects every set.
      # Unselected sets are not run and not reported as skipped; the sealed selection names each selected
      # set and the diff path / declared surface that selected it. A selected set whose input is
      # unavailable is not run: it is a six-field REQUIRED_VERIFICATION_INPUT_UNAVAILABLE item routed to
      # that input's owner, and blocks only changes that select it.
      # Pinned SDK verification inputs (StegVerse-org/.github#163, P1): every pin a `pinned_source` input of the spec
      # declares is fetched at its exact commit with one anonymous git fetch (no package index, nothing installed),
      # only its declared module paths are extracted, and every file is re-hashed against
      # .stegverse/verification-inputs/stegverse-sdk.json. A pin that does not verify is printed in six fields and its
      # env is not set, so the selector reports the sets that need it as REQUIRED_VERIFICATION_INPUT_UNAVAILABLE.
      - name: Pinned SDK verification inputs (exact commits, sha256-checked, read-only)
        run: |
          python scripts/pinned_source_input.py declared --spec .stegverse/test-set-spec.json \
            --dest-root "$RUNNER_TEMP/pinned-inputs" --env-out "$GITHUB_ENV" \
            --retry-entrypoint ".github/workflows/test-suite-ratchet.yml ratchet"

      - name: Select the test sets this change requires
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RTC014_LIVE_LABS_REPO: ${{ github.workspace }}
        run: |
          # the sealed selection binds head_sha (this merge ref), its parents, base_sha and the PR head
          base=()
          if [ "$EVENT_NAME" = "pull_request" ]; then base=(--base "$BASE_SHA" --pr-head "$HEAD_SHA"); fi
          python scripts/test_set_selection.py select --manifest .stegverse/test-sets.json \
            --spec .stegverse/test-set-spec.json "${base[@]}" --head HEAD \
            --retry-entrypoint ".github/workflows/test-suite-ratchet.yml ratchet" \
            --out /tmp/test-set-selection.json --args-out /tmp/test-set-args.txt || true
          test -s /tmp/test-set-args.txt

      - name: Run the selected sets once
        env:
          # the checkout holds refs/stegverse/organization-ledger (step above): the live-repo known answer runs
          RTC014_LIVE_LABS_REPO: ${{ github.workspace }}
        # each run group (the pinned inputs its sets declare) runs once, in its own process with only its pin's
        # exports; sets that declare no pinned input run exactly as before. One output, one merged junit record.
        run: |
          set +e
          python scripts/test_set_selection.py run --selection /tmp/test-set-selection.json \
            --out /tmp/pytest-suite.txt --junit-xml /tmp/pytest-suite.xml -- -q --tb=no -p no:cacheprovider -rfEsxX
          status=$?
          set -e
          grep -E '^### test-set run group |(passed|failed|error).* in [0-9.]+s' /tmp/pytest-suite.txt | tail -n 8
          test "$status" -le 1

      # The ratchet's own comparison (run_suite/compare), made drift-aware by
      # scripts/test_suite_baseline_drift.py. Pull request: a failure that also fails on the exact base
      # and that the change's diff does not touch is a receipted PRE_EXISTING_BASELINE_FAILURE and the
      # change proceeds; a failure the change introduces or touches is FAIL_CLOSED. Push to main: the
      # drift receipt names each drifted test and its first failing commit (bisected), with the
      # dependency review and the scoped repair task. Nothing is appended to or dispatched at a ledger.
      # Required verification (Rigel's standing rule): every skipped, xfailed, xpassed or uncollected
      # test, every test present at the base and not run at the head, every test of a module
      # cross-task-coordination-validation.yml lists that did not run here (its pytest-only functions
      # are delegated to this job), a path-filtered workflow left unrun on a change to a file it runs,
      # and a pull_request job present at the base and missing at the head are each FAIL_CLOSED
      # REQUIRED_VERIFICATION_SKIPPED, never PRE_EXISTING_BASELINE_FAILURE.
      - name: No pull request may add a test failure the baseline does not hold, or skip a test
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"   # the merge ref was built from the exact head
            mode=(pr --base "$BASE_SHA" --path-filter-check)
          else
            mode=(detect)
          fi
          python scripts/test_suite_baseline_drift.py "${mode[@]}" \
            --pytest-output /tmp/pytest-suite.txt \
            --junit-xml /tmp/pytest-suite.xml \
            --selection /tmp/test-set-selection.json \
            --required-unittest-modules-from .github/workflows/cross-task-coordination-validation.yml \
            --writer /tmp/main_change_receipt.py \
            --writer-sha256 884168399f8ac54309aac86af6ab34481635de54426f635bb2229eb5073e2ebf \
            --out-dir /tmp/baseline-drift

      - name: Publish the run as Healer-intake findings
        if: always()
        run: |
          # findings from the one run above (the selected sets); nothing is run a second time
          python - <<'PY'
          import json, re, sys
          sys.path.insert(0, "scripts")
          from check_test_suite_ratchet import BASELINE, GATE, REPAIR, compare, load_baseline
          from registry_gate_findings import evaluation, finding
          try:
              text = open("/tmp/pytest-suite.txt", encoding="utf-8").read()
          except OSError:
              text = ""
          observed = {m.group(1) for l in text.splitlines() if (m := re.match(r"^(?:FAILED|ERROR)\s+(\S+)", l))}
          report = compare(observed, load_baseline(BASELINE))
          rows = [finding(gate=GATE, task_id=t, predicate_id="NO_NEW_TEST_FAILURE",
                          detail=f"{t} fails on this head and is not in the baseline", evidence=[str(BASELINE)],
                          repair=REPAIR, retry_entrypoint="test-suite-ratchet.yml ratchet")
                  for t in report["newly_failing"]]
          out = evaluation(GATE, rows)
          open("/tmp/test-suite-ratchet.json", "w", encoding="utf-8").write(json.dumps(out, indent=2, sort_keys=True))
          print(f"TEST_SUITE_RATCHET findings={out['finding_count']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-suite-ratchet
          path: |
            /tmp/test-suite-ratchet.json
            /tmp/test-set-selection.json
            /tmp/pytest-suite.txt
            /tmp/pytest-suite.xml
            /tmp/baseline-drift/
          if-no-files-found: warn

  # Source validators that are not tests under tests/, consolidated here from
  # the per-feature workflows retired under StegVerse-Labs/.github#3039 (H6b).
  # They run on every pull request and every push to main, with no path filter,
  # so no assertion is narrowed to the file list its old workflow named. Tests
  # under tests/ are not repeated: the ratchet job above runs every one of them.
  # Validation only: nothing here executes work or confers authority.
  consolidated-source-validators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0

      # from governance-endpoint-validation.yml
      - name: The kernel's mesh and node state are supplied, never derived from the host
        if: ${{ !cancelled() }}
        run: python org-kernel/tests/test_kernel.py

      # The organization governance decision run: locator binding, the mesh
      # union, consume_and_respond over a copy of a real request frame, the
      # fast-forward publish and its read back, and replay as a no-op. Temporary
      # repositories only. Run directly so a failure here is never absorbed
      # into the ratchet's baseline.
      - name: Organization governance decision run, against temporary repositories
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest -q -p no:cacheprovider tests/test_organization_governance_decision.py
          tests/test_organization_governance_decision_authority.py

      # from component010-checkout-audit.yml
      - name: Assert actionable non-ALLOW Component-010 source projection
        if: ${{ !cancelled() }}
        run: |
          set +e
          python scripts/audit_component010_checkout.py > /tmp/component010-audit.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c 'import json; x=json.load(open("/tmp/component010-audit.json")); assert x["source_projection_disposition"] == "FAIL_CLOSED_STALE_CHECKOUT_EVIDENCE"; assert x["runtime_transition_observed"] is False'

      # from task-work-correlation-validation.yml
      - name: Resolve canonical work identity without runtime authority
        if: ${{ !cancelled() }}
        run: python scripts/resolve_task_work_correlation.py --task-id MYKV-NATIVE-IOS-PACKAGING-DISTRIBUTION-001

      # from test3-richard-seam-acceptance.yml
      - name: Run and assert Test 3 Richard seam acceptance
        if: ${{ !cancelled() }}
        run: |
          python scripts/run_sdk_tt_richard_seam_test3.py --json-out /tmp/test3-result.json
          python -c "import json; p=json.load(open('/tmp/test3-result.json')); assert p['state']=='PASS'; assert p['constitutive_transition']=='ACTIVATE_TASK_AND_CREATE_BIND_WORKER'; print('TEST3_RICHARD_SEAM_ACCEPTANCE_PASS')"

      # from validate-interlock-intr-protocol-vectors.yml
      - name: Verify deterministic synthetic Interlock InTr protocol vectors
        if: ${{ !cancelled() }}
        run: |
          python scripts/verify_interlock_intr_runtime_independent_protocol.py
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('test-vectors/interlock-intr-runtime-independent-protocol-v1.json').read_text())
          assert doc['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert doc['fixtures']['master_records_checkpoint_profile']['external_conformance_claimed'] is False
          print('INTERLOCK_INTR_VECTOR_VALIDATION_NON_AUTHORIZING_PASS')
          PY

      # from validate-master-records-checkpoint.yml
      - name: Verify deterministic synthetic Master Records checkpoint vectors
        if: ${{ !cancelled() }}
        run: |
          python scripts/verify_master_records_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('test-vectors/master-records-checkpoint-construction-v1.json').read_text())
          b=json.loads(Path('test-vectors/master-records-checkpoint-interoperability-v1.json').read_text())
          assert a['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert b['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert b['runtime_observation']['required_for_documentary_validation'] is False
          assert b['claims']['external_adoption'] is False
          assert b['claims']['external_conformance'] is False
          assert b['claims']['authentic_runtime_execution'] is False
          assert b['claims']['deployment'] is False
          print('MASTER_RECORDS_CHECKPOINT_VALIDATION_NON_AUTHORIZING_PASS')
          PY

      # from validate-organization-role-deployment-packet.yml
      - name: The reference organization passes its own role deployment verifier
        if: ${{ !cancelled() }}
        run: python scripts/verify_organization_role_deployment.py --org-root .

      # from validate-organization-role-runtime-reality.yml
      - name: Validate global invariant block and the deployment declaration
        if: ${{ !cancelled() }}
        run: python scripts/validate_task_registry_global_invariants.py

      # from validate-stegbrowser-intr-retention.yml (this checkout replaces its
      # second anonymous fetch of the same source)
      - name: Validate exact StegBrowser sovereign ingress retention path
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import tests.test_stegbrowser_universal_intr_materialization as t
          tests = [
              t.test_router_is_read_never_written_and_the_route_is_decided_by_the_sdk_installer,
              t.test_node_trigger_is_admitted_write_once_without_authority,
              t.test_tampered_node_trigger_fails_closed,
              t.test_consumer_dispatches_existing_manifest_runner_only_after_exact_binding,
              t.test_executor_preserves_nonce_and_uses_existing_stegos_builders_and_shared_server,
              t.test_browser_carried_opaque_binding_is_persisted_and_resolved_without_filesystem_payload_ref,
              t.test_consumer_maps_opaque_binding_ref_to_ingress_retained_binding_path,
          ]
          for test in tests:
              test()
              print(f"{test.__name__}=PASS")
          PY

      # from validate-purpose-bound-worker-derived-lifetime.yml (its Experiment 3
      # wire test moved to org-runtime-boundary.yml, which already installs the
      # same pinned SDK)
      - name: Validate derived lifetime invariants
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('handoffs/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json').read_text())
          c=h['purpose_bound_worker_request']['transition_cell']['candidate']
          p=c['lifetime_policy']
          assert p['mode']=='DERIVED_COST_TASK_DELAY_BUDGET'
          assert p['production_recompute_required'] is True
          assert h['execution']['lifetime_semantics']['demo_value_is_production_default'] is False
          assert sum(p['time_budget_seconds'].values())==p['derived_max_lifetime_seconds']==c['max_lifetime_seconds']==30
          assert p['decomposition_target']=='RECORDS_ENABLED_PACKET'
          assert h['execution']['lifetime_semantics']['extension_requires_new_governed_recalculation'] is True
          reg=json.loads(Path('data/canonical-task-registry.json').read_text())
          assert reg['generation']>=56  # feature registration floor; canonical generation is monotonic
          task=next(x for x in reg['tasks'] if x['task_id']=='SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001')
          assert task['lifetime_model']['demonstration']['production_default'] is False
          assert task['lifetime_model']['production']['recompute_per_task'] is True
          print('DERIVED_LIFETIME_CONTRACT_PASS')
          PY

      # from aex-stcm-chf-native-capability-audit.yml and
      # validate-conversation-evidence-ingestion.yml
      - name: Parse canonical JSON artifacts
        if: ${{ !cancelled() }}
        run: |
          python -m json.tool data/aex-stcm-chf-native-math-capability-review.json >/dev/null
          python -m json.tool data/aex-native-math-processing-census.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              "contracts/conversation-evidence-service-performance-publication-contract.v1.json",
              "schemas/conversation-evidence-ingestion-package.schema.json",
              "data/canonical-task-records/CONVERSATION-EVIDENCE-INGESTION-CUSTODY-001.json",
          ):
              json.loads(Path(path).read_text(encoding="utf-8"))
          print("CONVERSATION_EVIDENCE_INGESTION_JSON_PARSE_PASS")
          PY

      # py_compile of the scripts and workers the retired workflows compiled:
      # validate-master-records-source-proof.yml, validate-sdk-review-publisher-intr-forward.yml,
      # generic-sdk-manifest-resident.yml, validate-conversation-evidence-ingestion.yml,
      # validate-task-registry-kv-event-projection.yml and the verify job of
      # repository-hygiene-ecosystem-bulk-census.yml
      - name: Compile retired-workflow scripts and workers
        if: ${{ !cancelled() }}
        run: |
          python -m py_compile \
            workers/bootstrap_v1_source_package_production_worker.py \
            scripts/install_sovereign_worker_source_refresh_service.py \
            scripts/consume_publisher_intr_materialization_request.py \
            scripts/consume_sdk_generic_manifest_execution_request.py \
            scripts/dispatch_resident_execution_requests.py \
            scripts/refresh_sovereign_worker_runtime_source.py \
            workers/conversation_evidence_ingestion.py \
            workers/conversation_evidence_ingestion_runtime_worker.py \
            scripts/project_task_registry_event_to_sovereign_kv.py \
            scripts/task_registry_checkin_event_history.py \
            scripts/repository_hygiene_retire_merged_refs.py

  # One job that is green only when every required job above completed and succeeded: a skipped,
  # cancelled or failed job (or one an `if:` left unrun) fails this gate. Validation only.
  required-verification:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [ratchet, consolidated-source-validators]
    permissions: {}
    steps:
      - name: Every required job completed and succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          print(json.dumps({k: v["result"] for k, v in needs.items()}, sort_keys=True))
          if bad or set(needs) != {"ratchet", "consolidated-source-validators"}:
              print("FAIL_CLOSED REQUIRED_VERIFICATION_SKIPPED", json.dumps({
                  "failure_code": "REQUIRED_VERIFICATION_SKIPPED",
                  "failed_predicate": "EVERY_REQUIRED_JOB_COMPLETED_AND_SUCCEEDED",
                  "required_evidence_or_repair": f"jobs not successful: {bad}",
                  "retry_entrypoint": ".github/workflows/test-suite-ratchet.yml (pull_request)",
                  "owning_existing_goal": "StegVerse-org/.github#166",
                  "next_attempt": "the next push to this pull request"}, sort_keys=True))
              raise SystemExit(1)
          PY
