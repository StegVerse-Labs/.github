name: Test suite ratchet

# Every pull request, with no path filter. Every other workflow in this
# repository names an explicit file list, so a test no workflow mentions is
# never run by CI - 562 of 662 test files at the time this was added. That is
# how a cross-repository seam break shipped with both repositories green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing at workflow scope. Each job declares the only scope
# it uses (contents: read, for actions/checkout); artifact upload uses the
# runner's ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  ratchet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest

      - name: Explicitly run physical emission provenance fixtures PE-01..PE-08
        run: python -m unittest -v tests/patents/test_physical_emission_2626.py

      - name: Verify physical-emission canonical golden vectors GV-A1 through GV-C3
        run: python -m unittest -v tests/patents/test_physical_emission_golden_vectors_2626.py

      # Run directly so a spec-guard failure is never absorbed into the baseline.
      - name: RT-INVARIANT-EVALUATION-001 spec guard, the B-P6 probe set as data
        run: python -m unittest -v tests/test_invariant_evaluation_probes.py

      - name: No pull request may add a test failure the baseline does not hold
        run: python scripts/check_test_suite_ratchet.py

      - name: Publish the run as Healer-intake findings
        if: always()
        run: |
          python scripts/check_test_suite_ratchet.py --findings > /tmp/test-suite-ratchet.json || true
          python - <<'PY'
          import json
          report = json.load(open("/tmp/test-suite-ratchet.json", encoding="utf-8"))
          print(f"TEST_SUITE_RATCHET findings={report['finding_count']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-suite-ratchet
          path: /tmp/test-suite-ratchet.json
          if-no-files-found: warn

  # Admission input, separate from the failure ratchet above (which is
  # unchanged, as is its baseline and its drift handling). Rigel's rule: a
  # pull request is admission-input-ready only when every test it needs ran
  # on its exact head with 0 skipped, and the rule never blocks a pull
  # request on tests it does not need. So this job checks out the exact head,
  # selects the tests the change needs from the path-to-test-set map declared
  # in data/test-selection-map.json (scripts/select_tests_for_change.py),
  # runs exactly those, on the head and on the base, and receipts the result:
  # the selected set, each skip with its reason and owner, the count, and the
  # tests not selected for this change (not run for this verdict, never
  # reported as passing). A skip in the selected set fails closed with
  # TEST_SUITE_SKIPPED_ON_HEAD and the six fields; so does a selected test
  # that fails on the head and not on the base. A selected failure the base
  # already had is receipted as pre-existing and does not block. No test is
  # skipped, deselected, converted or marked bypassable here.
  selected-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest

      # Skips satisfied from existing StegVerse sources only, no new
      # third-party dependency: the public StegVerse-SDK at the pin
      # org-runtime-boundary.yml installs, the same way (it declares no
      # dependencies; --no-deps keeps it so), with STEGVERSE_SDK_SOURCE_ROOT
      # as that workflow sets it for the Experiment 3 wire test.
      - name: The pinned StegVerse SDK (org-runtime-boundary.yml's pin c138cad4)
        run: |
          set -eu
          SDK_SHA=c138cad4c37db0bb675bc2c66515b5558cc5fa7b
          curl -fsSL "https://github.com/StegVerse-org/StegVerse-SDK/archive/${SDK_SHA}.tar.gz" -o "$RUNNER_TEMP/stegverse-sdk.tgz"
          mkdir "$RUNNER_TEMP/stegverse-sdk"
          tar -xzf "$RUNNER_TEMP/stegverse-sdk.tgz" -C "$RUNNER_TEMP/stegverse-sdk" --strip-components=1
          python -m pip install --quiet --no-deps "$RUNNER_TEMP/stegverse-sdk"
          python -c 'import stegverse.universal_intr_route_installer'
          echo "STEGVERSE_SDK_SOURCE_ROOT=$RUNNER_TEMP/stegverse-sdk" >> "$GITHUB_ENV"

      # The RTC014 known-answer test reads this repository's own organization
      # ledger ref at a5bb54d8: an anonymous clone of this public repository,
      # outside the workspace so no test sees it as part of the tree.
      - name: A clone of this repository holding refs/stegverse/organization-ledger (RTC014 KAT)
        run: |
          set -eu
          git clone --quiet --no-checkout "https://github.com/${GITHUB_REPOSITORY}" "$RUNNER_TEMP/labs-live"
          git -C "$RUNNER_TEMP/labs-live" fetch --quiet origin "+refs/stegverse/organization-ledger:refs/stegverse/organization-ledger"
          git -C "$RUNNER_TEMP/labs-live" merge-base --is-ancestor a5bb54d81893b392a3ce28182986fc39857807e1 refs/stegverse/organization-ledger
          echo "RTC014_LIVE_LABS_REPO=$RUNNER_TEMP/labs-live" >> "$GITHUB_ENV"

      - name: Select the tests this change needs (data/test-selection-map.json)
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE="$(git merge-base "$BASE_SHA" HEAD)"
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            BASE=""
            echo "<no base commit: ${BASE_SHA}>" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "DIFF_BASE=$BASE" >> "$GITHUB_ENV"
          python scripts/select_tests_for_change.py --changed "$RUNNER_TEMP/changed.txt" \
            --out "$RUNNER_TEMP/test-selection.json" --print-modules > "$RUNNER_TEMP/selected.txt"
          wc -l < "$RUNNER_TEMP/selected.txt"

      - name: Run the selected tests on the exact head
        run: |
          set -u
          if [ -s "$RUNNER_TEMP/selected.txt" ]; then
            xargs -a "$RUNNER_TEMP/selected.txt" python -m pytest -q --tb=no -p no:cacheprovider \
              --junitxml="$RUNNER_TEMP/head-junit.xml" | tail -n 3 || true
          fi

      # The same selected files that exist on the base, in a worktree outside
      # the workspace, so a selected failure the base already had is
      # receipted as pre-existing rather than blocking.
      - name: Run the same selected tests on the base
        if: env.DIFF_BASE != ''
        run: |
          set -u
          git worktree add --quiet --detach "$RUNNER_TEMP/base" "$DIFF_BASE"
          ( cd "$RUNNER_TEMP/base"
            while read -r f; do [ -f "$f" ] && echo "$f"; done < "$RUNNER_TEMP/selected.txt" > "$RUNNER_TEMP/selected-base.txt"
            if [ -s "$RUNNER_TEMP/selected-base.txt" ]; then
              xargs -a "$RUNNER_TEMP/selected-base.txt" python -m pytest -q --tb=no -p no:cacheprovider \
                --junitxml="$RUNNER_TEMP/base-junit.xml" | tail -n 3 || true
            else
              printf '<?xml version="1.0"?><testsuites><testsuite name="pytest"/></testsuites>' > "$RUNNER_TEMP/base-junit.xml"
            fi )

      - name: Receipt the selected set; a skip in it, or a new failure, fails closed
        if: ${{ !cancelled() }}
        run: |
          set -eu
          base_args=""
          if [ -n "${DIFF_BASE:-}" ]; then base_args="--base-junit $RUNNER_TEMP/base-junit.xml --base $DIFF_BASE"; fi
          python scripts/test_suite_skip_receipt.py \
            --junit "$RUNNER_TEMP/head-junit.xml" --head "$HEAD_SHA" --tested-commit "$(git rev-parse HEAD)" \
            --selection "$RUNNER_TEMP/test-selection.json" $base_args \
            --out /tmp/test-suite-skip-receipt.json --skip-items data/test-suite-skip-items.json \
            --retry-entrypoint "test-suite-ratchet.yml selected-tests job on the next pull request head" \
            --owning-goal "StegVerse-org/.github#162 (selected tests on the exact head, 0 skipped)"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-suite-skip-receipt
          path: /tmp/test-suite-skip-receipt.json
          if-no-files-found: error

  # Source validators that are not tests under tests/, consolidated here from
  # the per-feature workflows retired under StegVerse-Labs/.github#3039 (H6b).
  # They run on every pull request and every push to main, with no path filter,
  # so no assertion is narrowed to the file list its old workflow named. Tests
  # under tests/ are not repeated: the ratchet job above runs every one of them.
  # Validation only: nothing here executes work or confers authority.
  consolidated-source-validators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest

      # from governance-endpoint-validation.yml
      - name: The kernel's mesh and node state are supplied, never derived from the host
        if: ${{ !cancelled() }}
        run: python org-kernel/tests/test_kernel.py

      # The organization governance decision run: locator binding, the mesh
      # union, consume_and_respond over a copy of a real request frame, the
      # fast-forward publish and its read back, and replay as a no-op. Temporary
      # repositories only. Run directly so a failure here is never absorbed
      # into the ratchet's baseline.
      - name: Organization governance decision run, against temporary repositories
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest -q -p no:cacheprovider tests/test_organization_governance_decision.py
          tests/test_organization_governance_decision_authority.py

      # from component010-checkout-audit.yml
      - name: Assert actionable non-ALLOW Component-010 source projection
        if: ${{ !cancelled() }}
        run: |
          set +e
          python scripts/audit_component010_checkout.py > /tmp/component010-audit.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c 'import json; x=json.load(open("/tmp/component010-audit.json")); assert x["source_projection_disposition"] == "FAIL_CLOSED_STALE_CHECKOUT_EVIDENCE"; assert x["runtime_transition_observed"] is False'

      # from task-work-correlation-validation.yml
      - name: Resolve canonical work identity without runtime authority
        if: ${{ !cancelled() }}
        run: python scripts/resolve_task_work_correlation.py --task-id MYKV-NATIVE-IOS-PACKAGING-DISTRIBUTION-001

      # from test3-richard-seam-acceptance.yml
      - name: Run and assert Test 3 Richard seam acceptance
        if: ${{ !cancelled() }}
        run: |
          python scripts/run_sdk_tt_richard_seam_test3.py --json-out /tmp/test3-result.json
          python -c "import json; p=json.load(open('/tmp/test3-result.json')); assert p['state']=='PASS'; assert p['constitutive_transition']=='ACTIVATE_TASK_AND_CREATE_BIND_WORKER'; print('TEST3_RICHARD_SEAM_ACCEPTANCE_PASS')"

      # from validate-interlock-intr-protocol-vectors.yml
      - name: Verify deterministic synthetic Interlock InTr protocol vectors
        if: ${{ !cancelled() }}
        run: |
          python scripts/verify_interlock_intr_runtime_independent_protocol.py
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('test-vectors/interlock-intr-runtime-independent-protocol-v1.json').read_text())
          assert doc['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert doc['fixtures']['master_records_checkpoint_profile']['external_conformance_claimed'] is False
          print('INTERLOCK_INTR_VECTOR_VALIDATION_NON_AUTHORIZING_PASS')
          PY

      # from validate-master-records-checkpoint.yml
      - name: Verify deterministic synthetic Master Records checkpoint vectors
        if: ${{ !cancelled() }}
        run: |
          python scripts/verify_master_records_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('test-vectors/master-records-checkpoint-construction-v1.json').read_text())
          b=json.loads(Path('test-vectors/master-records-checkpoint-interoperability-v1.json').read_text())
          assert a['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert b['status']=='SYNTHETIC_NON_AUTHORIZING'
          assert b['runtime_observation']['required_for_documentary_validation'] is False
          assert b['claims']['external_adoption'] is False
          assert b['claims']['external_conformance'] is False
          assert b['claims']['authentic_runtime_execution'] is False
          assert b['claims']['deployment'] is False
          print('MASTER_RECORDS_CHECKPOINT_VALIDATION_NON_AUTHORIZING_PASS')
          PY

      # from validate-organization-role-deployment-packet.yml
      - name: The reference organization passes its own role deployment verifier
        if: ${{ !cancelled() }}
        run: python scripts/verify_organization_role_deployment.py --org-root .

      # from validate-organization-role-runtime-reality.yml
      - name: Validate global invariant block and the deployment declaration
        if: ${{ !cancelled() }}
        run: python scripts/validate_task_registry_global_invariants.py

      # from validate-stegbrowser-intr-retention.yml (this checkout replaces its
      # second anonymous fetch of the same source)
      - name: Validate exact StegBrowser sovereign ingress retention path
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import tests.test_stegbrowser_universal_intr_materialization as t
          tests = [
              t.test_router_is_read_never_written_and_the_route_is_decided_by_the_sdk_installer,
              t.test_node_trigger_is_admitted_write_once_without_authority,
              t.test_tampered_node_trigger_fails_closed,
              t.test_consumer_dispatches_existing_manifest_runner_only_after_exact_binding,
              t.test_executor_preserves_nonce_and_uses_existing_stegos_builders_and_shared_server,
              t.test_browser_carried_opaque_binding_is_persisted_and_resolved_without_filesystem_payload_ref,
              t.test_consumer_maps_opaque_binding_ref_to_ingress_retained_binding_path,
          ]
          for test in tests:
              test()
              print(f"{test.__name__}=PASS")
          PY

      # from validate-purpose-bound-worker-derived-lifetime.yml (its Experiment 3
      # wire test moved to org-runtime-boundary.yml, which already installs the
      # same pinned SDK)
      - name: Validate derived lifetime invariants
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('handoffs/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json').read_text())
          c=h['purpose_bound_worker_request']['transition_cell']['candidate']
          p=c['lifetime_policy']
          assert p['mode']=='DERIVED_COST_TASK_DELAY_BUDGET'
          assert p['production_recompute_required'] is True
          assert h['execution']['lifetime_semantics']['demo_value_is_production_default'] is False
          assert sum(p['time_budget_seconds'].values())==p['derived_max_lifetime_seconds']==c['max_lifetime_seconds']==30
          assert p['decomposition_target']=='RECORDS_ENABLED_PACKET'
          assert h['execution']['lifetime_semantics']['extension_requires_new_governed_recalculation'] is True
          reg=json.loads(Path('data/canonical-task-registry.json').read_text())
          assert reg['generation']>=56  # feature registration floor; canonical generation is monotonic
          task=next(x for x in reg['tasks'] if x['task_id']=='SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001')
          assert task['lifetime_model']['demonstration']['production_default'] is False
          assert task['lifetime_model']['production']['recompute_per_task'] is True
          print('DERIVED_LIFETIME_CONTRACT_PASS')
          PY

      # from aex-stcm-chf-native-capability-audit.yml and
      # validate-conversation-evidence-ingestion.yml
      - name: Parse canonical JSON artifacts
        if: ${{ !cancelled() }}
        run: |
          python -m json.tool data/aex-stcm-chf-native-math-capability-review.json >/dev/null
          python -m json.tool data/aex-native-math-processing-census.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              "contracts/conversation-evidence-service-performance-publication-contract.v1.json",
              "schemas/conversation-evidence-ingestion-package.schema.json",
              "data/canonical-task-records/CONVERSATION-EVIDENCE-INGESTION-CUSTODY-001.json",
          ):
              json.loads(Path(path).read_text(encoding="utf-8"))
          print("CONVERSATION_EVIDENCE_INGESTION_JSON_PARSE_PASS")
          PY

      # py_compile of the scripts and workers the retired workflows compiled:
      # validate-master-records-source-proof.yml, validate-sdk-review-publisher-intr-forward.yml,
      # generic-sdk-manifest-resident.yml, validate-conversation-evidence-ingestion.yml,
      # validate-task-registry-kv-event-projection.yml and the verify job of
      # repository-hygiene-ecosystem-bulk-census.yml
      - name: Compile retired-workflow scripts and workers
        if: ${{ !cancelled() }}
        run: |
          python -m py_compile \
            workers/bootstrap_v1_source_package_production_worker.py \
            scripts/install_sovereign_worker_source_refresh_service.py \
            scripts/consume_publisher_intr_materialization_request.py \
            scripts/consume_sdk_generic_manifest_execution_request.py \
            scripts/dispatch_resident_execution_requests.py \
            scripts/refresh_sovereign_worker_runtime_source.py \
            workers/conversation_evidence_ingestion.py \
            workers/conversation_evidence_ingestion_runtime_worker.py \
            scripts/project_task_registry_event_to_sovereign_kv.py \
            scripts/task_registry_checkin_event_history.py \
            scripts/repository_hygiene_retire_merged_refs.py
