name: Validate Governance Endpoint

on:
  pull_request:
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/**'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'org-kernel/tests/test_kernel.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/resident_cycle.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'tests/test_kernel_supplied_mesh.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/runtime/node_standing.py'
      - 'tests/test_governance_endpoint.py'
      - 'GOVERNANCE_ENDPOINT_MIRROR_HANDOFF.md'
      - '.github/workflows/governance-endpoint-validation.yml'
  push:
    branches: [main]
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/**'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'org-kernel/tests/test_kernel.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/resident_cycle.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'tests/test_kernel_supplied_mesh.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/runtime/node_standing.py'
      - 'tests/test_governance_endpoint.py'
      - 'GOVERNANCE_ENDPOINT_MIRROR_HANDOFF.md'
      - '.github/workflows/governance-endpoint-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The tests redirect both ledger roots and the mesh themselves, and stand
      # a stub StegCore on the adapter's path, so nothing here needs StegCore
      # installed or appends into an operator's runtime reality.
      - name: StegVerse-Labs decides a governance request that crossed InTr
        run: python -m unittest tests.test_governance_endpoint -v
      - name: The kernel's mesh and node state are supplied, never derived from the host
        run: |
          python org-kernel/tests/test_kernel.py
          python -m unittest tests.test_kernel_supplied_mesh -v
      - name: The ledgers are written only where supplied, never under the host home
        run: python -m unittest tests.test_ledger_location_supplied -v
