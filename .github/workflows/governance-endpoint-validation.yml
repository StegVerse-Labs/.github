name: Validate Governance Endpoint

on:
  pull_request:
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/**'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'org-kernel/tests/test_kernel.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/resident_cycle.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'tests/test_kernel_supplied_mesh.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'tests/test_federation_declared_carrier_only.py'
      - 'tests/test_kernel_node_state_supplied.py'
      - 'resident-runtime/activation-manifest.json'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/runtime/node_standing.py'
      - 'org-boundary/runtime/manifest_selection.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/runtime/origin_attestation.py'
      - 'tests/test_origin_attestation.py'
      - 'tests/test_origin_attestation_tvc_conformance.py'
      - 'workers/canonical_work_intr_ingress.py'
      - 'scripts/run_canonical_work_event_bootstrap.py'
      - 'tests/test_canonical_work_in_process_admission.py'
      - 'tests/test_governance_endpoint.py'
      - 'tests/peer_organization.py'
      - 'tests/test_boundary_processing_selection.py'
      - 'tests/test_stable_epoch_and_adapter_effects.py'
      - 'tests/test_kernel_crossing_organization_receipts.py'
      - 'tests/test_refused_crossings_recorded.py'
      - 'GOVERNANCE_ENDPOINT_MIRROR_HANDOFF.md'
      - '.github/workflows/governance-endpoint-validation.yml'
  push:
    branches: [main]
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/**'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'org-kernel/tests/test_kernel.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/resident_cycle.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'tests/test_kernel_supplied_mesh.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'tests/test_federation_declared_carrier_only.py'
      - 'tests/test_kernel_node_state_supplied.py'
      - 'resident-runtime/activation-manifest.json'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/runtime/node_standing.py'
      - 'org-boundary/runtime/manifest_selection.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/runtime/origin_attestation.py'
      - 'tests/test_origin_attestation.py'
      - 'tests/test_origin_attestation_tvc_conformance.py'
      - 'workers/canonical_work_intr_ingress.py'
      - 'scripts/run_canonical_work_event_bootstrap.py'
      - 'tests/test_canonical_work_in_process_admission.py'
      - 'tests/test_governance_endpoint.py'
      - 'tests/peer_organization.py'
      - 'tests/test_boundary_processing_selection.py'
      - 'tests/test_stable_epoch_and_adapter_effects.py'
      - 'tests/test_kernel_crossing_organization_receipts.py'
      - 'tests/test_refused_crossings_recorded.py'
      - 'GOVERNANCE_ENDPOINT_MIRROR_HANDOFF.md'
      - '.github/workflows/governance-endpoint-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The tests redirect both ledger roots and the mesh themselves, and stand
      # a stub StegCore on the adapter's path, so nothing here needs StegCore
      # installed or appends into an operator's runtime reality.
      - name: StegVerse-Labs decides a governance request that crossed InTr
        run: python -m unittest tests.test_governance_endpoint -v
      - name: The kernel's mesh and node state are supplied, never derived from the host
        run: |
          python org-kernel/tests/test_kernel.py
          python -m unittest tests.test_kernel_supplied_mesh -v
      - name: The ledgers are written only where supplied, never under the host home
        run: python -m unittest tests.test_ledger_location_supplied -v
      - name: The declared carrier over the supplied mesh is the only federation path
        run: python -m unittest tests.test_federation_declared_carrier_only -v
      - name: A resident cycle writes its own state where supplied, never into the checkout
        run: python -m unittest tests.test_kernel_node_state_supplied -v
      - name: Processing is selected only by an admitted capability and route, never by the address
        run: python -m unittest tests.test_boundary_processing_selection -v
      - name: Replayed effects reproduce rather than repeat; every adapter declares its effect
        run: python -m unittest tests.test_stable_epoch_and_adapter_effects -v
      - name: Every consumed crossing is recorded on both ledgers before it is answered
        run: python -m unittest tests.test_kernel_crossing_organization_receipts -v
      - name: A refused crossing is recorded as DENY or FAIL_CLOSED, not thrown
        run: python -m unittest tests.test_refused_crossings_recorded -v
      # A4: an origin is attested by TV/TVC, never asserted by the sender. The
      # TVC conformance cases skip here, loudly, as unproven: StegVerse-Labs/tvc
      # is private and this workflow holds no credential to check it out.
      - name: Origin is attested by TV/TVC; no signing or verification algorithm lives here
        run: python -m unittest tests.test_origin_attestation tests.test_origin_attestation_tvc_conformance -v
      - name: CanonicalWork TVC_RELAY_EGRESS is admitted only on TV/TVC's receipt for the exact request
        run: python -m unittest tests.test_canonical_work_in_process_admission -v
