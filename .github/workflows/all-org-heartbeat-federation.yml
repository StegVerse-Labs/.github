# Validation-only federation lane. The resident sovereign heartbeat owns
# production worker allocation, cycle advancement, claims, fences and persistence.
name: All-Organization Heartbeat Federation - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/organization-federation.json'
      - 'control/organization-task-registry.json'
      - 'control/heartbeat-subsignals.json'
      - 'workers/organization_federation_readiness_worker.py'
      - 'handoffs/SHWP-ALL-ORG-FEDERATION-001.json'
      - 'authorizations/SHWP-ALL-ORG-FEDERATION-001.json'
      - 'cost-basis/worker-runtime/organization-federation-readiness.json'
      - '.github/workflows/all-org-heartbeat-federation.yml'
  pull_request:
    paths:
      - 'control/organization-federation.json'
      - 'control/organization-task-registry.json'
      - 'control/heartbeat-subsignals.json'
      - 'workers/organization_federation_readiness_worker.py'
      - 'handoffs/SHWP-ALL-ORG-FEDERATION-001.json'
      - 'authorizations/SHWP-ALL-ORG-FEDERATION-001.json'
      - 'cost-basis/worker-runtime/organization-federation-readiness.json'
      - '.github/workflows/all-org-heartbeat-federation.yml'

permissions: {}

concurrency:
  group: all-org-heartbeat-federation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate federation source and inputs
        run: |
          set -euo pipefail
          python3 -m py_compile workers/organization_federation_readiness_worker.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          federation=json.loads(Path('control/organization-federation.json').read_text())
          tasks=json.loads(Path('control/organization-task-registry.json').read_text())
          assert federation['organization_count']==len(federation['organizations'])
          assert len(tasks['tasks'])==federation['organization_count']
          assert federation['coverage']['unassigned']==0
          assert tasks['coverage']['unassigned']==0
          blocked=[x for x in tasks['tasks'] if x['state']=='BLOCKED']
          assert all(x.get('release_condition') and x.get('next_action') for x in blocked)
          print('FEDERATION_INPUT_PASS')
          PY

      - name: Exercise one heartbeat cycle without persistence
        run: |
          set -euo pipefail
          before="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          output="$(python3 scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          after="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          row=json.loads(sys.argv[1])
          assert row['authority_effect']=='none_beyond_existing_admitted_task_authority'
          c=row['subsignals']['worker_coordination']
          assert c['carrier']=='single_stegverse_heartbeat'
          assert c['authority_effect'] is False
          print('FEDERATION_DRY_RUN_PASS')
          PY

      - name: Prove hosted lane is non-authorizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/all-org-heartbeat-federation.yml').read_text(encoding='utf-8')
          forbidden=['contents'+': write','git'+' push','actions/'+'checkout@','actions/'+'setup-python@','$'+'{{ '+'secrets.']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('FEDERATION_NON_AUTHORIZING_PASS')
          PY
