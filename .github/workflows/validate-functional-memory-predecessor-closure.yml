name: Validate Functional Memory predecessor closure
on:
  pull_request:
    paths:
      - 'heartbeat_runtime/worker_assignment_functional_memory.py'
      - 'tests/test_worker_assignment_functional_memory.py'
      - '.github/workflows/validate-functional-memory-predecessor-closure.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_worker_assignment_functional_memory.py
