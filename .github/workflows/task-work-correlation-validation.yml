name: Task Registry Work Correlation Validation

on:
  pull_request:
    paths:
      - 'scripts/resolve_task_work_correlation.py'
      - 'tests/test_task_registry_work_correlation.py'
      - 'data/canonical-task-registry.json'
      - 'data/canonical-task-records/MYKV-NATIVE-IOS-PACKAGING-DISTRIBUTION-001.json'
      - '.github/workflows/task-work-correlation-validation.yml'

permissions:
  contents: read

jobs:
  work-correlation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical work identity without runtime authority
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_task_registry_work_correlation.py
          python3 scripts/resolve_task_work_correlation.py --task-id MYKV-NATIVE-IOS-PACKAGING-DISTRIBUTION-001
