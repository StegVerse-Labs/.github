name: Organization Ledger Transition

# Append to this organization's designated ledger ref, push that ref
# fast-forward only, and read it back from a fresh fetch. The ledger is the
# evidence; this run's success is not.
#
# A push to main that changes .stegverse/intr-destination/self-closure-packet.json (the committed state
# transition; resident-runtime/self_closure_packet.py reads it) performs one
# intr-destination diagnostic self-closure:
# resident-runtime/intr_destination_ingress.py records repository and
# organization receipts, both carrying communication_id, on
# refs/stegverse/organization-ledger. The repository chain is the declared
# subtree of that same ref. Existing commits on the ref are parents of any
# new commit; this workflow does not rewrite them.
#
# A push to main that changes .stegverse/organization-ledger-ingest/request.json
# (the committed ingest request; resident-runtime/organization_ledger_ingest.py
# reads it) performs the one operation the request names:
#   sv_check_receipt     resident-runtime/sv_check_receipt_append.py records the
#                        stegverse.sv_check_receipt.v1 receipt as the repository
#                        receipt's evidence and aggregates it into the
#                        organization receipt on the same ref;
#   sealed_test_receipt  a test receipt sealed by its producer's CI (TVC's
#                        conformance receipt) is admitted against
#                        .stegverse/organization-ledger-ingest/accepted-sealed-receipts.json
#                        and retained unchanged as a source receipt consumed by
#                        one organization receipt, at the ledger head's supplied epoch.
# Either is read back from a fresh fetch. A push that changes both the packet and
# the request performs both, under one lock and one fast-forward publish. Each
# operation runs only when its own file changed in the pushed range.
#
# The federation directory is not an input. Governance and remediation routes
# are not selected here.
# Writer only, on push to main. Its pull_request checks run in
# .github/workflows/organization-ledger-transition-validation.yml (read-only); no
# pull_request event reaches this file, so no PR shows this job as skipped.
on:
  push:
    branches: [main]
    paths:
      - '.stegverse/intr-destination/self-closure-packet.json'
      - '.stegverse/organization-ledger-ingest/request.json'

permissions:
  contents: read

# ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with the governance
# decision writer of this same ref. The push below is the compare-and-swap
# against the published ref, so a writer that lost a race fails closed instead
# of overwriting.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  transition:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the designated ref and the repository subtree before any append
        run: |
          set -euo pipefail
          python -m py_compile resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py \
            resident-runtime/organization_ledger_ingest.py \
            resident-runtime/sv_check_receipt_append.py
          python - <<'PY'
          import json
          from pathlib import Path
          org = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          repo = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())
          assert org["organization_ledger_repository"] == "StegVerse-Labs/.github"
          assert org["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          location = repo["repository_ledger_location"]
          assert location["repository"] == org["organization_ledger_repository"]
          assert location["ref"] == org["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          print(location["namespace"])
          PY

      - name: Bind the designated organization ledger ref
        run: |
          set -euo pipefail
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="StegVerse-Labs/.github"; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger" and l["new_ledger_root"] is False; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip before append: $(git rev-parse "$LEDGER_REF")"
          else
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_REF_ABSENT","failed_predicate":"DESIGNATED_REF_ALREADY_PUBLISHED","required_evidence_or_repair":"refs/stegverse/organization-ledger already exists; this writer appends to it and does not open a replacement","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi
          git rev-parse "$LEDGER_REF" > "$RUNNER_TEMP/ledger-before"

      - name: Select the operations whose committed file this push changed
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"PUSHED_RANGE_UNRESOLVED","failed_predicate":"PUSH_BEFORE_IS_AN_ANCESTOR_OF_THE_PUSHED_COMMIT","required_evidence_or_repair":"a fast-forward push to main whose before commit is in this checkout; nothing is appended","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ORGANIZATION-ROLE-RUNTIME-REALITY-DEPLOYMENT-001","next_attempt":"the next fast-forward push to main touching a packet","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi
          changed=$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- \
            .stegverse/intr-destination/self-closure-packet.json .stegverse/organization-ledger-ingest/request.json)
          sc=0; sv=0
          if printf '%s\n' "$changed" | grep -qx '.stegverse/intr-destination/self-closure-packet.json'; then sc=1; fi
          if printf '%s\n' "$changed" | grep -qx '.stegverse/organization-ledger-ingest/request.json'; then sv=1; fi
          echo "SELF_CLOSURE_PACKET_CHANGED=$sc" >> "$GITHUB_ENV"
          echo "INGEST_REQUEST_CHANGED=$sv" >> "$GITHUB_ENV"
          echo "{\"self_closure\": $sc, \"ingest_request\": $sv}"
          if [ "$sc$sv" = "00" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"NO_COMMITTED_PACKET_CHANGED","failed_predicate":"PUSHED_RANGE_CHANGES_A_PACKET","required_evidence_or_repair":"a push that changes a packet file (a deletion records nothing); nothing is appended","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ORGANIZATION-ROLE-RUNTIME-REALITY-DEPLOYMENT-001","next_attempt":"commit a packet or ingest request to main","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi

      - name: Read the self-closure inputs from the pushed commit's packet
        if: env.SELF_CLOSURE_PACKET_CHANGED == '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python resident-runtime/self_closure_packet.py --packet .stegverse/intr-destination/self-closure-packet.json --require-hb-epoch --github-env "$GITHUB_ENV"

      - name: Append the diagnostic self-closure to the repository and organization ledgers
        if: env.SELF_CLOSURE_PACKET_CHANGED == '1'
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_GIT_DIR="$GITHUB_WORKSPACE/.git"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          # Time is supplied in the committed packet. It is not sampled from a clock.
          case "$HB_EPOCH" in
            ''|*[!0-9]*)
              echo '{"disposition":"FAIL_CLOSED","failure_code":"SELF_CLOSURE_HB_EPOCH_INVALID","failed_predicate":"HB_EPOCH_IS_SUPPLIED_AS_A_NON_NEGATIVE_INTEGER","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false}'
              exit 1 ;;
          esac
          python resident-runtime/intr_destination_ingress.py \
            --self-close \
            --hb-epoch "$HB_EPOCH" \
            --communication-id "$CLOSURE_COMMUNICATION_ID" \
            --packet-id "${CLOSURE_PACKET_ID:-intr-destination-self-closure}" \
            --registry org-boundary/registry/services.json \
            --out "$RUNNER_TEMP/results/closure.json"
          python - <<'PY'
          import json, os
          closure = json.load(open(os.environ["RUNNER_TEMP"] + "/results/closure.json"))
          print(json.dumps({
              "disposition": closure.get("disposition"),
              "communication_id": closure.get("communication_id"),
              "repository_receipt_sha256": closure.get("repository_receipt_sha256"),
              "organization_receipt_sha256": closure.get("organization_receipt_sha256"),
              "peer_enumerated": closure.get("peer_enumerated"),
              "federation_directory_consulted": closure.get("federation_directory_consulted"),
          }, sort_keys=True))
          if closure.get("disposition") != "ALLOW":
              raise SystemExit(1)
          if closure.get("federation_directory_consulted") is not False or closure.get("peer_enumerated") is not False:
              raise SystemExit(1)
          PY

      - name: Read the ingest request from the pushed commit
        if: env.INGEST_REQUEST_CHANGED == '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/results"
          python resident-runtime/organization_ledger_ingest.py read --request .stegverse/organization-ledger-ingest/request.json \
            --materialize "$RUNNER_TEMP/sv-check" --github-env "$GITHUB_ENV"

      - name: Append the check receipt to the repository and organization ledgers (operation sv_check_receipt)
        if: env.INGEST_OPERATION == 'sv_check_receipt'
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_GIT_DIR="$GITHUB_WORKSPACE/.git"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          # Time is supplied in the committed packet. It is not sampled from a clock;
          # the operation refuses anything but an integer epoch >= 32 that passes
          # kernel.py::supplied_epoch_failure and equals the receipt's own hb_epoch.
          # A stage-gate receipt is appended only into the subject repository's own
          # ledger: --ledger-repository is this repository.
          gate_args=()
          if [ -f "$RUNNER_TEMP/sv-check/evaluation-subject.json" ]; then gate_args+=(--subject "$RUNNER_TEMP/sv-check/evaluation-subject.json"); fi
          if [ -f "$RUNNER_TEMP/sv-check/base-state-readback.json" ]; then gate_args+=(--readback "$RUNNER_TEMP/sv-check/base-state-readback.json"); fi
          python resident-runtime/sv_check_receipt_append.py append \
            --check-receipt "$RUNNER_TEMP/sv-check/check-receipt.json" \
            --hb-epoch "$HB_EPOCH" \
            --ledger-repository "$GITHUB_REPOSITORY" \
            "${gate_args[@]}" \
            --out "$RUNNER_TEMP/results/check-receipt-append.json"

      - name: Append the sealed test receipt to the organization ledger (operation sealed_test_receipt)
        if: env.INGEST_OPERATION == 'sealed_test_receipt'
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_GIT_DIR="$GITHUB_WORKSPACE/.git"
          # Admitted before any write: its own seal, an accepted kind, ALLOW with
          # zero skipped, failed and errored tests, this ledger as target, and the
          # request's provenance. The epoch is the ledger head's supplied epoch.
          python resident-runtime/organization_ledger_ingest.py append-sealed \
            --request .stegverse/organization-ledger-ingest/request.json \
            --ledger-repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/results/sealed-receipt-append.json"

      - name: Require the append to fast-forward the existing ref
        run: |
          set -euo pipefail
          before=$(cat "$RUNNER_TEMP/ledger-before")
          after=$(git rev-parse "$LEDGER_REF")
          if ! git merge-base --is-ancestor "$before" "$after"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_HISTORY_REWRITTEN","failed_predicate":"APPEND_FAST_FORWARDS_THE_EXISTING_REF","required_evidence_or_repair":"the local ref is not a descendant of the fetched tip; nothing is pushed","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi
          echo "ledger tip after append: $after (ancestor $before)"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          set -euo pipefail
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        if: env.SELF_CLOSURE_PACKET_CHANGED == '1'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_CREDENTIAL_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CHECKOUT_CREDENTIAL","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_READBACK_ONLY"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" \
            fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/organization_ledger_readback.py \
            --location "git+$fresh#$LEDGER_REF" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --closure-result "$RUNNER_TEMP/results/closure.json" \
            --out "$RUNNER_TEMP/results/readback.json"
          {
            echo "### intr-destination diagnostic self-closure"
            echo '```json'
            cat "$RUNNER_TEMP/results/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the appended check receipt back from a fresh fetch
        if: env.INGEST_OPERATION == 'sv_check_receipt'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback-sv-check.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_CREDENTIAL_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CHECKOUT_CREDENTIAL","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_READBACK_ONLY"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" \
            fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/sv_check_receipt_append.py readback \
            --location "git+$fresh#$LEDGER_REF" \
            --result "$RUNNER_TEMP/results/check-receipt-append.json" \
            --out "$RUNNER_TEMP/results/check-receipt-readback.json"
          {
            echo "### sv_check_receipt append"
            echo '```json'
            cat "$RUNNER_TEMP/results/check-receipt-readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the appended sealed test receipt back from a fresh fetch
        if: env.INGEST_OPERATION == 'sealed_test_receipt'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback-sealed.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_CREDENTIAL_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CHECKOUT_CREDENTIAL","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_READBACK_ONLY"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" \
            fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/organization_ledger_ingest.py readback-sealed \
            --request .stegverse/organization-ledger-ingest/request.json \
            --location "git+$fresh#$LEDGER_REF" \
            --out "$RUNNER_TEMP/results/sealed-receipt-readback.json"
          {
            echo "### sealed_test_receipt append"
            echo '```json'
            cat "$RUNNER_TEMP/results/sealed-receipt-readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
