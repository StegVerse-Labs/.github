name: Organization Ledger Transition

# PR-facing half of the Organization ledger writer. It holds NO write
# permission: every job here is contents: read and the checkout persists no
# credential. Publication to refs/stegverse/organization-ledger lives only in
# .github/workflows/organization-ledger-transition-writer.yml, which never
# triggers on pull_request.
#
# validate: compiles and unit-tests the writer and the intr-destination
#   self-closure against temporary ledgers.
# transition: the PR-safe verify. Binds the designated ref and repository
#   subtree exactly as the writer does, copies the published ledger
#   anonymously into a temporary ledger, reads it back through the same
#   readback, and requires the published ref unchanged. No append: the
#   self-closure needs the dispatch-supplied communication_id and hb_epoch,
#   and none is synthesized.
on:
  pull_request:
    paths:
      - '.github/workflows/organization-ledger-transition.yml'
      - '.github/workflows/organization-ledger-transition-writer.yml'
      - '.stegverse/transition-ledger/contract.json'
      - '.stegverse/transition-ledger/emit.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'resident-runtime/sv_check_receipt_append.py'
      - 'org-runtime/interlock-intr.json'
      - 'tests/vendor/p1_7898cedb/**'
      - 'tests/test_sv_check_receipt_append.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_organization_ledger_transition_writer.py'
      - 'tests/test_transition_job_runs_on_pull_request.py'

permissions:
  contents: read

# A pull_request run never publishes, so it takes a per-PR group and never
# enters the writer's ORGANIZATION_LEDGER_LOCK group.
concurrency:
  group: organization-ledger-pr-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the writer and the self-closure against temporary ledgers
        run: |
          python -m py_compile \
            resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py \
            resident-runtime/ledger_store.py \
            resident-runtime/sv_check_receipt_append.py \
            .stegverse/transition-ledger/emit.py
          python -m pip install pytest
          python -m pytest -q --tb=short \
            tests/test_organization_ledger_transition_writer.py \
            tests/test_sv_check_receipt_append.py \
            tests/test_intr_destination_capability.py

  transition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary (pull_request verify, no persisted credential)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'PR verify: bind the designated ref and subtree, copy the published ledger into a temporary ledger, read it back'
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"PR_VERIFY_CREDENTIAL_PERSISTED","failed_predicate":"PULL_REQUEST_RUN_HOLDS_NO_PERSISTED_CREDENTIAL","required_evidence_or_repair":"the pull_request checkout must use persist-credentials: false","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi
          python -m py_compile resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py
          namespace=$(python - <<'PY'
          import json
          from pathlib import Path
          org = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          repo = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())
          assert org["organization_ledger_repository"] == "StegVerse-Labs/.github"
          assert org["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          location = repo["repository_ledger_location"]
          assert location["repository"] == org["organization_ledger_repository"]
          assert location["ref"] == org["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          print(location["namespace"])
          PY
          )
          published="https://github.com/StegVerse-Labs/.github.git"
          before=$(git -c credential.helper= ls-remote --exit-code "$published" "$LEDGER_REF" | cut -f1) || {
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_REF_ABSENT","failed_predicate":"DESIGNATED_REF_ALREADY_PUBLISHED","required_evidence_or_repair":"refs/stegverse/organization-ledger is not readable anonymously; the verify copies it and does not open a replacement","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","consequence_committed":false,"authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1; }
          dry="$RUNNER_TEMP/pr-verify-ledger.git"
          git init -q --bare "$dry"
          git --git-dir="$dry" -c credential.helper= fetch -q --no-tags "$published" "+$LEDGER_REF:$LEDGER_REF"
          test "$(git --git-dir="$dry" rev-parse "$LEDGER_REF")" = "$before"
          mkdir -p "$RUNNER_TEMP/results"
          python resident-runtime/organization_ledger_readback.py \
            --location "git+$dry#$LEDGER_REF" \
            --repository-namespace "$namespace" \
            --out "$RUNNER_TEMP/results/readback.json" > /dev/null
          python - <<'PY'
          import json, os
          readback = json.load(open(os.environ["RUNNER_TEMP"] + "/results/readback.json"))
          summary = {k: readback.get(k) for k in ("disposition", "chain_length", "head_receipt_sha256",
                                                   "every_receipt_verifies_against_its_body", "readback_writes")}
          print(json.dumps({"mode": "PULL_REQUEST_VERIFY", "ledger": "TEMPORARY_COPY", "append_attempted": False,
                            "published": False, "consequence_committed": False, **summary}, sort_keys=True))
          if readback.get("disposition") != "ALLOW" or readback.get("readback_writes") is not False:
              raise SystemExit(1)
          PY
          now=$(git -c credential.helper= ls-remote "$published" "$LEDGER_REF" | cut -f1)
          if [ "$now" != "$before" ]; then
            git --git-dir="$dry" -c credential.helper= fetch -q --no-tags "$published" "+$LEDGER_REF:refs/published/now"
            git --git-dir="$dry" merge-base --is-ancestor "$before" refs/published/now
          fi
          {
            echo "### organization ledger PR verify (temporary copy; no append; nothing published)"
            echo '```json'
            python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/results/readback.json")); print(json.dumps({k: r.get(k) for k in ("disposition","chain_length","head_receipt_sha256")}, indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-ledger-transition-pr-verify
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
