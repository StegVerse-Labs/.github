# Validation-only workflow for SHWP control-plane artifacts.
# This workflow is not the worker scheduler and has no scheduled activation role.
name: Heartbeat Worker Project

on:
  push:
    branches: [main]
    paths:
      - 'handoffs/**'
      - 'heartbeat_runtime/**'
      - 'tests/test_heartbeat_runtime.py'
      - 'control/heartbeat-state.json'
      - 'control/worker-registry.json'
      - 'control/heartbeat-continuity.json'
      - 'control/worker-cost-observations.json'
      - 'docs/ORG_MIRROR_HANDOFF.md'
      - 'docs/HEARTBEAT_CONTINUITY_WORKER_MIRROR_HANDOFF.md'
      - 'schemas/heartbeat-transition-observation.schema.json'
      - 'schemas/worker-runtime-cost-basis.schema.json'
      - 'schemas/worker-registry.schema.json'
      - 'schemas/executable-handoff.schema.json'
      - 'scripts/project_heartbeat_workers.py'
      - 'scripts/reconcile_heartbeat_continuity.py'
      - 'scripts/run_heartbeat_runtime.py'
      - '.github/workflows/heartbeat-worker-project.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat-worker-project-main
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile HB runtime and projectors
        run: |
          python -m py_compile heartbeat_runtime/__init__.py heartbeat_runtime/engine.py
          python -m py_compile scripts/project_heartbeat_workers.py
          python -m py_compile scripts/reconcile_heartbeat_continuity.py
          python -m py_compile scripts/run_heartbeat_runtime.py

      - name: Parse canonical JSON surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('schemas/worker-registry.schema.json'),
              Path('schemas/executable-handoff.schema.json'),
              Path('schemas/heartbeat-transition-observation.schema.json'),
              Path('schemas/worker-runtime-cost-basis.schema.json'),
              Path('control/heartbeat-state.json'),
              Path('control/worker-registry.json'),
              Path('control/worker-cost-observations.json'),
              *sorted(Path('handoffs').glob('*.json')),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON_OK:{path}')
          PY

      - name: Prove native heartbeat engine semantics
        run: python -m unittest -v tests.test_heartbeat_runtime

      - name: Prove live registry has no false activation
        run: |
          output="$(python scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          echo "$output"
          python - <<'PY' "$output"
          import json, sys
          value = json.loads(sys.argv[1])
          assert value['activated'] is False, value
          assert value['events'][-1]['event_type'] == 'no_worker_initiated', value
          print('LIVE_NO_FALSE_ACTIVATION_PASS')
          PY

      - name: Validate or refresh worker status projection
        run: |
          if python scripts/project_heartbeat_workers.py --check; then
            echo 'WORKER_STATUS_CURRENT=true' >> "$GITHUB_ENV"
          else
            python scripts/project_heartbeat_workers.py --write
            echo 'WORKER_STATUS_CURRENT=false' >> "$GITHUB_ENV"
          fi

      - name: Refresh heartbeat continuity projection
        run: python scripts/reconcile_heartbeat_continuity.py --write

      - name: Prove current StegGate successor posture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('control/worker-registry.json').read_text())
          status = json.loads(Path('control/worker-status.json').read_text())
          continuity = json.loads(Path('control/heartbeat-continuity.json').read_text())
          audit = next(x for x in status['tasks'] if x['task_id'] == 'STEGGATE-AUDITKIT-001')
          boundary = next(x for x in status['tasks'] if x['task_id'] == 'STEGGATE-FIRST-BOUNDARY-001')

          assert status['execution_authority_from_heartbeat'] is False, status
          assert status['single_heartbeat_timing_frame'] is True, status
          assert status['activation_driver'] == 'internal_heartbeat_registry_evaluation', status
          assert continuity['heartbeat_is_single_common_timing_frame'] is True, continuity
          assert continuity['absence_or_delay_is_not_by_itself_continuity_loss'] is True, continuity

          assert audit['state'] == 'COMPLETED', audit
          assert audit['archive_eligible'] is True, audit
          assert audit['activation_required'] is False, audit

          assert boundary['state'] == 'BLOCKED', boundary
          assert boundary['worker_id'] is None, boundary
          assert boundary['activation_required'] is False, boundary
          assert boundary['archive_eligible'] is False, boundary
          assert 'BLOCKED_UNCLAIMED' in boundary['archive_reason_codes'], boundary
          print('STEGGATE_SUCCESSOR_BLOCKED_UNCLAIMED_PASS')

          for obs in continuity['observations']:
              if 'MASTER_RECORDS_FINAL_WORKER_REPORT_MISSING' in obs['reason_codes']:
                  assert continuity['candidate_count'] > 0, continuity
          PY

      - name: Commit derived projections only when changed
        run: |
          if git diff --quiet -- control/worker-status.json control/heartbeat-continuity.json; then
            echo 'No derived HB state change.'
            exit 0
          fi
          git config user.name 'stegverse-heartbeat-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add control/worker-status.json control/heartbeat-continuity.json
          git commit -m 'chore: project single-heartbeat worker continuity'
          git pull --rebase origin main
          git push origin HEAD:main
