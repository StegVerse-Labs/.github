# Validation-only workflow for SHWP control-plane artifacts.
# It has no scheduler, activation, repository mutation, credential, claim, or fence role.
# TV/TVC owns credential semantics; worker lifecycle coordination is separate from the heartbeat carrier.
# Automatic main validation is limited to admitted source/test/contract surfaces; routine state/receipt persistence is excluded.
# 2026-08-27 stable-two-dispatcher exact-current validation trigger.
name: Heartbeat Worker Project - Validation Only / No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'heartbeat_runtime/**'
      - 'workers/heartbeat_receipt_canary.py'
      - 'scripts/issue_heartbeats.py'
      - 'scripts/run_heartbeat_runtime.py'
      - 'scripts/validate_heartbeat_returns.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'workers/sovereign_runtime_activation_entrypoint.py'
      - 'scripts/advance_heartbeat_transition.py'
      - 'scripts/bootstrap_sovereign_runtime.py'
      - 'scripts/refresh_heartbeat_transition_receipt.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'tests/test_bootstrap_sovereign_runtime.py'
      - 'tests/test_sovereign_runtime_activation*.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - 'tests/test_ephemeral_separated_runtime_supervision.py'
      - 'tests/test_g18_*.py'
      - 'tests/test_hb29_state_transition_carrier_contract.py'
      - 'tests/test_sovereign_runtime_handoff_v12_contract.py'
      - 'workers/ecosystem_chat_sovereign_inference_worker.py'
      - 'workers/ecosystem_chat_sovereign_route_worker.py'
      - 'workers/ecosystem_chat_tc_tvc_route_worker.py'
      - 'workers/llm_adapter_sovereign_execution_bridge.py'
      - 'workers/master_records_sovereign_reconstruction_bridge.py'
      - 'scripts/run_independent_ecosystem_chat_parent.py'
      - 'authorizations/SHWP-ECOSYSTEM-CHAT-INFERENCE-001-independent-parent.json'
      - 'control/worker-registry.d/ecosystem-chat-sovereign-inference-parent-001.json'
      - 'control/worker-registry.json'
      - 'control/task-vectors/SHWP-ECOSYSTEM-CHAT-INFERENCE-001.json'
      - 'tests/test_ecosystem_chat_parent_registry_reconciliation.py'
      - 'handoffs/SHWP-ECOSYSTEM-CHAT-INFERENCE-001.json'
      - 'tests/test_independent_ecosystem_chat_parent_executor.py'
      - 'tests/test_llm_adapter_sovereign_execution_bridge.py'
      - 'tests/test_master_records_sovereign_reconstruction_bridge.py'
      - 'tests/test_ecosystem_chat_inference_binding.py'
      - 'management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json'
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - 'handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
      - 'tests/test_steggate_integration_binding.py'
      - 'workers/stegfin_early_adopter_contribution_validation_worker.py'
      - 'workers/ara_graph_runtime_worker.py'
      - 'workers/cmc028_root_custody_worker.py'
      - 'tests/test_cmc028_root_custody_worker.py'
      - 'handoffs/SHWP-CMC028-ROOT-CUSTODY-EVIDENCE-001.json'
      - 'control/worker-registry.d/cmc028-root-custody-001.json'
      - 'control/process-worker-adapters.d/cmc028-root-custody-001.json'
      - 'control/admissible-existence-retrospective-conformance.d/cmc028-root-custody-001.json'
      - 'control/task-vectors/SHWP-CMC028-ROOT-CUSTODY-EVIDENCE-001.json'
      - 'tests/test_ara_graph_runtime_worker.py'
      - 'tests/test_ara_graph_resident_execution_request.py'
      - 'scripts/consume_ara_graph_resident_execution_request.py'
      - 'scripts/refresh_and_execute_resident_task.py'
      - 'scripts/refresh_sovereign_worker_runtime_source.py'
      - 'scripts/install_sovereign_worker_source_refresh_service.py'
      - 'control/resident-execution-request.d/ara-graph-runtime-086.json'
      - 'handoffs/SHWP-ARA-GRAPH-RUNTIME-086.json'
      - 'control/worker-registry.d/ara-graph-runtime-086.json'
      - 'control/process-worker-adapters.d/ara-graph-runtime-086.json'
      - 'control/admissible-existence-retrospective-conformance.d/ara-graph-runtime-086.json'
      - 'tests/test_stegfin_early_adopter_contribution_validation_worker.py'
      - 'control/worker-registry.d/stegfin-early-adopter-contribution-validation-001.json'
      - 'docs/STEGFIN_EARLY_ADOPTER_CONTRIBUTION_VALIDATION_MIRROR_HANDOFF.md'
      - 'handoffs/STEGFIN-EARLY-ADOPTER-VALIDATION-WORKER-001.json'
      - '.github/workflows/heartbeat-worker-project.yml'
  pull_request:
    paths:
      - 'handoffs/**'
      - 'heartbeat_runtime/**'
      - 'workers/**'
      - 'tests/**'
      - 'control/**'
      - 'cost-basis/worker-runtime/**'
      - 'receipts/host-self-attest/SHWP-HOST-SELF-ATTEST-001.json'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/heartbeat-worker-project.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: heartbeat-worker-project-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/stegverse-ci-bin
          ln -sf "$(command -v python3)" /tmp/stegverse-ci-bin/python
          echo /tmp/stegverse-ci-bin >> "$GITHUB_PATH"

      - name: Prove validation environment has no GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_PAT:-}"
          echo NO_GITHUB_CREDENTIAL_TOKEN_PRESENT

      - name: Compile runtime, workers, and scripts
        run: |
          set -euo pipefail
          python -m compileall -q heartbeat_runtime workers scripts

      - name: Parse canonical JSON surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots=(Path('schemas'),Path('control'),Path('handoffs'),Path('cost-basis/worker-runtime'),Path('authorizations'))
          count=0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.json')):
                  json.loads(path.read_text(encoding='utf-8'))
                  count += 1
          assert count > 0
          print('CANONICAL_JSON_PASS', count)
          PY

      - name: Validate executable handoffs
        run: python scripts/validate_executable_handoffs.py

      - name: Validate consolidated federation and MCP bindings
        run: |
          python -m unittest -v tests.test_organization_federation_binding
          python -m unittest -v tests.test_sdk_mcp_activation_binding tests.test_sdk_mcp_canonical_validation_worker

      - name: Validate consolidated sovereign runtime validation surfaces
        run: |
          python -m unittest -v tests.test_bootstrap_sovereign_runtime
          python -m unittest -v tests.test_sovereign_ephemeral_console tests.test_ephemeral_separated_runtime_supervision
          python -m unittest -v tests.test_g18_self_bootstrap_worker tests.test_g18_task_capable_release_guard
          python -m unittest -v tests.test_hb29_state_transition_carrier_contract tests.test_sovereign_runtime_handoff_v12_contract

      - name: Validate consolidated inference and StegGate bindings
        run: |
          python -m unittest -v tests.test_ecosystem_chat_inference_binding
          python -m unittest -v tests.test_independent_ecosystem_chat_parent_executor tests.test_llm_adapter_sovereign_execution_bridge tests.test_master_records_sovereign_reconstruction_bridge
          python -m unittest -v tests.test_ecosystem_chat_parent_registry_reconciliation
          python -m unittest -v tests.test_steggate_integration_binding

      - name: Validate consolidated StegFin contribution validator source
        run: python -m unittest -v tests.test_stegfin_early_adopter_contribution_validation_worker

      - name: Validate ARA Graph sovereign runtime worker
        run: python -m unittest -v tests.test_ara_graph_runtime_worker

      - name: Validate CMC-028 sovereign custody evidence worker
        run: python -m unittest -v tests.test_cmc028_root_custody_worker

      - name: Validate ARA Graph resident execution request
        run: python -m unittest -v tests.test_ara_graph_resident_execution_request tests.test_sovereign_worker_source_refresh

      - name: Validate consolidated Test Lanes autolaunch binding
        run: python -m unittest -v tests.test_test_lanes_autolaunch_binding

      - name: Validate Universal Governance resident request dispatch
        run: |
          python -m unittest tests.test_universal_governance_resident_request -v
          python -m py_compile scripts/consume_universal_governance_enforced_reference_request.py

      - name: Run complete deterministic repository test suite
        run: python -m unittest discover -v tests

      - name: Validate external timing fixed-cadence zero-authority contract
        run: |
          python -m unittest -v tests.test_external_timing_match
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('control/external-timing-match-contract.json').read_text(encoding='utf-8'))
          logical=contract['logical_heartbeat']
          authority=contract['authority']
          assert logical['cadence_semantics']=='FIXED_AFTER_PROFILE_SELECTION_AND_LOCK'
          assert logical['frequency_is_workload_control'] is False
          assert logical['min_max_semantics']=='WORKLOAD_HEALTH_BOUNDS_PER_PULSE'
          assert logical['load_may_change_period'] is False
          assert authority['credential_authority']=='TV/TVC'
          assert authority['github_token_runtime_authority']=='NONE'
          assert authority['non_tv_tvc_secret_or_token_allowed'] is False
          assert authority['render_dependency']=='PROHIBITED'
          assert not any(authority[k] for k in authority if k.startswith('timing_match_grants_'))
          print('EXTERNAL_TIMING_FIXED_CADENCE_ZERO_AUTHORITY_PASS')
          PY

      - name: Validate retained host self-attest completion evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('control/worker-registry.json').read_text())
          task=next(x for x in registry['tasks'] if x['task_id']=='SHWP-HOST-SELF-ATTEST-001')
          receipt=json.loads(Path('receipts/host-self-attest/SHWP-HOST-SELF-ATTEST-001.json').read_text())
          handoff=json.loads(Path('handoffs/SHWP-HOST-SELF-ATTEST-001.json').read_text())
          assert handoff['state']=='COMPLETED'
          assert handoff['goal']['successor_policy']=='NONE'
          assert handoff['completion']['next_authorized_action'].startswith('NONE_FOR_THIS_TASK')
          assert task['state']=='COMPLETED'
          assert task['archive_eligible'] is True
          assert task['claim_id'] is None and task['worker_id'] is None
          assert receipt['completed'] is True
          print('RETAINED_HOST_SELF_ATTEST_PASS')
          PY

      - name: Validate retained native-process canary completion evidence
        run: |
          python3 -m py_compile workers/heartbeat_receipt_canary.py heartbeat_runtime/process_adapter.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('control/worker-registry.json').read_text())
          task=next(x for x in registry['tasks'] if x['task_id']=='SHWP-NATIVE-PROCESS-CANARY-001')
          receipt=json.loads(Path('receipts/native-worker-canary/SHWP-NATIVE-PROCESS-CANARY-001.json').read_text())
          handoff=json.loads(Path('handoffs/SHWP-NATIVE-PROCESS-CANARY-001.json').read_text())
          assert handoff['state']=='COMPLETED'
          assert handoff['goal']['successor_policy']=='NONE'
          assert task['state']=='COMPLETED'
          assert task['archive_eligible'] is True
          assert task['claim_id'] is None and task['worker_id'] is None
          assert receipt['completed'] is True
          assert receipt['transition_id']=='CANARY_COMPLETE'
          assert isinstance(receipt['fencing_token'],int) and receipt['fencing_token']>0
          print('RETAINED_NATIVE_CANARY_PASS')
          PY

      - name: Prove legacy issuer cannot advance epoch
        run: |
          before="$(sha256sum control/heartbeat-state.json | cut -d' ' -f1)"
          output="$(python3 scripts/issue_heartbeats.py --dry-run)"
          after="$(sha256sum control/heartbeat-state.json | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          value=json.loads(sys.argv[1])
          assert value['epoch_advanced'] is False
          assert value['authority_effect']=='none'
          print('LEGACY_ISSUER_NO_EPOCH_OWNERSHIP_PASS')
          PY

      - name: Prove heartbeat dry-run is carrier-only and non-mutating
        run: |
          set -euo pipefail
          before="$(sha256sum control/worker-registry.json control/heartbeat-state.json control/worker-cost-observations.json | sha256sum | cut -d' ' -f1)"
          output="$(python scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          echo "$output"
          after="$(sha256sum control/worker-registry.json control/heartbeat-state.json control/worker-cost-observations.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python - <<'PY' "$output"
          import json, sys
          value=json.loads(sys.argv[1])
          assert value['authority_effect']=='NONE_CARRIER_ONLY', value
          assert value['claims_issued'] == 0, value
          assert value['workers_invoked'] == 0, value
          assert value['tasks_activated'] == 0, value
          assert value['leases_expired'] == 0, value
          assert value['legacy_hb29_cutover'] == 'PREVIEW_ONLY', value
          assert value['progression_dependency'] == 'OSCILLATOR_ONLY', value
          assert value['observation_is_causal'] is False, value
          assert value['oscillator_period_ms'] == 10, value
          assert 'coherent_signal_space' in value, value
          assert value['coherent_signal_space'].get('completeness_claim') is not True, value
          print('HEARTBEAT_CARRIER_NON_AUTHORITY_PASS')
          PY

      - name: Prove historical repeated carrier replay preserves legacy HB29
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/control" "$tmp/handoffs" "$tmp/cost-basis" "$tmp/heartbeat_runtime" "$tmp/receipts"
          cp control/heartbeat-state.json control/worker-registry.json control/worker-cost-observations.json control/process-worker-adapters.json "$tmp/control/"
          if [ -f control/heartbeat-subsignals.json ]; then cp control/heartbeat-subsignals.json "$tmp/control/"; fi
          cp -R handoffs/. "$tmp/handoffs/"
          cp -R cost-basis/. "$tmp/cost-basis/"
          cp -R heartbeat_runtime/. "$tmp/heartbeat_runtime/"
          PYTHONPATH="$tmp" python3 - "$tmp" <<'PY'
          import sys
          from pathlib import Path
          from heartbeat_runtime import CarrierHeartbeatRuntime

          root=Path(sys.argv[1])
          legacy_path=root/'control'/'heartbeat-state.json'
          legacy_before=legacy_path.read_bytes()
          runtime=CarrierHeartbeatRuntime(root)
          base_ns=2_000_000_000
          rows=[runtime.cycle(write=True, now_ns=base_ns + i*10_000_000) for i in range(3)]
          assert [row['epoch'] for row in rows] == [30,31,32], rows
          assert legacy_path.read_bytes() == legacy_before
          assert all(row['authority_effect']=='NONE_CARRIER_ONLY' for row in rows), rows
          assert all(row['workers_invoked']==0 for row in rows), rows
          carrier=(root/'control'/'heartbeat-carrier-runtime-state.json').read_text(encoding='utf-8')
          assert '"epoch": 32' in carrier, carrier
          print('REPEATED_SEPARATED_CARRIER_HISTORICAL_REPLAY_PASS')
          PY

      - name: Prove current protocol anchor derives independently of historical replay state
        run: |
          python - <<'PY'
          from heartbeat_runtime.independent_oscillator import (
              OSCILLATOR_PERIOD_NS,
              PROTOCOL_ANCHOR_EPOCH,
              PROTOCOL_ANCHOR_UNIX_NS,
              current_reference,
          )
          a=current_reference(now_ns=PROTOCOL_ANCHOR_UNIX_NS)
          b=current_reference(now_ns=PROTOCOL_ANCHOR_UNIX_NS + 10*OSCILLATOR_PERIOD_NS)
          assert a['epoch'] == PROTOCOL_ANCHOR_EPOCH, a
          assert b['epoch'] == PROTOCOL_ANCHOR_EPOCH + 10, b
          print('CURRENT_PROTOCOL_ANCHOR_DERIVATION_PASS', a['epoch'], b['epoch'])
          PY

      - name: Prove carrier and worker compatibility surfaces are distinct
        run: |
          python - <<'PY'
          import inspect
          from heartbeat_runtime import CarrierHeartbeatRuntime, HeartbeatRuntime
          from heartbeat_runtime.worker_runtime import WorkerCoordinator
          assert CarrierHeartbeatRuntime.__module__ == 'heartbeat_runtime.engine_v13'
          assert HeartbeatRuntime.__module__ == 'heartbeat_runtime.engine_v11'
          assert WorkerCoordinator.__module__ == 'heartbeat_runtime.admitted_worker_runtime'
          assert HeartbeatRuntime is not CarrierHeartbeatRuntime
          assert WorkerCoordinator is not CarrierHeartbeatRuntime
          source=inspect.getsource(WorkerCoordinator._activate_from_trigger)
          assert 'review_worker_task_admission' in source
          assert 'verdict != "ADMIT"' in source
          assert 'return super()._activate_from_trigger' in source
          print('CARRIER_WORKER_SEPARATION_AND_ADMISSION_GATE_PASS')
          PY

      - name: Rebuild projections ephemerally without repository persistence
        run: |
          set -euo pipefail
          python scripts/project_heartbeat_workers.py --write | tee /tmp/worker-status.json
          python scripts/evaluate_goal_convergence.py --write | tee /tmp/goal-convergence.json
          python scripts/reconcile_heartbeat_continuity.py --write | tee /tmp/heartbeat-continuity.json
          python scripts/query_worker_status.py --state BLOCKED | tee /tmp/blocked-query.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/blocked-query.json'))
          assert q['observational_only'] is True
          assert q['execution_authority'] is False
          print('EPHEMERAL_PROJECTION_VALIDATION_PASS', q['count'])
          PY
          git status --short

      - name: Run manual heartbeat watchdog diagnostic without durable authority
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/watch_heartbeat_returns.py
          git diff -- heartbeats/watchdog warrants
          git diff --quiet -- control/heartbeat-state.json control/worker-registry.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('heartbeats/watchdog').glob('epoch-*.json'))
          if not files:
              raise SystemExit('no watchdog diagnostic produced')
          value=json.loads(files[-1].read_text())
          assert value.get('authority_effect')=='none', value
          print('WATCHDOG_DIAGNOSTIC_NON_AUTHORITATIVE_PASS')
          PY

      - name: Prove workflow itself is non-authorizing
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/heartbeat-worker-project.yml').read_text(encoding='utf-8')
          pieces=(
              ('contents', ': write'),
              ('git', ' push'),
              ('actions/', 'checkout@'),
              ('actions/', 'setup-python@'),
              ('secrets.', 'GITHUB_TOKEN'),
              ('github.', 'token'),
          )
          forbidden=[left+right for left,right in pieces]
          found=[needle for needle in forbidden if needle in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('WORKFLOW_NON_AUTHORIZING_PASS')
          PY
