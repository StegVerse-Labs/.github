# Validation-only workflow for SHWP control-plane artifacts.
# It has no scheduler, activation, repository mutation, credential, claim, or fence role.
# TC/TVC owns credential semantics; the resident sovereign heartbeat owns execution.
name: Heartbeat Worker Project - Validation Only / No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'handoffs/**'
      - 'heartbeat_runtime/**'
      - 'workers/**'
      - 'tests/**'
      - 'control/**'
      - 'cost-basis/worker-runtime/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/heartbeat-worker-project.yml'
  pull_request:
    paths:
      - 'handoffs/**'
      - 'heartbeat_runtime/**'
      - 'workers/**'
      - 'tests/**'
      - 'control/**'
      - 'cost-basis/worker-runtime/**'
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/heartbeat-worker-project.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: heartbeat-worker-project-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/stegverse-ci-bin
          ln -sf "$(command -v python3)" /tmp/stegverse-ci-bin/python
          echo /tmp/stegverse-ci-bin >> "$GITHUB_PATH"

      - name: Prove validation environment has no GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_PAT:-}"
          echo NO_GITHUB_CREDENTIAL_TOKEN_PRESENT

      - name: Compile runtime, workers, and scripts
        run: |
          set -euo pipefail
          python -m compileall -q heartbeat_runtime workers scripts

      - name: Parse canonical JSON surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots=(Path('schemas'),Path('control'),Path('handoffs'),Path('cost-basis/worker-runtime'),Path('authorizations'))
          count=0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.json')):
                  json.loads(path.read_text(encoding='utf-8'))
                  count += 1
          assert count > 0
          print('CANONICAL_JSON_PASS', count)
          PY

      - name: Validate executable handoffs
        run: python scripts/validate_executable_handoffs.py

      - name: Run complete deterministic repository test suite
        run: python -m unittest discover -v tests

      - name: Prove heartbeat dry-run cannot persist registry or epoch state
        run: |
          set -euo pipefail
          before="$(sha256sum control/worker-registry.json control/heartbeat-state.json control/worker-cost-observations.json | sha256sum | cut -d' ' -f1)"
          output="$(python scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          echo "$output"
          after="$(sha256sum control/worker-registry.json control/heartbeat-state.json control/worker-cost-observations.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python - <<'PY' "$output"
          import json, sys
          value=json.loads(sys.argv[1])
          assert value['authority_effect']=='none_beyond_existing_admitted_task_authority', value
          print('DRY_RUN_NON_MUTATING_PASS')
          PY

      - name: Rebuild projections ephemerally without repository persistence
        run: |
          set -euo pipefail
          python scripts/project_heartbeat_workers.py --write >/tmp/worker-status.json
          python scripts/evaluate_goal_convergence.py --write >/tmp/goal-convergence.json
          python scripts/reconcile_heartbeat_continuity.py --write >/tmp/heartbeat-continuity.json
          python scripts/query_worker_status.py --state BLOCKED >/tmp/blocked-query.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/blocked-query.json'))
          assert q['observational_only'] is True
          assert q['execution_authority'] is False
          print('EPHEMERAL_PROJECTION_VALIDATION_PASS', q['count'])
          PY
          # Changes remain runner-local. There is deliberately no repository persistence.
          git status --short

      - name: Prove workflow itself is non-authorizing
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/heartbeat-worker-project.yml').read_text(encoding='utf-8')
          pieces=(
              ('contents', ': write'),
              ('git', ' push'),
              ('actions/', 'checkout@'),
              ('actions/', 'setup-python@'),
              ('GITHUB', '_TOKEN:'),
              ('GH', '_TOKEN:'),
          )
          forbidden=[left+right for left,right in pieces]
          found=[needle for needle in forbidden if needle in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('WORKFLOW_NON_AUTHORIZING_PASS')
          PY
