name: MIR AILeash OTS copy upgrade verification

on:
  push:
    branches:
      - mir-aileash-walk-reset-g84
    paths:
      - .github/workflows/mir-aileash-exact-public-evidence-fetch.yml

permissions:
  contents: read

jobs:
  verify-ots-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact old-chain subjects proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import base64, hashlib, json, pathlib, ssl, urllib.parse, urllib.request
          tip="4a99a3b5fa83d79a8baba0c8cd4415bab37b0435ee5dff14d50900e7b0acf260"
          url="https://sebbi.pro/x/ots/proof?"+urllib.parse.urlencode({"tip":tip})
          req=urllib.request.Request(url,headers={"User-Agent":"StegVerse-public-evidence-verifier/1.0","Accept":"application/json"})
          with urllib.request.urlopen(req,context=ssl.create_default_context(),timeout=30) as r:
              raw=r.read()
              status=r.status
          doc=json.loads(raw)
          pathlib.Path("evidence/ots-proof-response.json").write_bytes(raw)
          proof=base64.b64decode(doc["ots_base64"])
          pathlib.Path("evidence/subject.original.ots").write_bytes(proof)
          pathlib.Path("evidence/subject.ots").write_bytes(proof)
          pathlib.Path("evidence/tip.bin").write_bytes(bytes.fromhex(tip))
          print("OTS_FETCH "+json.dumps({"url":url,"http_status":status,"response_sha256":hashlib.sha256(raw).hexdigest(),"tip":tip,"stamp_id":doc.get("stamp_id"),"stamped_at":doc.get("stamped_at"),"reported_state":doc.get("state"),"proof_sha256_reported":doc.get("proof_sha256"),"proof_sha256_recomputed":hashlib.sha256(proof).hexdigest(),"proof_bytes":len(proof),"bitcoin_block_heights":doc.get("bitcoin_block_heights"),"pending_calendars":doc.get("pending_calendars")},sort_keys=True))
          PY

      - name: Upgrade and verify copied proof with standard client
        shell: bash
        run: |
          set -u
          python -m pip install --disable-pip-version-check --quiet opentimestamps-client
          {
            echo "ORIGINAL_SHA256 $(sha256sum evidence/subject.original.ots | awk '{print $1}')"
            echo "ORIGINAL_INFO_BEGIN"
            ots info evidence/subject.original.ots || true
            echo "ORIGINAL_INFO_END"
          } | tee evidence/original-info.txt
          set +e
          ots upgrade evidence/subject.ots > evidence/upgrade.txt 2>&1
          upgrade_rc=$?
          ots info evidence/subject.ots > evidence/upgraded-info.txt 2>&1
          info_rc=$?
          ots verify -f evidence/tip.bin evidence/subject.ots > evidence/verify.txt 2>&1
          verify_rc=$?
          set -e
          echo "UPGRADED_SHA256 $(sha256sum evidence/subject.ots | awk '{print $1}')"
          echo "UPGRADE_RC $upgrade_rc"
          cat evidence/upgrade.txt
          echo "INFO_RC $info_rc"
          cat evidence/upgraded-info.txt
          echo "VERIFY_RC $verify_rc"
          cat evidence/verify.txt
          python - "$upgrade_rc" "$info_rc" "$verify_rc" <<'PY'
          import hashlib,json,pathlib,sys
          summary={
            "original_sha256":hashlib.sha256(pathlib.Path("evidence/subject.original.ots").read_bytes()).hexdigest(),
            "upgraded_sha256":hashlib.sha256(pathlib.Path("evidence/subject.ots").read_bytes()).hexdigest(),
            "upgrade_rc":int(sys.argv[1]),"info_rc":int(sys.argv[2]),"verify_rc":int(sys.argv[3]),
            "upgrade_output":pathlib.Path("evidence/upgrade.txt").read_text(errors="replace")[:10000],
            "info_output":pathlib.Path("evidence/upgraded-info.txt").read_text(errors="replace")[:10000],
            "verify_output":pathlib.Path("evidence/verify.txt").read_text(errors="replace")[:10000],
          }
          pathlib.Path("evidence/ots-copy-verification-summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2))
          print("OTS_COPY_RESULT "+json.dumps(summary,sort_keys=True))
          PY

      - name: Retain OTS copy verification bytes
        uses: actions/upload-artifact@v4
        with:
          name: mir-aileash-ots-copy-verification
          path: evidence/
          if-no-files-found: error
          retention-days: 30
