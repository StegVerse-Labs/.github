name: Render Organization Handoff State - No GitHub Token Authority

# Cost control: manual only. Control/state commits must not automatically create
# paid hosted render/check runs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Render organization state ephemerally
        run: python3 scripts/render_org_handoff.py
      - name: Require committed projection to match
        run: git diff --exit-code -- docs/ORG_CONTROL_PLANE_STATE.md
