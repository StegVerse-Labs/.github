name: Render Organization Handoff State - No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_org_handoff.py'
      - 'docs/ORG_CONTROL_PLANE_STATE.md'
      - '.github/workflows/org-handoff-render.yml'
  pull_request:
    paths:
      - 'control/org-state.json'
      - 'control/claims-active.json'
      - 'control/queue.json'
      - 'scripts/render_org_handoff.py'
      - 'docs/ORG_CONTROL_PLANE_STATE.md'
      - '.github/workflows/org-handoff-render.yml'
  workflow_dispatch:

permissions: {}

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Render organization state ephemerally
        run: python3 scripts/render_org_handoff.py

      - name: Require committed projection to match
        run: git diff --exit-code -- docs/ORG_CONTROL_PLANE_STATE.md
