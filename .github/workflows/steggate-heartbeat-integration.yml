name: StegGate Canonical Heartbeat Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json'
      - 'control/process-worker-adapters.json'
      - 'control/heartbeat-subsignals.json'
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
      - 'handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - '.github/workflows/steggate-heartbeat-integration.yml'

permissions:
  contents: write

concurrency:
  group: steggate-canonical-heartbeat-integration
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      heartbeat_id: ${{ steps.cycle.outputs.heartbeat_id }}
      heartbeat_epoch: ${{ steps.cycle.outputs.heartbeat_epoch }}
      lease_id: ${{ steps.cycle.outputs.lease_id }}
      lease_action: ${{ steps.cycle.outputs.lease_action }}
      lease_dependents_json: ${{ steps.cycle.outputs.lease_dependents_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile stable rendezvous worker activation inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('control/worker-registry.json')
          registry=json.loads(path.read_text())
          task=next((x for x in registry.get('tasks',[]) if x.get('task_id')=='STEGGATE-STABLE-RENDEZVOUS-WORKER-001'),None)
          if task is None:
              raise SystemExit('stable rendezvous worker task missing from canonical registry')
          if task.get('state') not in {'HANDOFF_READY','ACTIVE','BLOCKED','CLAIMED','EXPIRING','HANDOFF_WRITING'}:
              raise SystemExit(f"unexpected stable rendezvous worker state: {task.get('state')}")
          task['cost_basis_ref']='cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
          if task.get('state') == 'HANDOFF_READY':
              task['block_ref']=None
              task['archive_reason_codes']=[c for c in task.get('archive_reason_codes',[]) if c not in {'EXPIRY_BASIS_UNAVAILABLE','CREDENTIAL_VALUES_ABSENT'}]
          path.write_text(json.dumps(registry,indent=2,sort_keys=True)+'\n')
          PY

      - name: Advance exactly one canonical heartbeat epoch and execute admitted workers
        id: cycle
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          python scripts/run_heartbeat_runtime.py --cycles 1 | tee integration-evidence/heartbeat-cycle.jsonl
          python scripts/project_heartbeat_workers.py --write
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          rows=[json.loads(x) for x in Path('integration-evidence/heartbeat-cycle.jsonl').read_text().splitlines() if x.strip()]
          if len(rows) != 1: raise SystemExit('expected exactly one heartbeat cycle')
          row=rows[0]
          epoch=str(row['epoch'])
          heartbeat_id=f"HB-{os.environ['GITHUB_RUN_ID']}-{epoch}"
          signal=json.loads(Path('control/heartbeat-subsignals.json').read_text())
          lease=signal['subsignals']['steggate_transport_lease']
          print('heartbeat_epoch='+epoch)
          print('heartbeat_id='+heartbeat_id)
          print('lease_id='+lease['lease_id'])
          print('lease_action='+lease['lease_action'])
          print('lease_dependents_json='+json.dumps(lease.get('dependent_tasks',[]),separators=(',',':')))
          Path('integration-evidence/heartbeat-binding.json').write_text(json.dumps({
            'schema':'stegverse.heartbeat_steggate_integration.v4',
            'heartbeat_id':heartbeat_id,
            'heartbeat_epoch':epoch,
            'cycle':row,
            'subsignals':{'steggate_transport_lease':lease},
            'scheduler_authority':'single_stegverse_heartbeat',
            'worker_registry':'control/worker-registry.json',
            'worker_status_projection':'control/worker-status.json',
            'wall_clock_scheduler_authority':False,
            'credential_values_recorded':False
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist heartbeat worker state
        run: |
          set -euo pipefail
          git config user.name 'stegverse-heartbeat-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add control/ events/
          if [ -d checkpoints ]; then git add checkpoints/; fi
          if [ -d receipts/steggate-rendezvous-worker ]; then git add receipts/steggate-rendezvous-worker/; fi
          if git diff --cached --quiet; then
            echo 'Heartbeat runtime produced no persistent state delta.' >&2
            git status --short
            exit 1
          fi
          git commit -m "heartbeat: advance claimed stable rendezvous worker"
          STASHED=false
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m heartbeat-runtime-noncanonical
            STASHED=true
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              if [ "$STASHED" = true ]; then git stash pop || true; fi
              exit 0
            fi
            echo "Concurrent main update observed during heartbeat persistence; retrying attempt ${attempt}/5." >&2
            sleep $((attempt * 2))
          done
          if [ "$STASHED" = true ]; then git stash pop || true; fi
          echo 'Unable to persist heartbeat state after bounded collision retries.' >&2
          exit 1

      - name: Preserve heartbeat evidence
        uses: actions/upload-artifact@v4
        with:
          name: steggate-canonical-heartbeat-${{ github.run_id }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 90

  steggate-micro-node:
    needs: heartbeat
    if: needs.heartbeat.outputs.lease_action == 'OPEN' || needs.heartbeat.outputs.lease_action == 'EXTEND'
    uses: StegVerse-Labs/StegCore/.github/workflows/steggate-heartbeat-worker-reusable.yml@main
    with:
      heartbeat_id: ${{ needs.heartbeat.outputs.heartbeat_id }}
      heartbeat_epoch: ${{ needs.heartbeat.outputs.heartbeat_epoch }}
      lease_id: ${{ needs.heartbeat.outputs.lease_id }}
      lease_action: ${{ needs.heartbeat.outputs.lease_action }}
      lease_dependents_json: ${{ needs.heartbeat.outputs.lease_dependents_json }}
