# Validation-only StegGate integration lane. Production heartbeat cadence, claims,
# fences, credential authority and persistence belong to the resident sovereign
# heartbeat plus TV/TVC; GitHub Actions is not an activation carrier.
name: StegGate Canonical Heartbeat Integration - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json'
      - 'control/process-worker-adapters.json'
      - 'control/heartbeat-subsignals.json'
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
      - 'handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - '.github/workflows/steggate-heartbeat-integration.yml'
  pull_request:
    paths:
      - 'management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json'
      - 'control/process-worker-adapters.json'
      - 'control/heartbeat-subsignals.json'
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
      - 'handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - '.github/workflows/steggate-heartbeat-integration.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate StegGate worker and authority surfaces
        run: |
          set -euo pipefail
          python3 -m py_compile workers/steggate_rendezvous_deployment_worker.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          handoff=json.loads(Path('handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json').read_text())
          auth=json.loads(Path('authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json').read_text())
          assert handoff['activation']['carrier']=='heartbeat'
          assert handoff['authority']['heartbeat_grants_execution_authority'] is False
          assert auth['heartbeat_grants_execution_authority'] is False
          print('STEGGATE_HEARTBEAT_SURFACES_PASS')
          PY

      - name: Exercise canonical heartbeat integration without persistence
        run: |
          set -euo pipefail
          before="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          output="$(python3 scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          after="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          row=json.loads(sys.argv[1])
          assert row['authority_effect']=='NONE_CARRIER_ONLY'
          assert row['claims_issued']==0
          assert row['workers_invoked']==0
          print('STEGGATE_DRY_RUN_NONPERSISTENT_PASS')
          PY

      - name: Prove hosted lane has no credential or activation authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/steggate-heartbeat-integration.yml').read_text(encoding='utf-8').splitlines()
          stripped=[line.strip() for line in lines]
          assert 'permissions: {}' in stripped
          assert 'contents: write' not in stripped
          assert not any(line.startswith('uses: actions/checkout@') for line in stripped)
          assert not any(line.startswith('uses: actions/setup-python@') for line in stripped)
          assert not any(line.startswith('git push ') for line in stripped)
          assert not any('scripts/run_heartbeat_runtime.py --cycles ' in line and '--dry-run' not in line for line in stripped)
          assert not any(line.startswith('CLOUDFLARE_API_TOKEN:') or line.startswith('CLOUDFLARE_ACCOUNT_ID:') for line in stripped)
          print('STEGGATE_HOSTED_AUTHORITY_RETIRED_PASS')
          PY
