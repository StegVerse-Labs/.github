# Validation-only StegGate integration lane. Production heartbeat cadence, claims,
# fences, credential authority and persistence belong to the resident sovereign
# heartbeat plus TV/TVC; GitHub Actions is not an activation carrier.
# Main-branch state/evidence persistence is intentionally excluded from automatic
# hosted CI; implementation/schema changes still validate, and PRs retain broad coverage.
name: StegGate Canonical Heartbeat Integration - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - '.github/workflows/steggate-heartbeat-integration.yml'
  pull_request:
    paths:
      - 'management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json'
      - 'control/process-worker-adapters.json'
      - 'control/heartbeat-subsignals.json'
      - 'schemas/heartbeat-subsignal.schema.json'
      - 'cost-basis/worker-runtime/steggate-rendezvous-deployment.json'
      - 'handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json'
      - 'workers/steggate_rendezvous_deployment_worker.py'
      - '.github/workflows/steggate-heartbeat-integration.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Compile StegGate worker surface
        run: python3 -m py_compile workers/steggate_rendezvous_deployment_worker.py

      - name: Validate StegGate integration inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          management=json.loads(Path('management/STEGGATE_HEARTBEAT_CREDENTIAL_INTEGRATION_001.json').read_text())
          adapters=json.loads(Path('control/process-worker-adapters.json').read_text())
          subsignals=json.loads(Path('control/heartbeat-subsignals.json').read_text())
          handoff=json.loads(Path('handoffs/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json').read_text())
          auth=json.loads(Path('authorizations/STEGGATE-STABLE-RENDEZVOUS-WORKER-001.json').read_text())
          assert handoff['task']['task_id']=='STEGGATE-STABLE-RENDEZVOUS-WORKER-001'
          assert handoff['authority']['heartbeat_grants_execution_authority'] is False
          assert auth['task_id']=='STEGGATE-STABLE-RENDEZVOUS-WORKER-001'
          assert management['credential_authority']=='TV/TVC'
          assert management['github_token_runtime_authority']=='NONE'
          assert 'steggate_rendezvous_deployment_worker' in Path('workers/steggate_rendezvous_deployment_worker.py').read_text()
          assert adapters
          assert subsignals
          print('STEGGATE_INTEGRATION_INPUT_PASS')
          PY

      - name: Prove hosted lane is non-authorizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/steggate-heartbeat-integration.yml').read_text(encoding='utf-8')
          forbidden=['contents'+': write','git'+' push','actions/'+'checkout@','actions/'+'setup-python@','$'+'{{ '+'secrets.']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('STEGGATE_VALIDATION_NON_AUTHORIZING_PASS')
          PY
