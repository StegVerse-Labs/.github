name: Validate KV AI Memory Resident Binding

on:
  push:
    paths:
      - 'README.md'
      - 'data/canonical-task-records/SV-KV-AI-PERSISTENCE-001.json'
      - 'docs/KV_AI_MEMORY_RESIDENT_EXECUTION_MIRROR_HANDOFF.md'
      - 'handoffs/SV-KV-AI-PERSISTENCE-001.json'
      - 'workers/kv_ai_memory_resident_worker.py'
      - 'workers/kv_ai_memory_intr_profile.py'
      - 'workers/kv_ai_memory_intr_transport.py'
      - 'scripts/install_sovereign_heartbeat_service.py'
      - 'scripts/refresh_sovereign_worker_runtime_source.py'
      - 'scripts/install_kv_ai_memory_universal_intr_route.py'
      - 'scripts/prepare_kv_ai_memory_intr_runtime_source.py'
      - 'scripts/submit_kv_ai_memory_packet_local.py'
      - 'scripts/consume_kv_ai_memory_resident_request.py'
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'control/worker-registry.d/kv-ai-memory-resident-001.json'
      - 'control/process-worker-adapters.d/kv-ai-memory-resident-001.json'
      - 'control/resident-execution-request.d/kv-ai-memory-resident-001.json'
      - 'tests/test_kv_ai_memory_resident_binding.py'
      - 'tests/test_kv_ai_memory_intr_admission.py'
      - 'tests/test_prepare_kv_ai_memory_intr_runtime_source.py'
      - 'tests/test_kv_ai_memory_runtime_surface_invariant.py'
      - 'tests/test_kv_ai_memory_resident_source_carriage.py'
      - '.github/workflows/validate-kv-ai-memory-resident.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'data/canonical-task-records/SV-KV-AI-PERSISTENCE-001.json'
      - 'docs/KV_AI_MEMORY_RESIDENT_EXECUTION_MIRROR_HANDOFF.md'
      - 'handoffs/SV-KV-AI-PERSISTENCE-001.json'
      - 'workers/kv_ai_memory_resident_worker.py'
      - 'workers/kv_ai_memory_intr_profile.py'
      - 'workers/kv_ai_memory_intr_transport.py'
      - 'scripts/install_sovereign_heartbeat_service.py'
      - 'scripts/refresh_sovereign_worker_runtime_source.py'
      - 'scripts/install_kv_ai_memory_universal_intr_route.py'
      - 'scripts/prepare_kv_ai_memory_intr_runtime_source.py'
      - 'scripts/submit_kv_ai_memory_packet_local.py'
      - 'scripts/consume_kv_ai_memory_resident_request.py'
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'control/worker-registry.d/kv-ai-memory-resident-001.json'
      - 'control/process-worker-adapters.d/kv-ai-memory-resident-001.json'
      - 'control/resident-execution-request.d/kv-ai-memory-resident-001.json'
      - 'tests/test_kv_ai_memory_resident_binding.py'
      - 'tests/test_kv_ai_memory_intr_admission.py'
      - 'tests/test_prepare_kv_ai_memory_intr_runtime_source.py'
      - 'tests/test_kv_ai_memory_runtime_surface_invariant.py'
      - 'tests/test_kv_ai_memory_resident_source_carriage.py'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_kv_ai_memory_resident_binding.py tests/test_kv_ai_memory_intr_admission.py tests/test_prepare_kv_ai_memory_intr_runtime_source.py tests/test_kv_ai_memory_runtime_surface_invariant.py tests/test_kv_ai_memory_resident_source_carriage.py
      - run: python -m py_compile workers/kv_ai_memory_resident_worker.py workers/kv_ai_memory_intr_profile.py workers/kv_ai_memory_intr_transport.py scripts/install_sovereign_heartbeat_service.py scripts/refresh_sovereign_worker_runtime_source.py scripts/install_kv_ai_memory_universal_intr_route.py scripts/prepare_kv_ai_memory_intr_runtime_source.py scripts/submit_kv_ai_memory_packet_local.py scripts/consume_kv_ai_memory_resident_request.py scripts/dispatch_resident_execution_requests.py
