# Validation-only carrier for the unified StegVerse heartbeat.
# The heartbeat runtime itself owns reference advancement and worker scheduling.
name: Organization Heartbeat Validation - No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - control/claims-active.json
      - control/org-state.json
      - heartbeat_runtime/**
      - schemas/heartbeat-carrier-runtime-state.schema.json
      - scripts/issue_heartbeats.py
      - scripts/run_heartbeat_runtime.py
      - scripts/validate_heartbeat_returns.py
      - .github/workflows/org-heartbeat.yml
  pull_request:
    paths:
      - control/claims-active.json
      - control/org-state.json
      - heartbeat_runtime/**
      - schemas/heartbeat-carrier-runtime-state.schema.json
      - scripts/issue_heartbeats.py
      - scripts/run_heartbeat_runtime.py
      - scripts/validate_heartbeat_returns.py
      - .github/workflows/org-heartbeat.yml

permissions: {}

concurrency:
  group: org-heartbeat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Compile unified heartbeat surfaces
        run: |
          python3 -m py_compile heartbeat_runtime/org_assertions.py heartbeat_runtime/engine_v3.py heartbeat_runtime/engine_v12.py
          python3 -m py_compile scripts/issue_heartbeats.py scripts/run_heartbeat_runtime.py scripts/validate_heartbeat_returns.py

      - name: Prove legacy issuer cannot advance epoch
        run: |
          before="$(sha256sum control/heartbeat-state.json | cut -d' ' -f1)"
          output="$(python3 scripts/issue_heartbeats.py --dry-run)"
          after="$(sha256sum control/heartbeat-state.json | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          value=json.loads(sys.argv[1])
          assert value['epoch_advanced'] is False
          assert value['authority_effect']=='none'
          print('LEGACY_ISSUER_NO_EPOCH_OWNERSHIP_PASS')
          PY

      - name: Prove unified runtime owns one nonpersistent dry-run reference
        run: |
          before="$(sha256sum control/heartbeat-state.json control/worker-registry.json | sha256sum | cut -d' ' -f1)"
          output="$(python3 scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          after="$(sha256sum control/heartbeat-state.json control/worker-registry.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          value=json.loads(sys.argv[1])
          assert 'organization_assertions' in value
          assert value['authority_effect']=='none_beyond_existing_admitted_task_authority'
          assert value['selected_runtime'].endswith('engine_v12.HeartbeatRuntime')
          assert value['epoch']==30
          print('SEPARATED_HEARTBEAT_DRY_RUN_HB30_PASS')
          PY

      - name: Prove repeated separated carrier advancement in disposable state
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/control" "$tmp/handoffs" "$tmp/cost-basis"
          cp control/heartbeat-state.json control/worker-registry.json control/worker-cost-observations.json control/process-worker-adapters.json control/claims-active.json control/org-state.json control/heartbeat-subsignals.json "$tmp/control/"
          cp -R handoffs/. "$tmp/handoffs/"
          cp -R cost-basis/. "$tmp/cost-basis/"
          legacy_before="$(sha256sum "$tmp/control/heartbeat-state.json" | cut -d' ' -f1)"
          start="$(python3 - <<'PY' "$tmp/control/heartbeat-state.json"
          import json,sys
          print(json.load(open(sys.argv[1]))['epoch'])
          PY
          )"
          test "$start" = "29"
          python3 scripts/run_heartbeat_runtime.py --root "$tmp" --cycles 3 --interval-ms 1 >/tmp/heartbeat-three-cycles.jsonl
          legacy_after="$(sha256sum "$tmp/control/heartbeat-state.json" | cut -d' ' -f1)"
          test "$legacy_before" = "$legacy_after"
          python3 - <<'PY' "$start" "$tmp/control/heartbeat-carrier-runtime-state.json" "$tmp/control/heartbeat-carrier-observation.json" "$tmp/control/worker-control-plane-coordination.json" "$tmp/receipts/heartbeat-schema-cutover/HB29.json" /tmp/heartbeat-three-cycles.jsonl
          import json,sys
          start=int(sys.argv[1])
          carrier=json.load(open(sys.argv[2]))
          observation=json.load(open(sys.argv[3]))
          control=json.load(open(sys.argv[4]))
          receipt=json.load(open(sys.argv[5]))
          rows=[json.loads(x) for x in open(sys.argv[6]) if x.strip()]
          assert [r['epoch'] for r in rows]==[start+1,start+2,start+3]
          assert all(r['selected_runtime'].endswith('engine_v12.HeartbeatRuntime') for r in rows)
          assert carrier['epoch']==start+3
          assert carrier['schema']=='stegverse.heartbeat-carrier-runtime-state/v1'
          assert observation['schema']=='stegverse.heartbeat-carrier-observation/v1'
          assert control['schema']=='stegverse.worker-control-plane-coordination/v1'
          assert receipt['state']=='CLOSED_MIGRATED'
          assert receipt['legacy_epoch']==29 and receipt['first_new_epoch']==30
          carrier_text=json.dumps(observation,sort_keys=True)
          assert 'claim_id' not in carrier_text and 'fencing_token' not in carrier_text and 'active_leases' not in carrier_text
          assert observation['authority']['credential_authority']=='TV/TVC'
          assert observation['authority']['heartbeat_grants_execution_authority'] is False
          print('REPEATED_SEPARATED_HEARTBEAT_PASS')
          PY
