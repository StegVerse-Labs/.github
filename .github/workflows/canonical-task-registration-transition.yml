name: Canonical Task Registration Transition - Non-Authorizing

# Manifest-directed Goal Task registration (contracts/canonical-task-registration-transition.v1.json).
# For every registration manifest a pull request adds or changes, re-derive the record, the
# Registry row (row == record), the generation bump and the COSV vector and index entry from
# the LIVE base tip and require the PR head to hold exactly those bytes. Read-only: no push, no
# ledger append, no dispatch, no claim or fence. The receipt is uploaded as the run's observation.

on:
  pull_request:
    paths:
      - 'control/canonical-task-registration-requests/**'
      - 'scripts/canonical_task_registration_transition.py'
      - 'contracts/canonical-task-registration-transition.v1.json'
      - 'schemas/canonical-task-registration-request.schema.json'
      - 'schemas/canonical-task-registration-transition-receipt.schema.json'
      - 'tests/test_canonical_task_registration_transition.py'
      - '.github/workflows/canonical-task-registration-transition.yml'
      # scope freeze (GOAL_SCOPE_SEALED): any change to a Goal's record, row or seal
      - 'scripts/goal_scope_seal.py'
      - 'tests/test_goal_scope_seal.py'
      - 'control/goal-scope-seals/**'
      - 'control/goal-scope-supersede-requests/**'
      - 'data/canonical-task-records/**'
      - 'data/canonical-task-registry.json'
      # Goal registration manifests (NEW_IDENTITY requests carried as fixtures; no registry edit)
      - 'tests/test_i1_goal_registration_manifests.py'
      - 'tests/fixtures/canonical_task_registration/**'
      - 'control/goal-task-allocation-requests/**'
      # adjacency-ruling input to the collision check-in (recomputed, never trusted)
      - 'scripts/adjacency_ruling.py'
      - 'tests/test_adjacency_ruling.py'
      - 'control/adjacency-rulings/**'
  push:
    branches: [main]
    paths:
      - 'control/canonical-task-registration-requests/**'
      - 'scripts/canonical_task_registration_transition.py'
      - 'scripts/goal_scope_seal.py'
      - 'control/goal-scope-seals/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        # callable set for the paths this workflow is selected by; 0 skipped
        run: python -m unittest -v tests.test_canonical_task_registration_transition tests.test_goal_scope_seal tests.test_i1_goal_registration_manifests tests.test_adjacency_ruling
      - name: Goal scope freeze (GOAL_SCOPE_SEALED) against the live base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
          fi
          git worktree add -q --detach "$RUNNER_TEMP/scope-base" "$base"
          status=0
          python scripts/goal_scope_seal.py check --base "$RUNNER_TEMP/scope-base" --head . \
            --receipt-out "$RUNNER_TEMP/receipts/goal-scope-freeze.json" || status=1
          { echo "### goal scope freeze"; echo '```json'; cat "$RUNNER_TEMP/receipts/goal-scope-freeze.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$RUNNER_TEMP/scope-base"
          exit $status
      - name: Verify registration manifests against the live base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
          fi
          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
          changed=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'control/canonical-task-registration-requests/*.json' || true)
          if [ -z "$changed" ]; then
            echo '{"disposition":"ALLOW","detail":"no registration manifest added or changed","authority_effect":"NONE_REGISTRATION_ONLY"}' | tee "$RUNNER_TEMP/receipts/none.json"
            exit 0
          fi
          status=0
          for manifest in $changed; do
            name=$(basename "$manifest" .json)
            python scripts/canonical_task_registration_transition.py verify --request "$manifest" \
              --base "$RUNNER_TEMP/base" --head . --receipt-out "$RUNNER_TEMP/receipts/$name.json" || status=1
            { echo "### $manifest"; echo '```json'; cat "$RUNNER_TEMP/receipts/$name.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Recompute adjacency rulings (conditions a/b/c) at the pinned finish-point source
        # For every ruling a pull request adds or changes: anonymously fetch the ruling's pinned finish-point
        # commit (public source only; no token) and re-run the registration plan with the ruling. The plan
        # recomputes component disjointness and the finish-point test's static closure itself; a ruling that
        # does not hold leaves the plan FAIL_CLOSED (six fields). Read-only: plan mode writes nothing.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "push: no ruling input"; exit 0; fi
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          changed=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}" HEAD -- 'control/adjacency-rulings/*.json' || true)
          if [ -z "$changed" ]; then echo "no adjacency ruling added or changed"; exit 0; fi
          status=0
          for ruling in $changed; do
            name=$(basename "$ruling" .json)
            request="control/canonical-task-registration-requests/$name.json"
            [ -f "$request" ] || request=$(find tests/fixtures/canonical_task_registration -name "$name.request.json" | head -1)
            if [ -z "$request" ]; then echo "::error::no registration request for $ruling"; status=1; continue; fi
            repo=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['subject']['finish_point']['repository'])" "$ruling")
            commit=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['subject']['finish_point']['source_commit'])" "$ruling")
            fp="$RUNNER_TEMP/finish-point-$name"
            git init -q "$fp"
            env -u GITHUB_TOKEN -u GH_TOKEN git -C "$fp" fetch -q --depth=1 "https://github.com/${repo}.git" "$commit" \
              && git -C "$fp" checkout -q --detach FETCH_HEAD || echo "finish-point source unavailable; the plan fails closed"
            python scripts/canonical_task_registration_transition.py plan --request "$request" \
              --adjacency-ruling "$ruling" --finish-point-root "$fp" \
              --receipt-out "$RUNNER_TEMP/receipts/adjacency-$name.json" || status=1
            { echo "### adjacency ruling $ruling"; echo '```json'; cat "$RUNNER_TEMP/receipts/adjacency-$name.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Upload receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-task-registration-receipts
          path: ${{ runner.temp }}/receipts
