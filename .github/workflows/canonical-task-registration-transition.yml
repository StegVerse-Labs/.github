name: Canonical Task Registration Transition - Non-Authorizing

# Manifest-directed Goal Task registration (contracts/canonical-task-registration-transition.v1.json).
# For every registration manifest a pull request adds or changes, re-derive the record, the
# Registry row (row == record), the generation bump and the COSV vector and index entry from
# the LIVE base tip and require the PR head to hold exactly those bytes. Read-only: no push, no
# ledger append, no dispatch, no claim or fence. The receipt is uploaded as the run's observation.

on:
  pull_request:
    paths:
      - 'control/canonical-task-registration-requests/**'
      - 'scripts/canonical_task_registration_transition.py'
      - 'contracts/canonical-task-registration-transition.v1.json'
      - 'schemas/canonical-task-registration-request.schema.json'
      - 'schemas/canonical-task-registration-transition-receipt.schema.json'
      - 'tests/test_canonical_task_registration_transition.py'
      - '.github/workflows/canonical-task-registration-transition.yml'
      # scope freeze (GOAL_SCOPE_SEALED): any change to a Goal's record, row or seal
      - 'scripts/goal_scope_seal.py'
      - 'tests/test_goal_scope_seal.py'
      - 'control/goal-scope-seals/**'
      - 'control/goal-scope-supersede-requests/**'
      - 'data/canonical-task-records/**'
      - 'data/canonical-task-registry.json'
  push:
    branches: [main]
    paths:
      - 'control/canonical-task-registration-requests/**'
      - 'scripts/canonical_task_registration_transition.py'
      - 'scripts/goal_scope_seal.py'
      - 'control/goal-scope-seals/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        # callable set for the paths this workflow is selected by; 0 skipped
        run: python -m unittest -v tests.test_canonical_task_registration_transition tests.test_goal_scope_seal
      - name: Goal scope freeze (GOAL_SCOPE_SEALED) against the live base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
          fi
          git worktree add -q --detach "$RUNNER_TEMP/scope-base" "$base"
          status=0
          python scripts/goal_scope_seal.py check --base "$RUNNER_TEMP/scope-base" --head . \
            --receipt-out "$RUNNER_TEMP/receipts/goal-scope-freeze.json" || status=1
          { echo "### goal scope freeze"; echo '```json'; cat "$RUNNER_TEMP/receipts/goal-scope-freeze.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$RUNNER_TEMP/scope-base"
          exit $status
      - name: Verify registration manifests against the live base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="origin/${BASE_REF}"
          else
            base="${PUSH_BEFORE}"
          fi
          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
          changed=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'control/canonical-task-registration-requests/*.json' || true)
          if [ -z "$changed" ]; then
            echo '{"disposition":"ALLOW","detail":"no registration manifest added or changed","authority_effect":"NONE_REGISTRATION_ONLY"}' | tee "$RUNNER_TEMP/receipts/none.json"
            exit 0
          fi
          status=0
          for manifest in $changed; do
            name=$(basename "$manifest" .json)
            python scripts/canonical_task_registration_transition.py verify --request "$manifest" \
              --base "$RUNNER_TEMP/base" --head . --receipt-out "$RUNNER_TEMP/receipts/$name.json" || status=1
            { echo "### $manifest"; echo '```json'; cat "$RUNNER_TEMP/receipts/$name.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Upload receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-task-registration-receipts
          path: ${{ runner.temp }}/receipts
