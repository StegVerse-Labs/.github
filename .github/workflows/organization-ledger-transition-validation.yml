name: Organization Ledger Transition Validation

# PR-facing (and, where it already ran there, push-to-main) checks of
# .github/workflows/organization-ledger-transition.yml, split from that writer so every
# job here runs on every trigger: none is conditional and none holds contents: write.
on:
  pull_request:
    paths:
      - '.github/workflows/organization-ledger-transition.yml'
      - '.github/workflows/organization-ledger-transition-validation.yml'
      - 'scripts/check_dispatch_hb_epoch.py'
      - 'tests/test_dispatch_hb_epoch_gate.py'
      - '.stegverse/organization-ledger-ingest/**'
      - 'resident-runtime/organization_ledger_ingest.py'
      - 'resident-runtime/sv_check_receipt_append.py'
      - 'resident-runtime/sv_push_receipt.py'
      - 'resident-runtime/sv_push_receipt_append.py'
      - 'resident-runtime/sv_change_admit_append.py'
      - 'tests/test_organization_ledger_ingest.py'
      - 'tests/test_sv_check_receipt_append.py'
      - 'tests/test_sv_push_receipt_append.py'
      - 'tests/test_sv_change_admit_append.py'
      - 'tests/vendor/p1_c9192134/**'
      - 'org-runtime/interlock-intr.json'
      - '.stegverse/transition-ledger/contract.json'
      - '.stegverse/transition-ledger/org-contract.json'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_batch_custody.py'
      - 'resident-runtime/merge_transfer_gitstore.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_organization_ledger_transition_writer.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the writer against temporary ledgers
        run: |
          python -m py_compile \
            resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py \
            resident-runtime/ledger_store.py \
            resident-runtime/organization_ledger_ingest.py \
            resident-runtime/sv_check_receipt_append.py \
            resident-runtime/sv_push_receipt.py \
            resident-runtime/sv_push_receipt_append.py \
            resident-runtime/sv_change_admit_append.py \
            scripts/check_dispatch_hb_epoch.py \
            .stegverse/transition-ledger/emit.py
          python -m pip install pytest
          python -m pytest -q --tb=short \
            tests/test_organization_ledger_transition_writer.py \
            tests/test_intr_destination_capability.py \
            tests/test_organization_ledger_ingest.py \
            tests/test_sv_check_receipt_append.py \
            tests/test_sv_push_receipt_append.py \
            tests/test_sv_change_admit_append.py \
            tests/test_dispatch_hb_epoch_gate.py

      - name: The committed ingest request, if any, is what the push-to-main writer reads
        run: |
          set -euo pipefail
          # Read-only: shape, and for a sealed receipt its admission (seal, accepted
          # kind, ALLOW, zero skipped, this ledger as target). The append itself runs
          # only in the push-to-main writer.
          request=.stegverse/organization-ledger-ingest/request.json
          if [ -e "$request" ]; then
            python resident-runtime/organization_ledger_ingest.py read --request "$request"
            if python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("operation")=="sealed_test_receipt" else 1)' "$request"; then
              python resident-runtime/organization_ledger_ingest.py admit-sealed --request "$request" --ledger-repository "$GITHUB_REPOSITORY"
            fi
          else
            echo "no committed ingest request at this head; the writer has nothing to record"
          fi
