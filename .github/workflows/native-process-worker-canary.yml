# Historical canary validation only. The canary lifecycle is already COMPLETE;
# GitHub Actions may verify retained evidence but may not advance or persist heartbeat state.
# Main-branch registry/evidence persistence is excluded from automatic hosted CI;
# implementation changes still validate automatically and PRs retain broad coverage.
name: Native Process Worker Canary - Validation Only / No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'workers/heartbeat_receipt_canary.py'
      - 'heartbeat_runtime/process_adapter.py'
      - '.github/workflows/native-process-worker-canary.yml'
  pull_request:
    paths:
      - 'workers/heartbeat_receipt_canary.py'
      - 'handoffs/SHWP-NATIVE-PROCESS-CANARY-001.json'
      - 'cost-basis/worker-runtime/native-process-canary.json'
      - 'control/process-worker-adapters.json'
      - 'control/worker-registry.json'
      - 'heartbeat_runtime/process_adapter.py'
      - '.github/workflows/native-process-worker-canary.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate retained canary completion evidence
        run: |
          set -euo pipefail
          python3 -m py_compile workers/heartbeat_receipt_canary.py heartbeat_runtime/process_adapter.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('control/worker-registry.json').read_text())
          task=next(x for x in registry['tasks'] if x['task_id']=='SHWP-NATIVE-PROCESS-CANARY-001')
          receipt=json.loads(Path('receipts/native-worker-canary/SHWP-NATIVE-PROCESS-CANARY-001.json').read_text())
          assert task['state']=='COMPLETED'
          assert task['archive_eligible'] is True
          assert task['claim_id'] is None and task['worker_id'] is None
          assert receipt['completed'] is True
          assert receipt['transition_id']=='CANARY_COMPLETE'
          assert isinstance(receipt['fencing_token'],int) and receipt['fencing_token']>0
          print('RETAINED_NATIVE_CANARY_PASS')
          PY

      - name: Prove no hosted activation or persistence authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/native-process-worker-canary.yml').read_text(encoding='utf-8').splitlines()
          stripped=[line.strip() for line in lines]
          assert 'permissions: {}' in stripped
          assert 'contents: write' not in stripped
          assert not any(line.startswith('uses: actions/checkout@') for line in stripped)
          assert not any(line.startswith('uses: actions/setup-python@') for line in stripped)
          assert not any(line.startswith('git push ') for line in stripped)
          assert not any('scripts/run_heartbeat_runtime.py --cycles ' in line and '--dry-run' not in line for line in stripped)
          print('NATIVE_CANARY_NON_AUTHORIZING_PASS')
          PY
