name: Validate Organization Transition Ledger (Non-Authorizing)

on:
  pull_request:
    paths:
      - "resident-runtime/aggregate_repo_transition.py"
      - "resident-runtime/ledger_store.py"
      - "resident-runtime/organization_batch_custody.py"
      - "resident-runtime/organization_custody_readback.py"
      - "scripts/consume_organization_custody_readback_request.py"
      - "tests/test_organization_custody_readback.py"
      - "scripts/dispatch_resident_execution_requests.py"
      - "tests/test_organization_transition_ledger.py"
      - "tests/test_organization_batch_custody.py"
      - "tests/test_organization_ledger_custody_portability.py"
      - "tests/test_organization_git_ledger_store.py"
      - "tests/test_organization_ledger_custody_transfer.py"
      - "tests/test_org_batch_exact_source_replay.py"
      - "tests/test_component011_org_dispatch_custody.py"
      - "scripts/validate_transition_receipt_journey.py"
      - "tests/test_transition_receipt_journey.py"
      - "docs/KV_AI_END_TO_END_RUNTIME_EVIDENCE_MIRROR_HANDOFF.md"
      - ".stegverse/transition-ledger/org-contract.json"
      - ".github/workflows/validate-organization-transition-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organization-ledger-source-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate organization receipt source and negative replay controls
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_organization_transition_ledger.py tests/test_organization_batch_custody.py tests/test_organization_ledger_custody_portability.py tests/test_organization_git_ledger_store.py tests/test_organization_ledger_custody_transfer.py tests/test_org_batch_exact_source_replay.py tests/test_component011_org_dispatch_custody.py tests/test_organization_custody_readback.py tests/test_transition_receipt_journey.py
