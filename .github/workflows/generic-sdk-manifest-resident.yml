name: Generic SDK Manifest Resident Execution
on:
  push:
    branches: ["task/generic-sdk-manifest-execution-consumer"]
  pull_request:
    paths:
      - "scripts/consume_sdk_generic_manifest_execution_request.py"
      - "scripts/dispatch_resident_execution_requests.py"
      - "scripts/refresh_sovereign_worker_runtime_source.py"
      - "control/resident-execution-request.d/sdk-generic-manifest-execution.json"
      - "tests/test_sdk_generic_manifest_execution_resident.py"
      - ".github/workflows/generic-sdk-manifest-resident.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile scripts/consume_sdk_generic_manifest_execution_request.py scripts/dispatch_resident_execution_requests.py scripts/refresh_sovereign_worker_runtime_source.py
      - run: python -m pip install -q pytest
      - run: pytest -q tests/test_sdk_generic_manifest_execution_resident.py
