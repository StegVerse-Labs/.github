name: Validate Purpose-Bound Worker Derived Lifetime

on:
  pull_request:
    paths:
      - 'handoffs/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json'
      - 'tests/test_sdk_tt_purpose_bound_worker_runtime_path.py'
      - 'tests/test_generic_manifest_worker_profile_binding.py'
      - 'tests/test_manifest_state_transition_intr_ingress.py'
      - 'tests/test_sdk_manifest_diagnostic_admitted_consumer.py'
      - 'tests/test_mir_sv_exp3_cross_owner_wire_binding.py'
      - 'workers/sdk_manifest_diagnostic_admitted_consumer.py'
      - 'workers/manifest_state_transition_intr_ingress.py'
      - 'workers/universal_intr_profiled_ingress.py'
      - 'data/canonical-task-records/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json'
      - 'data/canonical-task-registry.json'
      - 'tests/test_sdk_tt_richard_atomic_activation_seam.py'
      - 'tests/test_sdk_tt_richard_seam_resident_carriage.py'
      - 'tests/test_sdk_tt_richard_seam_resident_materialization.py'
      - 'tests/test_sdk_tt_richard_seam_control_plane_package.py'
      - 'scripts/build_control_plane_source_package_reusable.py'
      - 'tests/test_reusable_control_plane_source_package.py'
      - 'heartbeat_runtime/worker_runtime_legacy.py'
      - 'heartbeat_runtime/process_adapter.py'
      - 'workers/stegagents_governed_runtime_worker.py'
      - 'handoffs/SDK-TT-RICHARD-SEAM-AUTHENTIC-RUNTIME-001.json'
      - 'control/worker-registry.d/sdk-tt-richard-seam-authentic-runtime-001.json'
      - 'control/resident-execution-request.d/sdk-tt-richard-seam-authentic-runtime-001.json'
      - 'scripts/consume_sdk_tt_richard_seam_authentic_runtime_request.py'
      - 'scripts/consume_stegagents_governed_runtime_targeted_request.py'
      - 'tests/test_stegagents_governed_runtime_targeted_resident_bridge.py'
      - 'docs/SDK_TT_PURPOSE_BOUND_WORKER_RUNTIME_PROOF_MIRROR_HANDOFF.md'
      - '.github/workflows/validate-purpose-bound-worker-derived-lifetime.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - name: Validate exact runtime-path contract
        run: python -m pytest -q tests/test_sdk_tt_purpose_bound_worker_runtime_path.py tests/test_generic_manifest_worker_profile_binding.py
      - name: Validate generic SDK manifest state-transition InTr profile
        run: python -m unittest -v tests.test_manifest_state_transition_intr_ingress tests.test_sdk_manifest_diagnostic_admitted_consumer
      - name: Validate exact frozen Experiment 3 wire against merged SDK owner
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          SDK_SHA=f8140f2aa2a3209b8be47d91b5659b1b4ae21335
          curl -fsSL "https://github.com/StegVerse-org/StegVerse-SDK/archive/${SDK_SHA}.tar.gz" -o /tmp/exp3-sdk.tgz
          mkdir /tmp/exp3-sdk
          tar -xzf /tmp/exp3-sdk.tgz -C /tmp/exp3-sdk --strip-components=1
          python -m pip install --quiet /tmp/exp3-sdk
          STEGVERSE_SDK_SOURCE_ROOT=/tmp/exp3-sdk python -m unittest -v tests.test_mir_sv_exp3_cross_owner_wire_binding
      - name: Validate Test 3 Richard seam focused suite
        run: |
          python -m pytest -q \
            tests/test_sdk_tt_richard_atomic_activation_seam.py \
            tests/test_sdk_tt_richard_seam_resident_carriage.py \
            tests/test_sdk_tt_richard_seam_resident_materialization.py \
            tests/test_sdk_tt_richard_seam_control_plane_package.py
      - name: Validate targeted Master Records custody carriage
        run: python -m pytest -q tests/test_stegagents_governed_runtime_targeted_resident_bridge.py
      - name: Validate reusable control-plane package relay continuation
        run: python -m pytest -q tests/test_reusable_control_plane_source_package.py
      - name: Validate derived lifetime invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('handoffs/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json').read_text())
          c=h['purpose_bound_worker_request']['transition_cell']['candidate']
          p=c['lifetime_policy']
          assert p['mode']=='DERIVED_COST_TASK_DELAY_BUDGET'
          assert p['production_recompute_required'] is True
          assert h['execution']['lifetime_semantics']['demo_value_is_production_default'] is False
          assert sum(p['time_budget_seconds'].values())==p['derived_max_lifetime_seconds']==c['max_lifetime_seconds']==30
          assert p['decomposition_target']=='RECORDS_ENABLED_PACKET'
          assert h['execution']['lifetime_semantics']['extension_requires_new_governed_recalculation'] is True
          reg=json.loads(Path('data/canonical-task-registry.json').read_text())
          assert reg['generation']>=56  # feature registration floor; canonical generation is monotonic
          task=next(x for x in reg['tasks'] if x['task_id']=='SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001')
          assert task['lifetime_model']['demonstration']['production_default'] is False
          assert task['lifetime_model']['production']['recompute_per_task'] is True
          print('DERIVED_LIFETIME_CONTRACT_PASS')
          PY