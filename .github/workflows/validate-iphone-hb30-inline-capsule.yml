name: Validate iPhone HB30 Inline Capsule

on:
  pull_request:
    paths:
      - 'capsules/iphone-hb30-inline-capsule.js'
      - 'scripts/check_iphone_hb30_inline_capsule.py'
      - 'tests/test_iphone_hb30_inline_capsule.py'
      - 'management/SHWP_IPHONE_TRANSITION_CAPSULE_CONTRACT.json'
      - 'handoffs/SHWP-IPHONE-HB30-INLINE-CAPSULE-002.json'
      - 'control/session-integration-claim-2026-08-17-iphone-hb30-inline-capsule.json'
      - '.github/workflows/validate-iphone-hb30-inline-capsule.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse credential-bearing environment
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_TOKEN GH_TOKEN GITHUB_PAT TVC_TOKEN STEGVERSE_PROVIDER_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "forbidden credential environment variable present: ${name}" >&2
              exit 1
            fi
          done
          echo 'IPHONE_HB30_INLINE_CREDENTIAL_AUTHORITY=TV_TVC'
          echo 'IPHONE_HB30_INLINE_GITHUB_TOKEN_AUTHORITY=NONE'
      - name: Fetch exact public source anonymously
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SOURCE_REF="refs/pull/${PR_NUMBER}/merge"
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=10 origin "${SOURCE_REF}"
          git checkout --detach FETCH_HEAD
          test -z "$(git config --local --get-regexp 'extraheader|credential' || true)"
      - name: Validate capsule contract
        run: python3 scripts/check_iphone_hb30_inline_capsule.py
      - name: Run deterministic tests
        run: python3 -m pytest -q tests/test_iphone_hb30_inline_capsule.py
      - name: Confirm validation-only boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/validate-iphone-hb30-inline-capsule.yml').read_text()
          assert 'permissions: {}' in text
          assert 'git push' not in text
          assert 'actions/checkout@' not in text
          assert 'upload-artifact' not in text
          print('IPHONE_HB30_INLINE_VALIDATION_ONLY=PASS')
          print('IPHONE_HB30_INLINE_RUNTIME_AUTHORITY=NONE')
          PY
