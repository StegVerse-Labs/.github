# Validation-only surface for the sovereign runtime worker. A GitHub-hosted runner
# is explicitly ineligible to activate the production sovereign carrier.
name: Sovereign Runtime Worker - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'scripts/advance_heartbeat_transition.py'
      - 'scripts/bootstrap_sovereign_runtime.py'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'tests/test_g18_self_bootstrap_worker.py'
      - 'tests/test_hb29_state_transition_carrier_contract.py'
      - 'tests/test_sovereign_runtime_handoff_v12_contract.py'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'authorizations/SHWP-DURABLE-RUNTIME-ACTIVATION-policy-rebind-v0.4.json'
      - 'cost-basis/worker-runtime/sovereign-runtime-activation.json'
      - 'control/process-worker-adapters.json'
      - 'control/worker-capability-profiles.json'
      - 'control/active-worker-state-policy.json'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'tools/validate_active_worker_states.py'
      - '.github/workflows/activate-sovereign-runtime-worker.yml'
  pull_request:
    paths:
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'scripts/advance_heartbeat_transition.py'
      - 'scripts/bootstrap_sovereign_runtime.py'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'tests/test_g18_self_bootstrap_worker.py'
      - 'tests/test_hb29_state_transition_carrier_contract.py'
      - 'tests/test_sovereign_runtime_handoff_v12_contract.py'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'authorizations/SHWP-DURABLE-RUNTIME-ACTIVATION-policy-rebind-v0.4.json'
      - 'cost-basis/worker-runtime/sovereign-runtime-activation.json'
      - 'control/process-worker-adapters.json'
      - 'control/worker-capability-profiles.json'
      - 'control/active-worker-state-policy.json'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'tools/validate_active_worker_states.py'
      - '.github/workflows/activate-sovereign-runtime-worker.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate sovereign state-transition worker and v12 handoff surfaces
        run: |
          set -euo pipefail
          python3 -m py_compile workers/sovereign_runtime_activation_worker.py scripts/advance_heartbeat_transition.py scripts/bootstrap_sovereign_runtime.py heartbeat_runtime/*.py scripts/verify_sovereign_runtime_activation.py tools/validate_active_worker_states.py tests/test_sovereign_runtime_handoff_v12_contract.py tests/test_hb29_state_transition_carrier_contract.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json').read_text())
          rb=json.loads(Path('authorizations/SHWP-DURABLE-RUNTIME-ACTIVATION-policy-rebind-v0.4.json').read_text())
          p=json.loads(Path('control/active-worker-state-policy.json').read_text())
          c=json.loads(Path('management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json').read_text())
          assert h['activation']['carrier']=='heartbeat'
          assert h['activation']['checkout_policy']=='fenced_atomic_checkout'
          assert h['task']['operational_state']=='ACTIVE_WORKER'
          assert h['task']['claim_state']=='MACHINE_OWNED_BOUND_G18'
          assert h['task']['fencing_token']==18
          assert h['constraint']['operational_state']=='ACTIVE_SOLUTION_EXECUTION'
          assert h['constraint']['third_party_dependency'] is False
          assert h['constraint']['next_solution_action']=='EXECUTE_BOUNDED_V12_STATE_TRANSITION_THEN_OBSERVE_WORKER_CHECKPOINT'
          assert h['execution']['canonical_carrier_runtime']=='heartbeat_runtime.engine_v12.HeartbeatRuntime'
          assert h['execution']['worker_runtime']=='heartbeat_runtime.worker_runtime.WorkerCoordinator'
          assert h['execution']['legacy_state_epoch']==29
          assert h['execution']['legacy_state_mutable_after_cutover'] is False
          assert h['execution']['carrier_state_ref']=='control/heartbeat-carrier-runtime-state.json'
          assert h['execution']['state_transition_producer']=='scripts/advance_heartbeat_transition.py'
          assert h['state_transition_continuity']['always_on_external_host_required'] is False
          assert h['state_transition_continuity']['wall_clock_continuous_process_required'] is False
          assert h['state_transition_continuity']['another_physical_machine_required'] is False
          assert c['first_successor_epoch']==30 and c['legacy_epoch']==29
          assert c['sole_permitted_user_physical_carrier']=='CURRENT_USER_IPHONE'
          assert c['credential_boundary']['credential_authority']=='TV/TVC'
          assert c['credential_boundary']['github_token_runtime_authority']=='NONE'
          assert h['authority']['credential_authority']=='TV/TVC'
          assert h['authority']['github_token_production_authority']=='NONE'
          assert h['authority']['non_tv_tvc_secret_or_token_allowed'] is False
          assert p['github_token_production_authority']=='NONE'
          assert rb['status']=='ADMITTED'
          assert rb['heartbeat_grants_rebind'] is False
          assert rb['task_id']==h['task']['task_id']
          assert rb['claim_id']=='SHWP-SHWP-DURABLE-RUNTIME-ACTIVATION-G18'
          assert rb['fencing_token']==h['task']['fencing_token']
          assert rb['new_policy_version']==h['authority']['policy_version']
          assert rb['authority_source']==h['authority']['authority_source']
          assert rb['credential_authority']=='TV/TVC'
          assert rb['github_token_production_authority']=='NONE'
          print('SOVEREIGN_RUNTIME_STATE_TRANSITION_HANDOFF_SURFACES_PASS')
          PY
          python3 scripts/validate_executable_handoffs.py
          python3 -m unittest -v tests.test_g18_self_bootstrap_worker tests.test_hb29_state_transition_carrier_contract tests.test_sovereign_runtime_activation_escalation tests.test_sovereign_runtime_handoff_v12_contract

      - name: Prove hosted runner is not sovereign activation authority
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_sovereign_runtime_activation_verifier tests.test_active_worker_state_policy
          before="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          output="$(python3 scripts/run_heartbeat_runtime.py --dry-run --cycles 1)"
          after="$(sha256sum control/worker-registry.json control/heartbeat-state.json | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 - <<'PY' "$output"
          import json,sys
          row=json.loads(sys.argv[1])
          assert row['authority_effect']=='NONE_CARRIER_ONLY', row
          assert row['legacy_hb29_cutover']=='PREVIEW_ONLY', row
          assert row['claims_issued']==0 and row['workers_invoked']==0, row
          print('SOVEREIGN_RUNTIME_DRY_RUN_NONPERSISTENT_PASS')
          PY

      - name: Prove GitHub-hosted activation authority is retired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/activate-sovereign-runtime-worker.yml').read_text(encoding='utf-8').splitlines()
          stripped=[line.strip() for line in lines]
          assert 'permissions: {}' in stripped
          assert 'contents: write' not in stripped
          assert not any(line.startswith('uses: actions/checkout@') for line in stripped)
          assert not any(line.startswith('uses: actions/setup-python@') for line in stripped)
          assert not any(line.startswith('git push ') for line in stripped)
          assert not any('scripts/run_heartbeat_runtime.py --cycles ' in line and '--dry-run' not in line for line in stripped)
          assert not any(line.strip().startswith('python3 scripts/advance_heartbeat_transition.py') for line in lines)
          assert not any(line.strip().startswith('python scripts/advance_heartbeat_transition.py') for line in lines)
          print('SOVEREIGN_RUNTIME_HOSTED_AUTHORITY_RETIRED_PASS')
          PY
