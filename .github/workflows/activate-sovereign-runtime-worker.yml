# Validation-only surface for the sovereign runtime worker. A GitHub-hosted runner
# is explicitly ineligible to activate the production sovereign carrier.
# Main-branch machine state/handoff/authorization persistence is excluded from
# automatic hosted CI; implementation/contracts/tests still validate automatically.
name: Sovereign Runtime Worker - Validation Only / No GitHub Token Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'workers/sovereign_runtime_activation_entrypoint.py'
      - 'scripts/advance_heartbeat_transition.py'
      - 'scripts/bootstrap_sovereign_runtime.py'
      - 'scripts/refresh_heartbeat_transition_receipt.py'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
      - 'tests/test_g18_self_bootstrap_worker.py'
      - 'tests/test_g18_task_capable_release_guard.py'
      - 'tests/test_hb29_state_transition_carrier_contract.py'
      - 'tests/test_sovereign_runtime_handoff_v12_contract.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'tools/validate_active_worker_states.py'
      - 'control/process-worker-adapters.json'
      - '.github/workflows/activate-sovereign-runtime-worker.yml'
  pull_request:
    paths:
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'workers/sovereign_runtime_activation_entrypoint.py'
      - 'scripts/advance_heartbeat_transition.py'
      - 'scripts/bootstrap_sovereign_runtime.py'
      - 'scripts/refresh_heartbeat_transition_receipt.py'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'tests/test_g18_self_bootstrap_worker.py'
      - 'tests/test_g18_task_capable_release_guard.py'
      - 'tests/test_hb29_state_transition_carrier_contract.py'
      - 'tests/test_sovereign_runtime_handoff_v12_contract.py'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'authorizations/SHWP-DURABLE-RUNTIME-ACTIVATION-policy-rebind-v0.4.json'
      - 'cost-basis/worker-runtime/sovereign-runtime-activation.json'
      - 'control/process-worker-adapters.json'
      - 'control/worker-capability-profiles.json'
      - 'control/active-worker-state-policy.json'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'tools/validate_active_worker_states.py'
      - '.github/workflows/activate-sovereign-runtime-worker.yml'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate sovereign state-transition worker and v12 handoff surfaces
        run: |
          set -euo pipefail
          python3 -m py_compile workers/sovereign_runtime_activation_worker.py workers/sovereign_runtime_activation_entrypoint.py scripts/advance_heartbeat_transition.py scripts/bootstrap_sovereign_runtime.py scripts/refresh_heartbeat_transition_receipt.py scripts/verify_sovereign_runtime_activation.py tools/validate_active_worker_states.py
          python3 -m unittest -v tests.test_g18_self_bootstrap_worker tests.test_g18_task_capable_release_guard tests.test_hb29_state_transition_carrier_contract tests.test_sovereign_runtime_handoff_v12_contract

      - name: Prove validation lane is non-authorizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/activate-sovereign-runtime-worker.yml').read_text(encoding='utf-8')
          forbidden=['contents'+': write','git'+' push','actions/'+'checkout@','actions/'+'setup-python@','$'+'{{ '+'secrets.']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('SOVEREIGN_RUNTIME_VALIDATION_NON_AUTHORIZING_PASS')
          PY
