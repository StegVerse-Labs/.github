# DRAFT, candidate 10. Not published; nothing is pushed or dispatched by this lane.
# The parameterized form of StegVerse-org/.github@10d14104:.github/workflows/organization-ledger-transition.yml
# (blob 5a9df86b). It follows the reusable-workflow pattern of StegVerse-Labs/.github
# repository-hygiene-reusable.yml (blob 9d4cc99d), with one change: the component is fetched at a
# pinned 40-hex commit and digest-checked, never cloned at HEAD.
# Ownership: the ledger steps belong to P1 component reuse (#163). The receive and self-closure steps
# call InTr & Mesh-owned interfaces (#162) at their own pinned ref, intr_interface_repository StegVerse-org/.github
# at the head of InTr's D6/D7 ingress draft PR (C7 six-field pass-through, --hb-epoch), not 10d14104.
# This workflow does not implement them.
# Runtime counts only as the ledger receipt read back from a fresh fetch. This run's success proves nothing.
name: Organization ledger transition (reusable)

on:
  workflow_call:
    inputs:
      organization:            {type: string, required: true,  description: "H29 #1, exact org login; must equal the parameter file"}
      component_ref:           {type: string, required: true,  description: "40-hex commit of the component home (owner decision D1)"}
      component_repository:    {type: string, required: false, default: "StegVerse-Labs/.github"}
      intr_interface_repository: {type: string, required: false, default: "StegVerse-org/.github", description: "InTr & Mesh-owned ingress/self-closure interface (agreed home)"}
      intr_interface_ref:      {type: string, required: false, default: "0f9481af324fc0cf8e46c2446ad69de07f9a8a9d", description: "40-hex InTr & Mesh interface commit: StegVerse-org/.github main merge commit of #185 (head 78ae1f8e, same tree; C7/C8 signatures on #163 issuecomment-6235428412); flat --ledger-component accepted"}
      sdk_ref:                 {type: string, required: false, default: "74d9b473aa415b06a9d550c28b2779a691b4ba32", description: "request mode only; existing pinned dependency"}
      mode:                    {type: string, required: false, default: "request", description: "request | self-closure"}
      request:                 {type: string, required: false, default: ""}
      mesh_root:               {type: string, required: false, default: ""}
      communication_id:        {type: string, required: false, default: "", description: "H29 #16"}
      hb_epoch:                {type: string, required: false, default: "", description: "H29 #15. Digits only, >= 32, supplied by the dispatcher from the carrier. On push (request mode), it is read from the committed request's hb_epoch instead. Absent in both places: FAIL_CLOSED. No clock fallback in any mode."}
      packet_id:               {type: string, required: false, default: "", description: "H29 #17; default intr-destination-self-closure:<communication_id>"}
      owning_existing_goal:    {type: string, required: true,  description: "H29 #19; carried on every six-field non-ALLOW"}

permissions:
  contents: write

concurrency:
  group: organization-ledger            # ORGANIZATION_LEDGER_LOCK; the FF push is the CAS
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      MODE: ${{ inputs.mode }}
      HB_EPOCH: ${{ inputs.hb_epoch }}
      GOAL: ${{ inputs.owning_existing_goal }}
      RETRY: ${{ github.workflow_ref }}
      COMPONENT: ${{ github.workspace }}/.ledger-component/org-kernel/organization-ledger
      INTR: ${{ github.workspace }}/.intr-interface
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Refuse unpinned refs and an unsupplied epoch (six fields, nothing appended)
        run: |
          fail() { python3 -c 'import json,os,sys; print(json.dumps({"disposition":"FAIL_CLOSED","failure_code":sys.argv[1],"failed_predicate":sys.argv[2],"required_evidence_or_repair":sys.argv[3],"retry_entrypoint":os.environ["RETRY"],"owning_existing_goal":os.environ["GOAL"],"next_attempt":sys.argv[4],"consequence_committed":False},sort_keys=True))' "$@"; exit 1; }
          for r in "${{ inputs.component_ref }}" "${{ inputs.intr_interface_ref }}"; do
            [[ "$r" =~ ^[0-9a-f]{40}$ ]] || fail COMPONENT_REF_NOT_PINNED REF_IS_A_40_HEX_COMMIT "pass the published commit SHA, not a branch or tag" "re-dispatch with the pinned SHA"
          done
          if [ -z "$HB_EPOCH" ] && [ "$MODE" = request ]; then
            # push-triggered request mode: the committed request carries the epoch (schema hb_epoch)
            HB_EPOCH=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "$GITHUB_SHA" -- '.stegverse/transition-requests/*.json' | head -1 | xargs -r python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("hb_epoch",""))')
            echo "HB_EPOCH=$HB_EPOCH" >> "$GITHUB_ENV"
          fi
          # Shared epoch rule (agreed with InTr; same as TVC validate_warrant): supplied, digits, >= 32; no clock.
          [ -n "$HB_EPOCH" ] || fail HB_EPOCH_NOT_SUPPLIED SUBMISSION_CARRIES_THE_SUPPLIED_HB_EPOCH "supply hb_epoch (an integer >= 32) from the carrier, in the committed request or the dispatch; no clock is read" "re-dispatch the same transition with hb_epoch supplied; nothing was appended"
          case "$HB_EPOCH" in *[!0123456789]*) fail HB_EPOCH_INVALID SUBMISSION_CARRIES_THE_SUPPLIED_HB_EPOCH "supply hb_epoch as digits only, >= 32; no clock is read" "re-dispatch with a valid hb_epoch; nothing was appended";; esac
          [ "$HB_EPOCH" -ge 32 ] || fail HB_EPOCH_INVALID SUBMISSION_CARRIES_THE_SUPPLIED_HB_EPOCH "hb_epoch precedes the HB32 anchor; no clock is read" "re-dispatch with hb_epoch >= 32; nothing was appended"
          # The parameter file is at a fixed path (the Python modules read the same path).
          # owning_existing_goal is read by the Python modules from the committed parameter file;
          # the dispatch input must equal it, so the two sources cannot disagree.
          pf=.stegverse/transition-ledger/organization-ledger.parameters.json
          [ -f "$pf" ] || fail PARAMETERS_FILE_MISSING CONSUMER_COMMITS_ITS_PARAMETER_FILE "commit $pf (stegverse.organization-ledger-parameters/v1)" "commit the parameter file and re-dispatch"
          pg=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("owning_existing_goal",""))' "$pf")
          [ "$pg" = "$GOAL" ] || fail OWNING_GOAL_PARAMETER_MISMATCH DISPATCHED_GOAL_EQUALS_COMMITTED_PARAMETER "owning_existing_goal input must equal $pf" "re-dispatch with the committed owning_existing_goal"

      - name: Checkout ledger component at pinned commit (no caller credentials)
        uses: actions/checkout@v4
        with: {repository: "${{ inputs.component_repository }}", ref: "${{ inputs.component_ref }}", path: .ledger-component, persist-credentials: false}

      - name: Checkout InTr & Mesh interface at pinned commit (consumed, not built here)
        uses: actions/checkout@v4
        with: {repository: "${{ inputs.intr_interface_repository }}", ref: "${{ inputs.intr_interface_ref }}", path: .intr-interface, persist-credentials: false}

      - name: Verify component digests and regenerate contracts from parameters
        run: |
          set -euo pipefail
          # component-manifest.json lists {path: git blob sha} for every module; a local edit is refused.
          python3 "$COMPONENT/verify_component_manifest.py" --root "$COMPONENT" --manifest "$COMPONENT/component-manifest.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["organization"]==sys.argv[2], "PARAMETER_ORGANIZATION_MISMATCH"' .stegverse/transition-ledger/organization-ledger.parameters.json "${{ inputs.organization }}"
          # Contracts are generated, never hand-edited: committed files must be byte-identical.
          python3 "$COMPONENT/generate_ledger_contracts.py" .stegverse/transition-ledger/organization-ledger.parameters.json --out-dir .stegverse/transition-ledger --check

      - name: Bind the designated ledger ref and the repository subtree
        run: |
          set -euo pipefail
          ns=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger" and l["new_ledger_root"] is False; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$ns" >> "$GITHUB_ENV"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          else
            echo "ledger ref not materialized; the first manifest-directed append opens it at GENESIS (genesis_mode from the parameter file)"
          fi

      - name: Checkout the pinned SDK (request mode; existing dependency, not a new one)
        if: inputs.mode != 'self-closure'
        uses: actions/checkout@v4
        with: {repository: StegVerse-org/StegVerse-SDK, ref: "${{ inputs.sdk_ref }}", path: sdk, persist-credentials: false}

      - name: Install SDK (request mode)
        if: inputs.mode != 'self-closure'
        run: python -m pip install --no-deps -e ./sdk

      - name: Validate committed requests against stegverse.organization-transition-request/v1
        if: inputs.mode != 'self-closure'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for path in Path(".stegverse/transition-requests").glob("*.json"):
              r = json.loads(path.read_text())
              assert r.get("schema") == "stegverse.organization-transition-request/v1", path
              assert r.get("request_id") == path.stem, path
              assert r.get("owning_existing_goal") and isinstance(r.get("standing"), dict), path
              assert {"mode", "node_ref", "predecessor"} <= set(r["standing"]), path
              assert ("build_manifest" in r) != ("manifest" in r), path
              assert "manifest" not in r or "expected_canonical_manifest_sha256" in r, path
          PY

      - name: Select committed transition requests
        if: inputs.mode != 'self-closure'
        env:
          INPUT_REQUEST: ${{ inputs.request }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_REQUEST" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"DISPATCH_REQUEST_REQUIRED","failed_predicate":"MODE_REQUEST_NAMES_A_COMMITTED_TRANSITION_REQUEST","required_evidence_or_repair":"dispatch with request=.stegverse/transition-requests/<id>.json","retry_entrypoint":"'"$RETRY"'","owning_existing_goal":"'"$GOAL"'","next_attempt":"re-dispatch naming the request"}' >&2
            exit 1
          fi
          if [ -n "$INPUT_REQUEST" ]; then
            # A dispatch may select only an existing, committed transition
            # request from the checked-out revision, never an arbitrary path.
            case "$INPUT_REQUEST" in
              .stegverse/transition-requests/*.json) ;;
              *) echo "FAIL_CLOSED: DISPATCH_REQUEST_OUTSIDE_COMMITTED_TRANSITION_REQUESTS" >&2; exit 1 ;;
            esac
            case "$INPUT_REQUEST" in
              *../*|*/../*|*' '*) echo "FAIL_CLOSED: DISPATCH_REQUEST_PATH_INVALID" >&2; exit 1 ;;
            esac
            # Reject control characters, including newline and carriage return,
            # without interpolating the input into shell source.
            if ! INPUT_REQUEST="$INPUT_REQUEST" python -c 'import os,sys; p=os.environ["INPUT_REQUEST"]; sys.exit(0 if all(32 <= ord(c) <= 126 for c in p) else 1)'; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_CONTROL_CHARACTER" >&2
              exit 1
            fi
            if ! git ls-files --error-unmatch -- "$INPUT_REQUEST" >/dev/null 2>&1 || [ ! -f "$INPUT_REQUEST" ]; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_NOT_COMMITTED" >&2
              exit 1
            fi
            printf '%s\n' "$INPUT_REQUEST" > "$RUNNER_TEMP/requests.txt"
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '.stegverse/transition-requests/*.json' > "$RUNNER_TEMP/requests.txt"
          fi
          cat "$RUNNER_TEMP/requests.txt"

      - name: Receive each request and append to the repository and organization ledgers
        if: inputs.mode != 'self-closure'
        env:
          INPUT_MESH_ROOT: ${{ inputs.mesh_root }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          # Same ref, own subtree: the repository chain is published by the same
          # fast-forward push below and survives this run (contract.json
          # repository_ledger_location; StegVerse-org/.github#118).
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          # A durable mesh locator is supplied, never inferred from environment,
          # runner home, or sovereign ledger ref. Action is by manifest: the
          # committed request that directs this run declares it (mesh_root), and
          # a dispatch input, when given, is used unchanged
          # (resident-runtime/manifest_directed_run_inputs.py). A run whose
          # requests declare none has none: the node is then materialized
          # without a mesh, and a capability that must leave this organization
          # is refused at egress by the ingress itself
          # (mesh_location_required_from_materializer), with all six fields,
          # recorded on both ledgers and read back below. The ledger carries
          # that disposition; this run does not stand in for it.
          mesh_root="$INPUT_MESH_ROOT"
          if ! resolved=$(python "$INTR/resident-runtime/manifest_directed_run_inputs.py" transition-mesh \
              --dispatch-mesh-root "$mesh_root" --requests "$RUNNER_TEMP/requests.txt"); then
            echo "$resolved"; exit 1
          fi
          echo "$resolved"
          mesh_root=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["mesh_root"])' "$resolved")
          mesh_args=()
          if [ -n "$mesh_root" ]; then
            # The designated locator names a repository and a ref. This run can
            # publish a ref of its own repository only, so the binding resolves
            # the locator onto the checkout (or refuses with six fields; no
            # credential for another repository is inferred). The mesh ref is
            # fetched here and pushed fast-forward below, so a frame placed on it
            # outlives this run: the mesh is the durable queue.
            if ! binding=$(python "$INTR/resident-runtime/mesh_locator_binding.py" \
                --locator "$mesh_root" --repository "$GITHUB_REPOSITORY" --workspace "$GITHUB_WORKSPACE"); then
              echo "$binding"; exit 1
            fi
            echo "$binding"
            mesh_ref=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["publish_ref"])' "$binding")
            if git ls-remote --exit-code origin "$mesh_ref" >/dev/null; then
              git fetch --no-tags origin "+$mesh_ref:$mesh_ref"
              echo "mesh tip: $(git rev-parse "$mesh_ref")"
            else
              echo "mesh ref not yet materialized; the first frame opens it"
            fi
            echo "MESH_PUBLISH_REF=$mesh_ref" >> "$GITHUB_ENV"
            mesh_args=(--mesh-root "git+$GITHUB_WORKSPACE#$mesh_ref")
            echo "mesh supplied: $mesh_root -> ${mesh_args[1]}"
          else
            echo "no mesh declared by the committed requests or dispatched; an emission is refused at egress and the refusal is recorded (SVORG-MESH-LOCATION-BINDING-001)"
          fi
          # N3 (Lane B #162): count what this run received, so a run that received no request records that
          # (results/NO_REQUESTS.json) instead of leaving an empty results/ the last step cannot tell from a loss.
          mkdir -p "$RUNNER_TEMP/results"
          listed=0; received=0; deferred=()
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            listed=$((listed + 1))
            name=$(basename "$request" .json)
            # A request whose process the boundary binds to egress leaves this
            # organization, and a run without a supplied mesh can
            # only record its emission as refused. Recording it would also make
            # the manifest one already recorded, so a later dispatch with the
            # mesh would be answered from the ledger and never emit: the request
            # would be spent by the push that merged it. Without a mesh it is
            # deferred to the request or dispatch that supplies one; nothing is received,
            # recorded or spent here.
            if [ ${#mesh_args[@]} -eq 0 ] && python - "$request" <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location("inputs", os.environ["INTR"] + "/resident-runtime/manifest_directed_run_inputs.py")
          inputs = importlib.util.module_from_spec(spec); spec.loader.exec_module(inputs)
          request = json.load(open(sys.argv[1]))
          egress = json.load(open("org-runtime/interlock-intr.json")).get("egress") or {}
          bound = {b.get("profile_id") for b in egress.get("capability_destination_bindings") or [] if isinstance(b, dict)}
          sys.exit(0 if inputs.request_process(request) in bound else 1)
          PY
            then
              echo "deferred $name: its process leaves this organization; commit a successor request declaring mesh_root, or dispatch with request=$request and mesh_root, to receive it"
              deferred+=("$name")
              continue
            fi
            out="$RUNNER_TEMP/results/$name"
            mkdir -p "$out"
            received=$((received + 1))
            python - "$request" "$out" <<'PY'
          import importlib.util, json, os, sys
          from pathlib import Path
          from stegverse.manifest_builder import build_manifest
          from stegverse.manifest_contract import validate_ingress_manifest
          request = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("ingress", os.environ["INTR"] + "/resident-runtime/organization_manifest_ingress.py")
          ingress = importlib.util.module_from_spec(spec); spec.loader.exec_module(ingress)
          spec = importlib.util.spec_from_file_location("inputs", os.environ["INTR"] + "/resident-runtime/manifest_directed_run_inputs.py")
          inputs = importlib.util.module_from_spec(spec); spec.loader.exec_module(inputs)
          def canonical_of(manifest):
              validate_ingress_manifest(manifest)
              return ingress.derive_execution_request(manifest, ingress.boundary())["canonical_manifest_sha256"]
          resolved = inputs.committed_manifest(request, build=build_manifest, canonical_of=canonical_of)
          if resolved["disposition"] != "ALLOW":
              print(json.dumps(resolved, sort_keys=True))
              sys.exit(1)
          manifest, canonical = resolved["manifest"], resolved["canonical_manifest_sha256"]
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (out / "standing.json").write_text(json.dumps(request["standing"], indent=2, sort_keys=True) + "\n")
          (out / "canonical_manifest_sha256").write_text(canonical)
          print("built", request["request_id"], "canonical manifest", canonical)
          PY
            canonical=$(cat "$out/canonical_manifest_sha256")
            recorded=$(python "$COMPONENT/organization_ledger_readback.py" \
              --location "$STEGVERSE_ORG_LEDGER_ROOT" --repository-namespace "$REPO_LEDGER_NAMESPACE" \
              --recorded-for "$canonical")
            if [ -n "$recorded" ]; then
              echo "already recorded as $recorded; one manifest is one transition, nothing appended"
              python -c 'import json,sys; json.dump({"disposition":"ALREADY_RECORDED","organization_receipt_sha256":sys.argv[1],"canonical_manifest_sha256":sys.argv[2]}, open(sys.argv[3],"w"))' \
                "$recorded" "$canonical" "$out/ingress.json"
              continue
            fi
            # C7 as merged on org main (0f9481af; #163 issuecomment-6235428412). The verified component dir is the flat --ledger-component. --hb-epoch is always passed
            # (validated in the first step), so the direct-call no-epoch fallback (P1-FC-8) is never reached.
            python "$INTR/resident-runtime/organization_manifest_ingress.py" \
              --ledger-component "$COMPONENT" --consumer-root "$GITHUB_WORKSPACE" \
              --registry org-boundary/registry/services.json \
              --manifest "$out/manifest.json" --standing "$out/standing.json" \
              --packet-id "$name" --hb-epoch "$HB_EPOCH" ${mesh_args[@]+"${mesh_args[@]}"} --out "$out/ingress.json" || true
            python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("ingress disposition:", x["disposition"], x.get("failed_predicate"), x.get("organization_receipt_sha256"))' "$out/ingress.json"
            # Item (5), INDEX H51: right after the append, carry this repository's receipts onto the organization
            # chain with the component's propagate_repository_receipts.propagate() (digest-pinned), handed the
            # already-validated epoch as text through the shared validator. A refusal is six-field FAIL_CLOSED in
            # $out/propagation.json; it never rolls back or blocks the receipt just appended (publish and
            # readback still run), and the last step fails the run on it.
            home="$RUNNER_TEMP/repository-ledger-home"; rm -rf "$home"; mkdir -p "$home"
            if git cat-file -e "$LEDGER_REF:$REPO_LEDGER_NAMESPACE/HEAD.json" 2>/dev/null; then
              git archive "$LEDGER_REF" "$REPO_LEDGER_NAMESPACE" | tar -x -C "$home"
            fi
            # Not `|| true`: the exit status is recorded next to the record, and the last step requires 0 and ALLOW.
            rc=0
            python "$COMPONENT/propagate_after_append.py" --repository "$GITHUB_REPOSITORY" \
              --repository-ledger-root "$home/$REPO_LEDGER_NAMESPACE" --hb-epoch "$HB_EPOCH" --out "$out/propagation.json" || rc=$?
            echo "$rc" > "$out/propagation.exit"
          done < "$RUNNER_TEMP/requests.txt"
          if [ "$received" -eq 0 ]; then
            python3 -c 'import json,sys; json.dump({"schema":"stegverse.organization-ledger-no-requests/v1","requests_listed":int(sys.argv[2]),"received":0,"deferred":sys.argv[3:]}, open(sys.argv[1],"w"), sort_keys=True)' \
              "$RUNNER_TEMP/results/NO_REQUESTS.json" "$listed" ${deferred[@]+"${deferred[@]}"}
            echo "no request received ($listed listed, ${#deferred[@]} deferred); recorded results/NO_REQUESTS.json"
          fi

      # mode=self-closure: this organization's own intr-destination, at the
      # supplied epoch. No peer is named; the address is derived from this
      # organization's own name.
      - name: Close an intr-destination diagnostic against this organization
        if: inputs.mode == 'self-closure'
        env:
          INPUT_COMMUNICATION_ID: ${{ inputs.communication_id }}
          INPUT_PACKET_ID: ${{ inputs.packet_id }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          out="$RUNNER_TEMP/results/self-closure"
          mkdir -p "$out"
          communication_id="$INPUT_COMMUNICATION_ID"
          if [ -z "$communication_id" ]; then
            # Agreed new-org default (InTr c). The 7 existing closures keep their
            # legacy intr-selfclose-<Org>-20261017 ids; both forms are accepted on readback.
            communication_id="intr-selfclose-${{ inputs.organization }}-HB${HB_EPOCH}"
          fi
          INPUT_COMMUNICATION_ID="$communication_id"
          packet_id="$INPUT_PACKET_ID"
          if [ -z "$packet_id" ]; then
            # Agreed default (InTr c): redelivery with the same communication_id is idempotent.
            packet_id="intr-destination-self-closure:${INPUT_COMMUNICATION_ID}"
          fi
          # Time is supplied with the dispatch. It is not sampled from a clock.
          # (the first step already refused an absent epoch as HB_EPOCH_NOT_SUPPLIED; this is defence in depth)
          case "$HB_EPOCH" in
            ''|*[!0123456789]*)
              python3 -c 'import json,os; print(json.dumps({"disposition":"FAIL_CLOSED","failure_code":"HB_EPOCH_INVALID","failed_predicate":"SUBMISSION_CARRIES_THE_SUPPLIED_HB_EPOCH","required_evidence_or_repair":"supply hb_epoch as digits only, >= 32; no clock is read","retry_entrypoint":os.environ["RETRY"],"owning_existing_goal":os.environ["GOAL"],"next_attempt":"re-dispatch with a valid hb_epoch; nothing was appended","consequence_committed":False,"derived_from_clock":False},sort_keys=True))'
              exit 1 ;;
          esac
          # A refusal is recorded too; the publish step below carries it, and
          # the readback step fails the run on any closure that is not ALLOW.
          # C8 as merged on org main (0f9481af), flat --ledger-component: --self-close --communication-id --registry --packet-id --hb-epoch
          # --ledger-component --consumer-root. --hb-epoch is always passed (P1-FC-8 never reached).
          python "$INTR/resident-runtime/intr_destination_ingress.py" \
            --ledger-component "$COMPONENT" --consumer-root "$GITHUB_WORKSPACE" \
            --self-close \
            --hb-epoch "$HB_EPOCH" \
            --registry org-boundary/registry/services.json \
            --communication-id "$INPUT_COMMUNICATION_ID" \
            --packet-id "$packet_id" \
            --out "$out/closure.json" || true
          test -f "$out/closure.json"
          python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("closure disposition:", x["disposition"], x.get("communication_id"), x.get("organization_receipt_sha256"))' "$out/closure.json"
          # Item (5), INDEX H51: right after the append, carry this repository's receipts onto the organization
          # chain with the component's propagate_repository_receipts.propagate() (digest-pinned), handed the
          # already-validated epoch as text through the shared validator. A refusal is six-field FAIL_CLOSED in
          # $out/propagation.json; it never rolls back or blocks the receipt just appended (publish and
          # readback still run), and the last step fails the run on it.
          home="$RUNNER_TEMP/repository-ledger-home"; rm -rf "$home"; mkdir -p "$home"
          if git cat-file -e "$LEDGER_REF:$REPO_LEDGER_NAMESPACE/HEAD.json" 2>/dev/null; then
            git archive "$LEDGER_REF" "$REPO_LEDGER_NAMESPACE" | tar -x -C "$home"
          fi
          # Not `|| true`: the exit status is recorded next to the record, and the last step requires 0 and ALLOW.
          rc=0
          python "$COMPONENT/propagate_after_append.py" --repository "$GITHUB_REPOSITORY" \
            --repository-ledger-root "$home/$REPO_LEDGER_NAMESPACE" --hb-epoch "$HB_EPOCH" --out "$out/propagation.json" || rc=$?
          echo "$rc" > "$out/propagation.exit"

      # The frames a request left on the designated mesh are published before
      # the ledger that says they were emitted: a receipt never claims an
      # emission whose frame did not outlive this run.
      - name: Publish the designated mesh ref (fast-forward only)
        if: inputs.mode != 'self-closure'
        run: |
          if [ -z "${MESH_PUBLISH_REF:-}" ]; then
            echo "no mesh ref bound by this run; nothing to publish"; exit 0
          fi
          if ! git rev-parse --verify --quiet "$MESH_PUBLISH_REF" >/dev/null; then
            echo "no frame placed on $MESH_PUBLISH_REF; nothing to publish"; exit 0
          fi
          if ! git push origin "$MESH_PUBLISH_REF:$MESH_PUBLISH_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"MESH_REF_PUBLISH_RACE","failed_predicate":"PUBLISHED_MESH_REF_FAST_FORWARDS","required_evidence_or_repair":"another writer moved the mesh ref first; this run published no frame and no ledger receipt","retry_entrypoint":"'"$RETRY"'","owning_existing_goal":"'"$GOAL"'","next_attempt":"commit a successor transition request; it is received again and its frame placed on the moved ref"}'
            exit 1
          fi
          echo "mesh ref published: $MESH_PUBLISH_REF $(git rev-parse "$MESH_PUBLISH_REF")"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo "nothing appended; ledger ref not materialized"; exit 0
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":"'"$RETRY"'","owning_existing_goal":"'"$GOAL"'","next_attempt":"re-run; the request is answered from the ledger if already recorded"}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        if: inputs.mode != 'self-closure'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent sovereign ref fetch","retry_entrypoint":"'"$RETRY"'","owning_existing_goal":"'"$GOAL"'","next_attempt":"retry with authorized existing repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          status=0
          for out in "$RUNNER_TEMP"/results/*/; do
            [ -f "$out/ingress.json" ] || continue
            python "$COMPONENT/organization_ledger_readback.py" \
              --location "git+$fresh#$LEDGER_REF" --ingress-result "$out/ingress.json" \
              --manifest "$out/manifest.json" --repository-namespace "$REPO_LEDGER_NAMESPACE" \
              --out "$out/readback.json" || status=1
            {
              echo "### $(basename "$out")"
              echo '```json'
              cat "$out/readback.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Read the intr-destination self-closure back from a fresh fetch
        if: inputs.mode == 'self-closure'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results/self-closure"
          fresh="$RUNNER_TEMP/self-closure-readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent sovereign ref fetch","retry_entrypoint":"'"$RETRY"'","owning_existing_goal":"'"$GOAL"'","next_attempt":"retry with authorized existing repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python "$INTR/resident-runtime/intr_destination_ingress.py" \
            --ledger-component "$COMPONENT" --consumer-root "$GITHUB_WORKSPACE" \
            --verify-self-closure \
            --location "git+$fresh#$LEDGER_REF" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --org-contract "$GITHUB_WORKSPACE/.stegverse/transition-ledger/org-contract.json" \
            --closure "$out/closure.json" \
            --out "$out/readback.json"
          {
            echo "### intr-destination self-closure"
            echo '```json'
            cat "$out/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What the designated mesh holds after this run, read from a fresh fetch
      # the way a peer that materializes later would read it.
      - name: Read the designated mesh ref back from a fresh fetch
        if: inputs.mode != 'self-closure' && env.MESH_PUBLISH_REF != ''
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/mesh-readback.git"
          git init -q --bare "$fresh"
          if ! git --git-dir="$fresh" fetch -q "$(git remote get-url origin)" "+$MESH_PUBLISH_REF:$MESH_PUBLISH_REF" 2>/dev/null; then
            echo '{"mesh_ref":"'"$MESH_PUBLISH_REF"'","frames":[],"note":"the mesh ref is not published; no request of this run was emitted"}' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$fresh" "$MESH_PUBLISH_REF" "$RUNNER_TEMP/results" <<'PY' | tee "$RUNNER_TEMP/results/mesh-readback.json" >> "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("kernel", os.environ["COMPONENT"] + "/../kernel.py")
          kernel = importlib.util.module_from_spec(spec); spec.loader.exec_module(kernel)
          store = kernel.mesh_store("git+" + sys.argv[1] + "#" + sys.argv[2])
          frames = [store.get(key) for key in store.list_prefix(kernel.node_store_module.MESH_FRAME_PREFIX)]
          emitted = [json.loads(p.read_text()) for p in Path(sys.argv[3]).glob("*/ingress.json")]
          emitted = [x for x in emitted if x.get("emission_transition_class") == "ORGANIZATION_EGRESS_EMITTED"]
          out = {"schema": "stegverse.mesh-readback/v1", "mesh_ref": sys.argv[2], "frame_count": len(frames),
                 "frames": [{"destination_org": f.get("destination_org"), "frame_sha256": f.get("frame_sha256")} for f in frames],
                 "emitted_by_this_run": len(emitted), "authority_effect": "NONE_READBACK_ONLY"}
          print(json.dumps(out, indent=2, sort_keys=True))
          if emitted and not frames:
              raise SystemExit("an emission was recorded but the published mesh holds no frame")
          PY

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

      # Propagation refusals fail the run here, after the appended receipts were published and read back.
      - name: Fail on a recorded propagation refusal (six fields)
        if: always()
        run: |
          set -euo pipefail
          # Lane B #162 G1/G2: absence, a non-ALLOW disposition, an unreadable record or a nonzero exit all fail
          # closed in six fields (PROPAGATION_GATE_TREATS_ABSENCE_AS_PASS for absence); only ALLOW passes.
          if [ -f "$COMPONENT/propagation_gate.py" ]; then
            python3 "$COMPONENT/propagation_gate.py" "$RUNNER_TEMP/results"
          else
            python3 -c 'import json,os; print(json.dumps({"disposition":"FAIL_CLOSED","failure_code":"PROPAGATION_GATE_TREATS_ABSENCE_AS_PASS","failed_predicate":"EVERY_APPENDED_REQUEST_HAS_A_PROPAGATION_RECORD_AND_ONLY_A_RECOGNIZED_SUCCESS_PASSES","required_evidence_or_repair":"the pinned component has no propagation_gate.py, so no propagation outcome can be checked; absence is not a pass","retry_entrypoint":"organization-ledger-transition-reusable.yml step Fail on a recorded propagation refusal (six fields)","owning_existing_goal":"StegVerse-org/.github#163","next_attempt":"re-run with a component_ref that carries propagation_gate.py","consequence_committed":False},sort_keys=True))'
            exit 1
          fi
