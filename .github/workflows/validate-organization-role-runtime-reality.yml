name: Validate Organization Role Runtime Reality (Non-Authorizing)

on:
  push:
    branches: [main]
    paths:
      - "data/task-registry-global-invariants.json"
      - "data/organization-role-runtime-reality-deployment.json"
      - "data/organization-role-exemption-register.json"
      - "docs/ORGANIZATION_ROLE_RUNTIME_REALITY_DEPLOYMENT.md"
      - "docs/ORGANIZATION_TRANSITION_LEDGER_MIRROR_HANDOFF.md"
      - "scripts/validate_task_registry_global_invariants.py"
      - "workers/canonical_state_transition_custody.py"
      - ".stegverse/transition-ledger/org-contract.json"
      - "tests/test_organization_role_runtime_reality_deployment.py"
      - ".github/workflows/validate-organization-role-runtime-reality.yml"
  pull_request:
    paths:
      - "data/task-registry-global-invariants.json"
      - "data/organization-role-runtime-reality-deployment.json"
      - "data/organization-role-exemption-register.json"
      - "docs/ORGANIZATION_ROLE_RUNTIME_REALITY_DEPLOYMENT.md"
      - "docs/ORGANIZATION_TRANSITION_LEDGER_MIRROR_HANDOFF.md"
      - "scripts/validate_task_registry_global_invariants.py"
      - "workers/canonical_state_transition_custody.py"
      - ".stegverse/transition-ledger/org-contract.json"
      - "tests/test_organization_role_runtime_reality_deployment.py"
      - ".github/workflows/validate-organization-role-runtime-reality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organization-role-source-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate global invariant block and the deployment declaration
        run: python scripts/validate_task_registry_global_invariants.py
      - name: Organization Role source regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_organization_role_runtime_reality_deployment.py
      - name: Organization ledger regressions are unaffected
        run: python -m pytest -q tests/test_organization_transition_ledger.py tests/test_organization_batch_custody.py tests/test_transition_receipt_journey.py
