name: Sovereign Runtime Self-Bootstrap Validation

on:
  pull_request:
    paths:
      - "scripts/bootstrap_sovereign_runtime.py"
      - "tests/test_bootstrap_sovereign_runtime.py"
      - "control/session-implementation-claim-2026-08-14-sovereign-runtime-self-bootstrap.json"
      - "handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json"
      - ".github/workflows/sovereign-runtime-self-bootstrap.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bootstrap_sovereign_runtime.py"
      - "tests/test_bootstrap_sovereign_runtime.py"
      - "control/session-implementation-claim-2026-08-14-sovereign-runtime-self-bootstrap.json"
      - "handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json"
      - ".github/workflows/sovereign-runtime-self-bootstrap.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      STEGVERSE_GITHUB_TOKEN: ""
      TVC_TOKEN: ""
    steps:
      - name: Anonymous source acquisition without credential authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${STEGVERSE_GITHUB_TOKEN:-}"
          test -z "${TVC_TOKEN:-}"
          git -c credential.helper= -c http.extraHeader= init .
          git -c credential.helper= -c http.extraHeader= remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraHeader= fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Compile self-bootstrap
        run: python -m py_compile scripts/bootstrap_sovereign_runtime.py

      - name: Run deterministic self-bootstrap tests
        run: python -m unittest tests.test_bootstrap_sovereign_runtime -v

      - name: Prove hosted runner fails closed before activation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          set +e
          GITHUB_ACTIONS=true python scripts/bootstrap_sovereign_runtime.py \
            --source-root . \
            --runtime-root "$tmp/runtime" \
            --node-marker "$tmp/node.json" \
            --proof-path "$tmp/activation.latest.json" \
            --receipt-path "$tmp/bootstrap.latest.json" >"$tmp/output.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          python - "$tmp/bootstrap.latest.json" <<'PY'
          import json, sys
          p=sys.argv[1]
          data=json.load(open(p, encoding='utf-8'))
          assert data['state']=='FAIL_CLOSED', data
          assert data['reason']=='THIRD_PARTY_HOST_IS_NOT_SOVEREIGN_BOOTSTRAP_SURFACE', data
          assert data['installer_returncode'] is None, data
          assert data['verifier_returncode'] is None, data
          assert data['credential_authority']=='TV/TVC', data
          assert data['credential_requirement']=='NONE', data
          assert data['github_token_required'] is False, data
          PY

      - name: Prove validation is non-authorizing
        shell: bash
        run: |
          set -euo pipefail
          echo "credential_authority=TV/TVC"
          echo "credential_requirement=NONE"
          echo "github_token_runtime_authority=NONE"
          echo "workflow_authority_effect=NONE_VALIDATION_ONLY"
          echo "live_activation_claimed=false"
