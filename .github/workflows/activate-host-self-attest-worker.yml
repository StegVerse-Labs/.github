# Historical host self-attest validation only. The canonical heartbeat owns
# activation, fencing, transitions and persistence; GitHub Actions may only verify.
name: Host Self-Attest Worker - Validation Only / No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-host-self-attest-worker.yml'
      - 'handoffs/SHWP-HOST-SELF-ATTEST-001.json'
      - 'cost-basis/worker-runtime/host-self-attest.json'
      - 'receipts/host-self-attest/SHWP-HOST-SELF-ATTEST-001.json'
  pull_request:
    paths:
      - '.github/workflows/activate-host-self-attest-worker.yml'
      - 'handoffs/SHWP-HOST-SELF-ATTEST-001.json'
      - 'cost-basis/worker-runtime/host-self-attest.json'
      - 'receipts/host-self-attest/SHWP-HOST-SELF-ATTEST-001.json'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate retained self-attest completion evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('control/worker-registry.json').read_text())
          task=next(x for x in registry['tasks'] if x['task_id']=='SHWP-HOST-SELF-ATTEST-001')
          receipt=json.loads(Path('receipts/host-self-attest/SHWP-HOST-SELF-ATTEST-001.json').read_text())
          assert task['state']=='COMPLETED'
          assert task['claim_id'] is None and task['worker_id'] is None
          assert task['archive_eligible'] is True
          assert receipt['completed'] is True
          assert receipt['provider_is_heartbeat_timing_authority'] is False
          assert receipt['provider_or_host_liveness_grants_execution_authority'] is False
          print('HOST_SELF_ATTEST_RETAINED_EVIDENCE_PASS')
          PY

      - name: Prove hosted activation and persistence are retired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/activate-host-self-attest-worker.yml').read_text(encoding='utf-8').splitlines()
          stripped=[line.strip() for line in lines]
          assert 'permissions: {}' in stripped
          assert 'contents: write' not in stripped
          assert not any(line.startswith('uses: actions/checkout@') for line in stripped)
          assert not any(line.startswith('uses: actions/setup-python@') for line in stripped)
          assert not any(line.startswith('git push ') for line in stripped)
          assert not any('scripts/run_heartbeat_runtime.py --cycles ' in line and '--dry-run' not in line for line in stripped)
          print('HOST_SELF_ATTEST_NON_AUTHORIZING_PASS')
          PY
