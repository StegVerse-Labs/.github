# Broad source directories are intentionally excluded from automatic main-branch
# validation when specialized validators already cover them. PR coverage remains broad.
name: Validate organization control plane - No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'checks/**'
      - 'scripts/validate_workflow_surface_hygiene.py'
      - 'scripts/validate_org_control_plane.py'
      - 'scripts/validate_handoff_execution_ownership.py'
      - 'scripts/validate_admissible_existence_control_plane.py'
      - 'scripts/validate_heartbeat_carrier_contract.py'
      - 'scripts/validate_heartbeat_runtime_separation.py'
      - 'scripts/check_org_operational_observer.py'
      - 'scripts/check_org_repository_inventory.py'
      - 'scripts/check_org_completion_dashboard.py'
      - 'scripts/validate_session_assistance_scope.py'
      - 'scripts/check_required_terms.py'
      - 'scripts/check_org_aggregation_manifest.py'
      - 'scripts/allocate_claims.py'
      - 'scripts/reconcile_checkins.py'
      - 'tools/validate_active_worker_states.py'
      - 'tests/test_heartbeat_runtime_separation.py'
      - 'tests/test_independent_heartbeat_oscillator.py'
      - 'tests/test_heartbeat_carrier_envelope.py'
      - 'tests/test_cross_repository_dependency_claims.py'
      - 'tests/test_session_assistance_scope.py'
      - '.github/workflows/org-control-plane-validate.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'control/**'
      - 'events/**'
      - 'schemas/**'
      - 'tasks/**'
      - 'scripts/**'
      - 'checks/**'
      - 'heartbeat_runtime/**'
      - 'tools/validate_active_worker_states.py'
      - 'tests/**'
      - 'handoffs/**'
      - 'docs/**'
      - '.github/workflows/org-control-plane-validate.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: org-control-plane-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/stegverse-ci-bin
          ln -sf "$(command -v python3)" /tmp/stegverse-ci-bin/python
          echo /tmp/stegverse-ci-bin >> "$GITHUB_PATH"

      - name: Fail closed on unregistered workflow proliferation
        run: python scripts/validate_workflow_surface_hygiene.py

      - name: Validate control-plane invariants
        run: python scripts/validate_org_control_plane.py
      - name: Validate active-worker ownership invariant
        run: python tools/validate_active_worker_states.py
      - name: Validate handoff execution ownership partitions
        run: python scripts/validate_handoff_execution_ownership.py
      - name: Validate Admissible-Existence handoff and worker-registry conformance
        run: python scripts/validate_admissible_existence_control_plane.py
      - name: Validate canonical heartbeat carrier contract
        run: python scripts/validate_heartbeat_carrier_contract.py
      - name: Validate heartbeat runtime/control-plane semantic separation
        run: python scripts/validate_heartbeat_runtime_separation.py
      - name: Test heartbeat runtime/control-plane semantic separation
        run: python -m unittest tests.test_heartbeat_runtime_separation -v
      - name: Test independent 10ms heartbeat oscillator and capacity separation
        run: python -m unittest tests.test_independent_heartbeat_oscillator tests.test_heartbeat_carrier_envelope -v
      - name: Prove cross-repository dependency collision enforcement
        run: python -m unittest tests.test_cross_repository_dependency_claims -v

      - name: Validate organization continuation and aggregation surfaces
        run: |
          python3 scripts/check_org_operational_observer.py
          python3 scripts/check_org_repository_inventory.py
          python3 scripts/check_org_completion_dashboard.py
          python3 scripts/validate_session_assistance_scope.py
          python3 -m unittest tests.test_session_assistance_scope -v
          python3 scripts/check_required_terms.py docs/ORG_MIRROR_HANDOFF.md checks/org_mirror_handoff_terms.txt
          python3 scripts/check_org_aggregation_manifest.py

      - name: Exercise allocator deterministically without persistence authority
        run: |
          before="$(sha256sum control/claims-active.json 2>/dev/null || true)"
          python scripts/allocate_claims.py
          python scripts/validate_org_control_plane.py
          after="$(sha256sum control/claims-active.json 2>/dev/null || true)"
          echo "allocator local before=${before} after=${after}"
          echo 'Allocator mutations are runner-local validation evidence only; this workflow never commits or pushes them.'
      - name: Validate check-in reconciliation
        run: python scripts/reconcile_checkins.py
      - name: Validate JSON and JSONL syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('.').glob('control/**/*.json')) + sorted(Path('.').glob('schemas/**/*.json')) + sorted(Path('.').glob('tasks/**/*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          for path in sorted(Path('.').glob('events/**/*.jsonl')):
              for line in path.read_text(encoding='utf-8').splitlines():
                  json.loads(line)
          print('ORG_CONTROL_JSON_JSONL_PASS')
          PY
      - name: Prove validation has no GitHub authority-bearing constructs
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/org-control-plane-validate.yml').read_text(encoding='utf-8')
          pieces=(
              ('contents', ': write'),
              ('git', ' push'),
              ('actions/', 'checkout@'),
              ('actions/', 'setup-python@'),
              ('secrets.', 'GITHUB_TOKEN'),
              ('github.', 'token'),
          )
          found=[a+b for a,b in pieces if a+b in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('ORG_CONTROL_VALIDATION_NON_AUTHORIZING_PASS')
          PY
