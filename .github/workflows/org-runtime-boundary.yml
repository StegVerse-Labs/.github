name: Validate Organization Resident Runtime and Interlock-InTr Boundary

on:
  pull_request:
    paths:
      - 'org-runtime/**'
      - 'ORG_RESIDENT_RUNTIME_INTR_BOUNDARY_MIRROR_HANDOFF.md'
      - 'resident-runtime/organization_manifest_ingress.py'
      - 'resident-runtime/organization_role_conformance.py'
      - 'org-boundary/registry/services.json'
      - 'tests/test_organization_role_conformance_ingress.py'
      - 'tests/test_organization_manifest_ingress_rule_ref.py'
      - 'tests/test_organization_manifest_ingress_append_owner.py'
      - 'tests/test_manifest_governance_universal_intr_binding.py'
      - 'tests/test_manifest_ingress_idempotent.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_repo_ledger_exact_retry.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_batch_custody.py'
      - 'workers/manifest_state_transition_intr_ingress.py'
      # Experiment 3 wire binding against the pinned SDK, from the retired
      # validate-purpose-bound-worker-derived-lifetime.yml (#3039 H6b); its path list
      # is kept whole so the wire test runs on every change it ran on before.
      - 'handoffs/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json'
      - 'tests/test_sdk_tt_purpose_bound_worker_runtime_path.py'
      - 'tests/test_generic_manifest_worker_profile_binding.py'
      - 'tests/test_manifest_state_transition_intr_ingress.py'
      - 'tests/test_shwp_manifest_parent_consumer.py'
      - 'tests/test_shwp_manifest_invocation.py'
      - 'workers/shwp_manifest_parent_consumer.py'
      - 'scripts/consume_shwp_manifest_invocation.py'
      - 'tests/test_sdk_manifest_diagnostic_admitted_consumer.py'
      - 'tests/test_mir_exp3_original_resident_request.py'
      - 'scripts/consume_mir_exp3_original_request.py'
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'tests/test_mir_sv_exp3_cross_owner_wire_binding.py'
      - 'workers/sdk_manifest_diagnostic_admitted_consumer.py'
      - 'workers/universal_intr_profiled_ingress.py'
      - 'data/canonical-task-records/SDK-TT-PURPOSE-BOUND-WORKER-RUNTIME-PROOF-001.json'
      - 'data/canonical-task-registry.json'
      - 'tests/test_sdk_tt_richard_atomic_activation_seam.py'
      - 'tests/test_sdk_tt_richard_seam_resident_carriage.py'
      - 'tests/test_sdk_tt_richard_seam_resident_materialization.py'
      - 'tests/test_sdk_tt_richard_seam_control_plane_package.py'
      - 'scripts/build_control_plane_source_package_reusable.py'
      - 'tests/test_reusable_control_plane_source_package.py'
      - 'heartbeat_runtime/worker_runtime_legacy.py'
      - 'scripts/consume_kv_publisher_return_materialization_request.py'
      - 'tests/test_organization_record_gates_not_master_records.py'
      - 'workers/canonical_state_transition_custody.py'
      - 'heartbeat_runtime/process_adapter.py'
      - 'workers/stegagents_governed_runtime_worker.py'
      - 'handoffs/SDK-TT-RICHARD-SEAM-AUTHENTIC-RUNTIME-001.json'
      - 'control/worker-registry.d/sdk-tt-richard-seam-authentic-runtime-001.json'
      - 'control/resident-execution-request.d/sdk-tt-richard-seam-authentic-runtime-001.json'
      - 'scripts/consume_sdk_tt_richard_seam_authentic_runtime_request.py'
      - 'scripts/consume_stegagents_governed_runtime_targeted_request.py'
      - 'tests/test_stegagents_governed_runtime_targeted_resident_bridge.py'
      - 'docs/SDK_TT_PURPOSE_BOUND_WORKER_RUNTIME_PROOF_MIRROR_HANDOFF.md'
      - '.github/workflows/org-runtime-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'org-runtime/**'
      - 'ORG_RESIDENT_RUNTIME_INTR_BOUNDARY_MIRROR_HANDOFF.md'
      - 'resident-runtime/organization_manifest_ingress.py'
      - 'resident-runtime/organization_role_conformance.py'
      - 'org-boundary/registry/services.json'
      - 'tests/test_organization_role_conformance_ingress.py'
      - 'tests/test_organization_manifest_ingress_rule_ref.py'
      - 'tests/test_organization_manifest_ingress_append_owner.py'
      - 'tests/test_manifest_governance_universal_intr_binding.py'
      - 'tests/test_manifest_ingress_idempotent.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_repo_ledger_exact_retry.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_batch_custody.py'
      - 'workers/manifest_state_transition_intr_ingress.py'
      - '.github/workflows/org-runtime-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The ingress admits an organization-role conformance manifest with the
      # pinned SDK's own validation, route resolution and derivation, so the
      # SDK that publishes stegverse.route.organization-role-conformance.v1 is
      # installed rather than stubbed.
      - name: Install the pinned StegVerse SDK
        run: |
          set -eu
          SDK_SHA=c30dc3421f10f8855d85e8347c59884d8af792eb
          curl -fsSL "https://github.com/StegVerse-org/StegVerse-SDK/archive/${SDK_SHA}.tar.gz" -o /tmp/stegverse-sdk.tgz
          mkdir /tmp/stegverse-sdk
          tar -xzf /tmp/stegverse-sdk.tgz -C /tmp/stegverse-sdk --strip-components=1
          python -m pip install --quiet /tmp/stegverse-sdk
          python -c 'import stegverse.organization_role_conformance_processor'
      # From the retired validate-purpose-bound-worker-derived-lifetime.yml (#3039 H6b),
      # which fetched and installed this same pinned SDK on its own. The wire
      # test now reuses the install above, so the SDK is fetched once, not twice.
      - name: Validate exact frozen Experiment 3 wire against merged SDK owner
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          STEGVERSE_SDK_SOURCE_ROOT=/tmp/stegverse-sdk python -m unittest -v tests.test_mir_sv_exp3_cross_owner_wire_binding
      - name: Validate organization boundary
        run: |
          python org-runtime/runtime_boundary.py validate | tee /tmp/org-boundary.json
          python -c 'import json; x=json.load(open("/tmp/org-boundary.json")); assert x["valid"] is True; assert x["authority_effect"]=="NONE_VALIDATION_ONLY"'
      - name: Validate activation request generation
        run: |
          python org-runtime/runtime_boundary.py activation-request --runtime-id validation-resident | tee /tmp/activation.json
          python -c 'import json; x=json.load(open("/tmp/activation.json")); assert x["state"]=="REQUESTED"; assert x["request_granted_authority"] is False; assert x["github_token_runtime_authority"]=="NONE"'
      - name: Validate Interlock/InTr ingress generation
        run: |
          python org-runtime/runtime_boundary.py ingress --peer-org validation-peer --interlock-id validation-interlock --payload-sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --transition-elements-ref validation-transition-elements | tee /tmp/ingress.json
          python -c 'import json; x=json.load(open("/tmp/ingress.json")); assert x["direction"]=="INGRESS"; assert x["protocol"]=="InTr"; assert x["authority_effect_resolution"]=="DERIVED_FROM_APPLICABLE_TRANSITION_ELEMENTS"'
      - name: Validate Interlock/InTr egress generation
        run: |
          python org-runtime/runtime_boundary.py egress --peer-org validation-peer --interlock-id validation-interlock --payload-sha256 fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 --transition-elements-ref validation-transition-elements | tee /tmp/egress.json
          python -c 'import json; x=json.load(open("/tmp/egress.json")); assert x["direction"]=="EGRESS"; assert x["protocol"]=="InTr"; assert x["github_token_runtime_authority"]=="NONE"'

      - name: Validate SDK manifest ingress capability binding
        run: |
          python org-runtime/runtime_boundary.py resolve-ingress --profile-id sdk-manifest-ingress --profile-name SDK:ManifestIngress --operation SUBMIT_MANIFEST | tee /tmp/sdk-ingress.json
          python -c 'import json; x=json.load(open("/tmp/sdk-ingress.json")); assert x["owner_repository"]=="StegVerse-Labs/.github"; assert x["receiving_operation"]["operation_id"]=="ORGANIZATION_SDK_MANIFEST_INGRESS"; assert x["receiving_operation"]["operation"]=="resident-runtime/organization_manifest_ingress.py"; assert x["receiving_operation"]["address_form"]=="REPOSITORY_OWNED_OPERATION_NOT_HOST_OR_URL"; assert x["receiving_operation"]["host_required"] is False; assert x["receiving_operation"]["environment_url_required"] is False; assert x["environment_inputs"]==[]; assert x["authority_effect"]=="NONE_BINDING_ONLY"; assert x["grants_routing_authority"] is False; assert x["grants_admission_authority"] is False; assert x["grants_execution_authority"] is False'

      # The ingress binds this run's revision into every organization receipt it
      # writes and, when it runs in Actions, appends only receipt_id,
      # receipt_sha256, recomputation_rule_ref, run id and commit to the step
      # summary. Live receipts are never committed; this validates the binding
      # against temporary ledgers only.
      - name: Validate organization receipt revision binding
        run: python -m unittest -v tests/test_organization_manifest_ingress_rule_ref.py

      # Both ingress appends go through the organization ledger's own owner,
      # `aggregate_transition`: batch parent manifest applicability, the shared
      # heartbeat reference, the typed partial commit and packet-release
      # equivalence with the worker path. Temporary ledgers only.
      - name: Validate organization append owner from manifest ingress
        run: python -m unittest -v tests/test_organization_manifest_ingress_append_owner.py

      # One manifest is one transition however many times it is delivered: a
      # replay returns the recorded receipts, against temporary ledgers only.
      - name: Validate manifest ingress is idempotent per transition
        run: python -m unittest -v tests/test_manifest_ingress_idempotent.py
      - name: Validate the repository chain fails closed on a break and an exact retry matches in full
        run: python -m unittest -v tests/test_repo_ledger_exact_retry.py

      # A StegDB role-conformance request is admitted by this ingress on the
      # pinned SDK's published route, the request riding
      # extensions.stegverse_organization_role_conformance_request: the
      # terminal ALLOW, DENY or FAIL_CLOSED is committed in the organization
      # receipt; a shape the SDK refuses is recorded with its predicate; exact
      # retry is idempotent; an empty outbox is NO_EVENT. Temporary source and
      # ledger roots only.
      - name: Validate organization-role conformance admission on the manifest ingress
        env:
          STEGVERSE_SDK_REQUIRED: '1'
        run: python -m unittest -v tests/test_organization_role_conformance_ingress.py
