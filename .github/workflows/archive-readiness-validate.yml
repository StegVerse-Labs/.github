# Archive-readiness validation is credential-clean hosted CI only; it is never
# runtime or archive authority. Main-branch state/projection persistence is excluded
# from automatic runs; validator source changes still run, and PRs retain full coverage.
name: Archive Readiness Validate - No GitHub Token Authority

on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_archive_readiness.py'
      - 'tests/test_archive_readiness.py'
      - '.github/workflows/archive-readiness-validate.yml'
  pull_request:
    paths:
      - 'control/archive-readiness.json'
      - 'control/worker-registry.json'
      - 'scripts/validate_archive_readiness.py'
      - 'tests/test_archive_readiness.py'
      - 'docs/ORG_MIRROR_HANDOFF.md'
      - 'docs/ARCHIVE_GATE_PROGRESS_MIRROR_HANDOFF.md'
      - '.github/workflows/archive-readiness-validate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Prove no GitHub credential token is present
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_PAT:-}"
          echo NO_GITHUB_CREDENTIAL_TOKEN_PRESENT

      - name: Validate machine archive gate
        run: python3 scripts/validate_archive_readiness.py

      - name: Test archive semantics
        run: python3 -m unittest tests.test_archive_readiness

      - name: Prove workflow has no authority-bearing GitHub constructs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/archive-readiness-validate.yml').read_text(encoding='utf-8')
          forbidden=[
              'contents' + ': write',
              'git' + ' push',
              'actions/' + 'checkout@',
              'actions/' + 'setup-python@',
              '$' + '{{ ' + 'secrets.'
          ]
          found=[needle for needle in forbidden if needle in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('ARCHIVE_GATE_NON_AUTHORIZING_PASS')
          PY
