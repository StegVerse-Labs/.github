name: Validate Ecosystem Receipt HB Successor

on:
  pull_request:
    paths:
      - 'workers/canonical_state_transition_custody.py'
      - 'scripts/consume_ecosystem_receipt_hb_checkpoint.py'
      - 'scripts/dispatch_resident_execution_requests.py'
      - 'scripts/refresh_sovereign_worker_runtime_source.py'
      - 'heartbeat_runtime/master_records_checkpoint_commitment.py'
      - 'tests/test_receipt_hb_creation_reference.py'
      - 'tests/test_master_records_checkpoint_commitment.py'
      - 'tests/test_ecosystem_receipt_hb_checkpoint_observer.py'
      - 'tests/test_hb_receipt_worker_custody_binding.py'
      - '.github/workflows/validate-ecosystem-receipt-hb-successor.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Validate receipt creation HB reference and checkpoint commitment
        run: |
          python -m pytest -q             tests/test_receipt_hb_creation_reference.py \
            tests/test_master_records_checkpoint_commitment.py \
            tests/test_ecosystem_receipt_hb_checkpoint_observer.py \
            tests/test_hb_receipt_worker_custody_binding.py
