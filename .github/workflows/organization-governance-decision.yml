name: Organization governance decision

# Decide the governance requests an emitting organization queued on its own
# federation mesh, and publish this organization's answers on its own
# refs/stegverse/federation-mesh. The emitting organization's mesh locator is
# supplied as git+https://github.com/<org>/<repo>#refs/<name>; nothing about the
# source is inferred. Action is by manifest: a decision request committed under
# .stegverse/governance-decision-requests/ (schema
# stegverse.organization-governance-decision-request/v1) declares mesh_root, and
# the push that lands it starts this run. A dispatch is still accepted, not
# required (resident-runtime/mesh_source_binding.py resolve_mesh_root). The source is read anonymously. The only
# ref this workflow writes is this repository's own refs/stegverse/federation-mesh,
# fast-forward only.
#
# The organization ledger is opened by organization_store() exactly as
# org-contract.json declares it: git, PRIVATE, on this repository's designated
# refs/stegverse/organization-ledger (the location structure StegVerse-org/.github
# declares). It is materialized into this checkout's git directory before the
# cycle, published fast-forward only after the mesh, and read back from a fresh
# fetch; a decision whose receipt is not on the read-back chain fails the run.
# The repository ledger stays run-scoped; its receipts are retained in the
# organization ledger as source receipts. A FAIL_CLOSED governance decision is a
# decision and is answered; only a FAIL_CLOSED of this run itself fails the job.
#
# The decision authority is StegCore, pinned in exactly one place,
# org-runtime/decision-authority.json. StegCore is public (owner decision relayed
# on StegVerse-org/StegVerse-SDK#465): every run fetches the pinned commit
# anonymously, with no repository secret and no GitHub-generated token, checks
# that the checkout is that commit, and installs it from that checkout only. A
# run that cannot fetch or install it fails before the cycle, so no request is
# ever answered without StegCore.
on:
  push:
    branches: [main]
    paths:
      - '.stegverse/governance-decision-requests/**'
  workflow_dispatch:
    inputs:
      mesh_root:
        description: Emitting organization's mesh locator, git+https://github.com/<org>/<repo>#refs/<name>
        required: true
        type: string

concurrency:
  group: organization-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    env:
      OWN_URL: https://github.com/${{ github.repository }}
      GIT_AUTHOR_NAME: StegVerse
      GIT_AUTHOR_EMAIL: 210078727+StegVerse@users.noreply.github.com
      GIT_COMMITTER_NAME: StegVerse
      GIT_COMMITTER_EMAIL: 210078727+StegVerse@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The runner context is not available in job-level env, so the evidence
      # directory is exported once here for every later step.
      - name: Locate the evidence directory
        run: echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"

      - name: Resolve the emitting organization's mesh from the committed decision request or the dispatch
        env:
          DISPATCH_MESH_ROOT: ${{ inputs.mesh_root }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '.stegverse/governance-decision-requests/*.json' > "$RUNNER_TEMP/changed.txt"
          fi
          if ! resolved=$(python resident-runtime/mesh_source_binding.py --mesh-root "$DISPATCH_MESH_ROOT" \
              --resolve-changed "$RUNNER_TEMP/changed.txt"); then
            echo "$resolved"; exit 1
          fi
          echo "$resolved"
          python -c 'import json,sys; print("MESH_ROOT=" + json.loads(sys.argv[1])["mesh_root"])' "$resolved" >> "$GITHUB_ENV"

      - name: Bind the source
        run: python resident-runtime/mesh_source_binding.py --mesh-root "$MESH_ROOT" --out "$EVIDENCE/binding.json"

      - name: Materialize the durable queue
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          materialize --work "$RUNNER_TEMP/work" --mesh "$RUNNER_TEMP/mesh" --own-url "$OWN_URL"

      # Only the pinned commit is installed, from its own checkout, with --no-deps;
      # its declared dependencies come from the pin, each ==, and nothing else.
      - name: Fetch and install the decision authority (StegCore) at the pin
        run: |
          set -eu
          source="$RUNNER_TEMP/stegcore"
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE" \
            authority-fetch --dest "$source"
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE" \
            authority-requirements --source "$source" --out "$RUNNER_TEMP/stegcore-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/stegcore-requirements.txt"
          python -m pip install --no-deps "$source"
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE" evaluator --installed --source "$source"

      - name: Run the cycle
        env:
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          # The ledger ref lives in this checkout's git directory, so publishing it
          # uses the job's own contents: write credential for this repository only.
          STEGVERSE_ORG_LEDGER_GIT_DIR: ${{ github.workspace }}/.git
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          cycle --mesh "$RUNNER_TEMP/mesh" --node-state "$RUNNER_TEMP/node-state"
          --repo-ledger "$RUNNER_TEMP/repo-ledger"

      - name: Publish answers
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          publish --mesh "$RUNNER_TEMP/mesh" --work "$RUNNER_TEMP/work"
          --push-repo "$GITHUB_WORKSPACE" --remote origin

      - name: Publish the organization ledger (after the mesh, fast-forward only)
        env:
          STEGVERSE_ORG_LEDGER_GIT_DIR: ${{ github.workspace }}/.git
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          ledger-publish

      - name: Read back
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          readback --work "$RUNNER_TEMP/work" --own-url "$OWN_URL"

      - name: Read the organization ledger back from a fresh fetch
        run: >-
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE"
          ledger-readback --work "$RUNNER_TEMP/work" --own-url "$OWN_URL"

      - name: Evidence
        if: ${{ always() }}
        run: |
          python resident-runtime/organization_governance_decision.py --evidence "$EVIDENCE" \
            report --mesh-root "$MESH_ROOT" > "$RUNNER_TEMP/report.out" && status=0 || status=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          report = json.load(open(os.path.join(os.environ["EVIDENCE"], "report.json")))
          print("### Organization governance decision")
          print(f"- workflow_disposition: `{report['workflow_disposition']}`")
          print(f"- ledger_persistence: `{report['ledger_persistence']}`")
          print(f"- decision_authority_installed: `{report['decision_authority_installed']}`"
                f" commit `{report['decision_authority_commit']}`")
          print(f"- own ref tip: `{report['own_tip_after']}`")
          for d in report["decisions"]:
              answer = d.get("answer") or {}
              print(f"- {d['request_packet_id']}: `{d['disposition']}` {d['reason']} -> `{answer.get('key')}`")
          if report["fail_closed"]:
              print(f"- FAIL_CLOSED: `{report['fail_closed']['failure_code']}` {report['fail_closed']['failed_predicate']}")
          PY
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: organization-governance-decision-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 90
          if-no-files-found: warn
