name: Organization Heartbeat Watchdog - Manual Diagnostic / No GitHub Token Authority

# Diagnostic-only. This workflow does not own heartbeat cadence, scheduling,
# worker activation, execution authority, or durable monitoring.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Measure expected returns without authoritative mutation
        run: |
          python3 scripts/watch_heartbeat_returns.py
          git diff -- heartbeats/watchdog warrants
          git diff --quiet -- control/heartbeat-state.json control/worker-registry.json

      - name: Assert diagnostic authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('heartbeats/watchdog').glob('epoch-*.json'))
          if not files:
              raise SystemExit('no watchdog diagnostic produced')
          value=json.loads(files[-1].read_text())
          assert value.get('authority_effect')=='none',value
          print('WATCHDOG_DIAGNOSTIC_NON_AUTHORITATIVE_PASS')
          PY
