name: Organization heartbeat watchdog (manual diagnostic)

# Diagnostic-only. This workflow does not own heartbeat cadence, scheduling,
# worker activation, execution authority, or durable monitoring. The canonical
# heartbeat runtime owns its internal epoch sequence and lifecycle decisions.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: org-heartbeat-watchdog-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure expected returns without mutation
        run: |
          python scripts/watch_heartbeat_returns.py
          git diff -- heartbeats/watchdog warrants
          git diff --quiet -- control/heartbeat-state.json control/worker-registry.json
      - name: Assert diagnostic authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('heartbeats/watchdog').glob('epoch-*.json'))
          if not files:
              raise SystemExit('no watchdog diagnostic produced')
          value = json.loads(files[-1].read_text())
          assert value.get('authority_effect') == 'none', value
          print('WATCHDOG_DIAGNOSTIC_NON_AUTHORITATIVE_PASS')
          PY
