name: Organization heartbeat watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */8 * * *'
permissions:
  contents: write
concurrency:
  group: org-heartbeat-watchdog
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure expected returns
        run: python scripts/watch_heartbeat_returns.py
      - name: Commit watchdog evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartbeats/watchdog warrants
          git diff --cached --quiet || git commit -m "Record heartbeat watchdog observation"
          git push
