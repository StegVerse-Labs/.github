name: Validate generic Master Records predecessor closure
on:
  pull_request:
    paths:
      - 'workers/canonical_state_transition_custody.py'
      - 'tests/test_canonical_transition_predecessor_closure.py'
      - '.github/workflows/validate-canonical-predecessor-closure.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_canonical_transition_predecessor_closure.py
