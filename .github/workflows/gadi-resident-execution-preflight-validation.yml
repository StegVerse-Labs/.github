name: GADI Resident Execution Preflight Validation
on:
  pull_request:
    paths:
      - 'scripts/preflight_gadi_resident_execution.py'
      - 'tests/test_gadi_resident_execution_preflight.py'
      - '.github/workflows/gadi-resident-execution-preflight-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -r .github/ci-requirements.txt
      - run: python -m pytest -q tests/test_gadi_resident_execution_preflight.py
