name: Org Aggregation Check - No GitHub Token Authority

on:
  workflow_dispatch: {}
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - "checks/**"
      - ".github/workflows/org-aggregation-check.yml"

permissions: {}

jobs:
  org-aggregation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Validate observer standard
        run: python3 scripts/check_org_operational_observer.py

      - name: Validate repository inventory
        run: python3 scripts/check_org_repository_inventory.py

      - name: Validate dashboard
        run: python3 scripts/check_org_completion_dashboard.py

      - name: Validate org mirror terms
        run: python3 scripts/check_required_terms.py docs/ORG_MIRROR_HANDOFF.md checks/org_mirror_handoff_terms.txt

      - name: Validate aggregation manifest
        run: python3 scripts/check_org_aggregation_manifest.py
