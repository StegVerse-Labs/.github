name: Sovereign Ephemeral Console Validation

on:
  push:
    paths:
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - '.github/workflows/sovereign-ephemeral-console.yml'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'control/session-implementation-claim-2026-08-15-sovereign-ephemeral-console.json'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject runtime credentials
        shell: bash
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${TVC_TOKEN:-}"
      - name: Compile console verifier and G18 worker
        run: |
          python -m py_compile \
            scripts/run_sovereign_ephemeral_console.py \
            scripts/restart_sovereign_ephemeral_node.py \
            scripts/verify_sovereign_runtime_activation.py \
            workers/sovereign_runtime_activation_worker.py \
            tests/test_sovereign_ephemeral_console.py
      - name: Run deterministic console tests
        run: python -m unittest -v tests.test_sovereign_ephemeral_console
      - name: Verify G18 automatically owns fallback
        shell: bash
        run: |
          set -eu
          grep -q 'run_sovereign_ephemeral_console.py' workers/sovereign_runtime_activation_worker.py
          grep -q 'physical_additional_machine_required' workers/sovereign_runtime_activation_worker.py
          grep -q 'SOVEREIGN_EPHEMERAL_CONSOLE_VERIFIED' workers/sovereign_runtime_activation_worker.py
          echo 'G18_ONE_HOST_FALLBACK_BOUND'
      - name: Prove hosted runner is validation only
        shell: bash
        run: |
          set -eu
          rm -rf /tmp/stegverse-ephemeral-console-validation
          python scripts/run_sovereign_ephemeral_console.py \
            --validation-only \
            --console-root /tmp/stegverse-ephemeral-console-validation \
            > /tmp/ephemeral-console-validation.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ephemeral-console-validation.json'))
          assert p['state']=='VALIDATION_ONLY', p
          assert p['hosted_environment_observed'] is True, p
          assert p['physical_additional_machine_required'] is False, p
          assert p['third_party_runtime_required'] is False, p
          assert p['credential_authority']=='TV/TVC', p
          assert p['canonical_proof_promoted'] is False, p
          print('HOSTED_VALIDATION_ONLY_PASS')
          PY
      - name: Assert production activation is not claimed
        run: |
          set -eu
          ! test -e /tmp/stegverse-ephemeral-console-validation/ephemeral-console.latest.json
          echo 'PRODUCTION_ACTIVATION_NOT_CLAIMED'
