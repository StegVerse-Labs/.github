name: Sovereign Ephemeral Console Validation - No GitHub Token Authority

# Validation-only console/supervision surface. Main-branch runtime blocker and
# handoff persistence is excluded from automatic hosted CI; executable source,
# tests, the continuity contract, and this workflow still validate automatically.
on:
  push:
    paths:
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - 'tests/test_ephemeral_separated_runtime_supervision.py'
      - '.github/workflows/sovereign-ephemeral-console.yml'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
  pull_request:
    paths:
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - 'tests/test_ephemeral_separated_runtime_supervision.py'
      - '.github/workflows/sovereign-ephemeral-console.yml'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Reject runtime credentials
        shell: bash
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${TVC_TOKEN:-}"

      - name: Compile console verifier and separated-runtime supervisor
        run: |
          python -m py_compile \
            scripts/run_sovereign_ephemeral_console.py \
            scripts/restart_sovereign_ephemeral_node.py \
            scripts/verify_sovereign_runtime_activation.py \
            workers/sovereign_runtime_activation_worker.py \
            tests/test_sovereign_ephemeral_console.py \
            tests/test_ephemeral_separated_runtime_supervision.py

      - name: Run deterministic console and separated-runtime tests
        run: |
          python -m unittest -v \
            tests.test_sovereign_ephemeral_console \
            tests.test_ephemeral_separated_runtime_supervision

      - name: Verify optional resident fallback remains separated and non-authorizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/sovereign-ephemeral-console.yml').read_text(encoding='utf-8')
          forbidden=['contents'+': write','git'+' push','actions/'+'checkout@','actions/'+'setup-python@','$'+'{{ '+'secrets.']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'permissions: {}' in text
          print('SOVEREIGN_EPHEMERAL_VALIDATION_NON_AUTHORIZING_PASS')
          PY
