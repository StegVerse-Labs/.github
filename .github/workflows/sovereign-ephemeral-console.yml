name: Sovereign Ephemeral Console Validation - No GitHub Token Authority

on:
  push:
    paths:
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - 'tests/test_ephemeral_separated_runtime_supervision.py'
      - '.github/workflows/sovereign-ephemeral-console.yml'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
  pull_request:
    paths:
      - 'scripts/run_sovereign_ephemeral_console.py'
      - 'scripts/restart_sovereign_ephemeral_node.py'
      - 'scripts/verify_sovereign_runtime_activation.py'
      - 'workers/sovereign_runtime_activation_worker.py'
      - 'tests/test_sovereign_ephemeral_console.py'
      - 'tests/test_ephemeral_separated_runtime_supervision.py'
      - '.github/workflows/sovereign-ephemeral-console.yml'
      - 'handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json'
      - 'management/SHWP_RUNTIME_ACTIVATION_BLOCKER.json'
      - 'management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub credential token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Reject runtime credentials
        shell: bash
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${TVC_TOKEN:-}"

      - name: Compile console verifier and separated-runtime supervisor
        run: |
          python -m py_compile \
            scripts/run_sovereign_ephemeral_console.py \
            scripts/restart_sovereign_ephemeral_node.py \
            scripts/verify_sovereign_runtime_activation.py \
            workers/sovereign_runtime_activation_worker.py \
            tests/test_sovereign_ephemeral_console.py \
            tests/test_ephemeral_separated_runtime_supervision.py

      - name: Run deterministic console and separated-runtime tests
        run: |
          python -m unittest -v \
            tests.test_sovereign_ephemeral_console \
            tests.test_ephemeral_separated_runtime_supervision

      - name: Verify optional resident fallback remains separated and non-authorizing
        shell: bash
        run: |
          set -eu
          grep -q 'run_worker_runtime.py' scripts/restart_sovereign_ephemeral_node.py
          grep -q 'heartbeat_runtime.engine_v12.HeartbeatRuntime' scripts/run_sovereign_ephemeral_console.py
          grep -q 'heartbeat_runtime.worker_runtime.WorkerCoordinator' scripts/run_sovereign_ephemeral_console.py
          grep -q 'resident_native_supervision_optional' management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json
          grep -q 'always_on_external_host_required' management/SHWP_STATE_TRANSITION_CONTINUITY_CONTRACT.json
          grep -q 'scripts/advance_heartbeat_transition.py' handoffs/SHWP-DURABLE-RUNTIME-ACTIVATION.json
          echo 'OPTIONAL_ONE_HOST_SEPARATED_RUNTIME_FALLBACK_PASS'

      - name: Prove hosted runner is validation only
        shell: bash
        run: |
          set -eu
          rm -rf /tmp/stegverse-ephemeral-console-validation
          python scripts/run_sovereign_ephemeral_console.py \
            --validation-only \
            --console-root /tmp/stegverse-ephemeral-console-validation \
            > /tmp/ephemeral-console-validation.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ephemeral-console-validation.json'))
          assert p['state']=='VALIDATION_ONLY', p
          assert p['hosted_environment_observed'] is True, p
          assert p['physical_additional_machine_required'] is False, p
          assert p['third_party_runtime_required'] is False, p
          assert p['credential_authority']=='TV/TVC', p
          assert p['github_token_required'] is False, p
          assert p['non_tv_tvc_secret_or_token_used'] is False, p
          assert p['canonical_proof_promoted'] is False, p
          print('HOSTED_VALIDATION_ONLY_PASS')
          PY

      - name: Assert production activation is not claimed
        run: |
          set -eu
          ! test -e /tmp/stegverse-ephemeral-console-validation/ephemeral-console.latest.json
          echo 'PRODUCTION_ACTIVATION_NOT_CLAIMED'
