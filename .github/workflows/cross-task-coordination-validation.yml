permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous public checkout without GitHub token
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          git init .
          git remote add origin https://github.com/StegVerse-Labs/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - name: Validate Task Registry collision and generation fences
        run: |
          python -m unittest -v \
            tests.test_task_registry_collision_checkin \
            tests.test_sdk_untrusted_dependency_collision_checkin \
            tests.test_task_registration_substrate_resolution \
            tests.test_task_registry_session_gate_backlog \
            tests.test_task_registry_ai_session_ingress \
            tests.test_task_registry_general_checkin_surface_gate \
            tests.test_steghealth_kv_interlock_canonical_work_ingress \
            tests.test_erl_household_economic_conditions_runtime_binding \
            tests.test_erl_household_worker_evidence \
            tests.test_erl_household_targeted_consumer_priority \
            tests.test_canonical_work_resident_registry_preservation \
            tests.test_portable_refresh_targeted_execution \
            tests.test_ungoverned_ai_defensive_envelope_worker \
            tests.test_ungoverned_ai_defensive_envelope_consumer \
            tests.test_ephemeral_external_ai_org_first_components
          python -m py_compile workers/ungoverned_ai_defensive_envelope_worker.py workers/erl_household_economic_conditions_worker.py scripts/consume_ungoverned_ai_defensive_envelope_request.py
          python scripts/validate_task_registration_substrate_resolution.py
          python scripts/validate_org_control_plane.py
      - name: Validate coordination source
        run: |
          python -m py_compile heartbeat_runtime/coordination_graph.py heartbeat_runtime/coordination_ledger.py scripts/render_cross_task_coordination_handoff.py scripts/session_build_preflight.py scripts/resolve_machine_preflight_receipt.py
          python -m unittest -v tests.test_coordination_graph tests.test_coordination_required_field_values tests.test_coordination_ledger tests.test_cross_task_coordination_handoff_projection tests.test_session_build_preflight tests.test_preflight_supersession
          python - <<'PY'
          import json
          from pathlib import Path
          from heartbeat_runtime.coordination_ledger import load_composed_coordination_ledger
          from scripts.resolve_machine_preflight_receipt import resolve_current_preflight
          schema=json.loads(Path('schemas/cross-task-coordination.schema.json').read_text())
          base=json.loads(Path('control/cross-task-coordination.json').read_text())
          contract=json.loads(Path('management/session-build-preflight-contract.json').read_text())
          ledger=load_composed_coordination_ledger(Path('control/cross-task-coordination.json'))
          assert schema['properties']['schema']['const']==base['schema']==ledger['schema']
          assert ledger['authority']['runtime_truth_authority_effect']=='NONE'
          assert ledger['authority']['credential_authority']=='TV/TVC'
          assert ledger['authority']['github_token_runtime_authority']=='NONE'
          assert contract['cross_task_coordination']['required_before_new_work'] is True
          assert contract['cross_task_coordination']['runtime_truth_inferred'] is False
          assert contract['cross_task_coordination']['execution_admission_inferred'] is False
          fragment_ids=set(ledger.get('composition',{}).get('fragment_ids',[]))
          assert 'SV002-RESIDENT-REQUEST-PREDICATES-001' in fragment_ids
          assert 'SV011-RESIDENT-REQUEST-PREDICATES-001' in fragment_ids
          assert 'STEGVERSE001-RESIDENT-REQUEST-PREDICATES-001' in fragment_ids
          assert 'G18-ACTIVE-CLAIM-001' in fragment_ids
          predicate_ids={p.get('predicate_id') for p in ledger.get('predicates',[])}
          for required in (
              'PRED-RESIDENT-REQUEST-CONSUMED-SV002-ORG-RUNTIME-ACTIVATION-001',
              'PRED-RESIDENT-REQUEST-CONSUMED-SV002-PUBLIC-OBSERVATION-001',
              'PRED-RESIDENT-REQUEST-CONSUMED-SV011-PHASE5-BOUNDARY-001',
              'PRED-RESIDENT-REQUEST-CONSUMED-SV011-PHASE5-SOURCE-MATERIALIZATION-001',
              'PRED-RESIDENT-REQUEST-CONSUMED-STEGVERSE001-BOUNDED-AUTONOMY-001',
          ):
              assert required in predicate_ids
          active_claims={c.get('claim_id') for c in ledger.get('claims',[]) if c.get('state')=='ACTIVE'}
          assert 'SHWP-SHWP-DURABLE-RUNTIME-ACTIVATION-G18' in active_claims
          presence_preflight=resolve_current_preflight(Path('.'), 'receipts/preflight/CROSS-TASK-RUNTIME-PRESENCE-PREDICATE-001.json')
          assert presence_preflight['historical_state']=='PASS'
          assert presence_preflight['current_admissible'] is False
          assert presence_preflight['current_disposition']=='NOT_ADMISSIBLE_UNTIL_EXACT_RUNTIME_SUBJECT_BINDING_EXISTS'
          print('CROSS_TASK_COORDINATION_COMPOSED_NON_AUTHORITY_PASS')
          PY
