# ONE-SHOT RECOVERY TRIGGER: 2026-08-18T19:08Z
name: HB30 AED Recovery - One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hb30-aed-recovery-once.yml'

permissions:
  contents: write

concurrency:
  group: hb30-aed-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard exact recovery preconditions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          carrier=json.loads(Path('control/heartbeat-carrier-runtime-state.json').read_text())
          legacy=json.loads(Path('control/heartbeat-state.json').read_text())
          receipt=json.loads(Path('receipts/heartbeat-transition-continuity/latest.json').read_text())
          assert legacy['epoch']==29 and legacy['generation']==29
          assert carrier['epoch']==30 and carrier['generation']==30
          assert receipt['state']=='CARRIER_TRANSITION_COMPLETE'
          assert receipt['portable_receipt_sha256']=='931f4e756bf82ded9bc8a2fc1cfda4dae6edae0f9c95f3f9a47ca343b1a73855'
          assert receipt['all_release_predicates_pass'] is False
          print('HB30_AED_PRECONDITIONS_PASS')
          PY

      - name: Project HB30 worker control plane without advancing carrier
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project_worker_control_plane_from_carrier.py --root .
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('control/worker-control-plane-coordination.json').read_text())
          assert c['schema']=='stegverse.worker-control-plane-coordination/v1'
          assert c['observed_reference']['carrier_generation'] >= 30
          print('HB30_CONTROL_PLANE_PROJECTED')
          PY

      - name: Run one independent WorkerCoordinator cycle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_worker_runtime.py --cycles 1 --interval-ms 0 | tee /tmp/hb30-worker-cycle.jsonl

      - name: Require release closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          worker=json.loads(Path('control/worker-runtime-state.json').read_text())
          receipt=json.loads(Path('receipts/heartbeat-transition-continuity/latest.json').read_text())
          carrier=json.loads(Path('control/heartbeat-carrier-runtime-state.json').read_text())
          assert carrier['epoch']==30 and carrier['generation']==30, carrier
          assert worker['last_observed_carrier_epoch'] >= 30, worker
          assert receipt['all_release_predicates_pass'] is True, receipt
          assert receipt['predicates']['worker_runtime_checkpoint_observed_at_or_after_carrier_epoch'] is True
          assert receipt['predicates']['worker_control_plane_observed'] is True
          assert receipt['predicates']['no_duplicate_claim_or_fence'] is True
          assert receipt['predicates']['state_reconstruction_pass'] is True
          print('HB30_RELEASE_COMPLETE')
          PY

      - name: Persist recovery evidence and retire this fallback
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hb30-aed-recovery-once.yml
          git config user.name 'stegverse-hb-recovery'
          git config user.email 'stegverse-hb-recovery@users.noreply.github.com'
          git add control/worker-runtime-state.json \
                  control/worker-control-plane-coordination.json \
                  control/worker-registry.json \
                  control/worker-cost-observations.json \
                  receipts/heartbeat-transition-continuity/latest.json \
                  receipts/sovereign-runtime-activation/SHWP-DURABLE-RUNTIME-ACTIVATION.json \
                  checkpoints/workers \
                  events/worker-runtime.jsonl \
                  .github/workflows/hb30-aed-recovery-once.yml || true
          git diff --cached --quiet && { echo 'NO_RECOVERY_EVIDENCE_TO_COMMIT'; exit 1; }
          git commit -m 'heartbeat: close HB30 worker observation and retire AED fallback'
          git push origin HEAD:main
