name: Validate RTC008 carriage repair
on:
  pull_request:
    paths:
      - 'scripts/consume_kv_publisher_return_materialization_request.py'
      - 'workers/universal_intr_profiled_ingress.py'
      - 'tests/test_rtc008_mir_southbound_intr_admission.py'
      - '.github/workflows/validate-rtc008-carriage.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_rtc008_mir_southbound_intr_admission.py
