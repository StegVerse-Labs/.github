name: Organization Control Plane Parity
on:
  pull_request:
    paths:
      - 'org-runtime/interlock-intr.json'
      - 'org-boundary/**'
      - 'resident-runtime/**'
      - '.stegverse/transition-ledger/**'
      - 'data/organization-control-plane-parity-v1.json'
      - 'tests/test_organization_control_plane_parity.py'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pytest -q tests/test_organization_control_plane_parity.py
